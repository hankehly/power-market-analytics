description: >-
  e219 plus the temperature of every load lag window and its difference from
  D's forecast: the population-weighted observed temperature the D-2, D-7,
  day-type and similar-day lags were recorded under, and D's forecast minus
  each. The 21 temperature columns of the lag-window weather siblings (spec
  2026-09-29). Experiment #243.
