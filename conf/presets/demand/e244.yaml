description: >-
  e219 plus the solar radiation of every load lag window and its difference
  from D's forecast: the population-weighted observed radiation the D-2, D-7,
  day-type and similar-day lags were recorded under (7 of Tokyo's 21 weighted
  stations, 55.4 % of the area's weight), D's forecast daily mean, and D's
  forecast minus each. The 19 radiation columns of the lag-window weather
  siblings (spec 2026-09-29). Experiment #244.
base: e219
