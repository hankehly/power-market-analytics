description: >-
  Every feature of the seven marts we build ourselves, 104 columns as of
  2026-09-20: the Tokyo baseline's 23 in their order, then the other 81.
  The OCCTO 翌々日 forecast (ftr_day_occto, 2024-04-01 on) and the spot
  task's D-1 area price (ftr_period_jepx) are left out at the researcher's
  ruling. Experiment #212.
