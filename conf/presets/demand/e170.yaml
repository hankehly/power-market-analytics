description: >-
  Calendar, the recency-weighted same-hour temperature over D-8..D-2 at the
  representative station, the D-7 demand lag, and the MSM forecast temperature
  population-weighted over the area's stations (experiment #170, demand/R-002
  E-001). Until 2026-09-27 this was lightgbm_msm_popw, with the first four in
  its base preset lightgbm; runs from before then carry those names.
features:
  - ftr_day_calendar:month
  - ftr_day_calendar:day_of_week
  - ftr_hour_jma_obs:wavg_temperature_c
  - ftr_period_actuals:lag_7d_demand_kwh
  - ftr_hour_msm:popw_forecast_temperature_c
