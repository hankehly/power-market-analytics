sources:
  - name: jma
    schema: pma_raw
    description: >
      JMA (Japan Meteorological Agency) historical weather observations,
      scraped from https://www.data.jma.go.jp/risk/obsdl/ by
      scripts/download_jma_hourly.py and loaded by scripts/load_jma_hourly.py
      (full reload). The retrieval protocol and CSV formats are documented in
      docs/JMA-Weather-Data-Retrieval.md. Staffed stations only since the
      2026-08 re-scope (気象官署, s-prefixed station ids): a single
      7-element set (precipitation, temperature, wind, sunshine, snow depth,
      humidity, solar radiation) in one 27-column layout, with files stitched
      from two half-year requests per station-year. Hours run 01:00-24:00
      JST with 24:00 stored as 00:00 of the next day. Quality flags: 8
      normal, 5 quasi-normal, 4 insufficient, 2 questionable, 1 missing,
      0 not observed; value cells are empty when the flag is 2/1/0.
      Homogeneity numbers restart at 1 per REQUEST WINDOW (half-year), so in
      a stitched year file the numbering resets at the window boundary —
      only within-window changes mark observation-environment breaks, and a
      real break exactly on the boundary is invisible in the CSV alone.
    tables:
      - name: jma_hourly_staffed
        description: >
          Hourly observations from staffed stations (気象官署, s-prefixed
          station ids, e.g. s47662 = 東京), the sole source since the 2026-08
          re-scope. One row per station and hour; grain (station_id,
          observed_at) is enforced at load time. Files are stitched from two
          half-year requests per station-year into one 27-column layout
          across 7 elements (precipitation, temperature, wind, sunshine,
          snow depth, humidity, solar radiation), with 現象なし情報 columns
          on the phenomenon-recording elements (precipitation, sunshine,
          snow depth): 1 = no phenomenon that hour (the 0 value is a true
          zero), 0 = phenomenon occurred, null when the quality flag is
          2/1/0. Homogeneity numbers restart at 1 per REQUEST WINDOW
          (half-year), so in a stitched year file the numbering resets at
          the window boundary — only within-window changes mark
          observation-environment breaks, and a real break exactly on the
          boundary is invisible in the CSV alone. Load contract:
          conf/schemas/jma_hourly_staffed.yaml.
        columns:
          - name: station_id
            description: >
              JMA obsdl station id (e.g. s47662 = 東京), parsed from the file
              name. Joinable to dim_jma_station (jma_stations seed).
            data_tests:
              - not_null
          - name: observed_at
            description: >
              Observation hour (JST). Hour 24:00 is stored as 00:00 of the
              next day, so a calendar-year file spans Jan 1 01:00 through
              next Jan 1 00:00.
            data_tests:
              - not_null
          - name: precipitation_mm
            description: Precipitation in the past hour in mm (降水量(前1時間)).
          - name: precipitation_phenomenon_absent
            description: >
              現象なし情報 for precipitation: 1 = no precipitation occurred
              (value 0 is a true zero), 0 = precipitation occurred.
          - name: precipitation_quality_flag
            description: Quality flag for precipitation (品質情報).
          - name: precipitation_homogeneity_no
            description: Homogeneity number for precipitation (均質番号).
          - name: temperature_c
            description: Air temperature in °C (気温).
          - name: temperature_quality_flag
            description: Quality flag for temperature (品質情報).
          - name: temperature_homogeneity_no
            description: Homogeneity number for temperature (均質番号).
          - name: wind_speed_ms
            description: Wind speed in m/s (風速).
          - name: wind_speed_quality_flag
            description: Quality flag for wind speed (品質情報).
          - name: wind_direction
            description: >
              Wind direction as a 16-point compass word (北西 etc.) or 静穏
              (calm) (風向).
          - name: wind_direction_quality_flag
            description: >
              Quality flag for wind direction (品質情報). Null (empty cell
              instead of 0) at s47821 (阿蘇山) in the post-closure padding
              rows 2017-12-12..12-31, while the wind element is entirely
              unobserved (wind_speed_quality_flag 0).
          - name: wind_homogeneity_no
            description: Homogeneity number shared by wind speed and direction (均質番号).
          - name: sunshine_duration_h
            description: Sunshine duration in the past hour in hours (日照時間(前1時間)).
          - name: sunshine_phenomenon_absent
            description: >
              現象なし情報 for sunshine: 1 = no sunshine that hour (value 0 is
              a true zero), 0 = sunshine occurred.
          - name: sunshine_quality_flag
            description: Quality flag for sunshine duration (品質情報).
          - name: sunshine_homogeneity_no
            description: Homogeneity number for sunshine duration (均質番号).
          - name: snow_depth_cm
            description: >
              Snow depth at observed_at in cm (積雪の深さ). 0 with
              phenomenon_absent 1 is a confirmed no-snow hour; null value
              with null phenomenon_absent (quality 1) means snow is not
              tracked that hour (e.g. off-season).
          - name: snow_depth_phenomenon_absent
            description: >
              現象なし情報 for snow depth: 1 = confirmed no snow on the
              ground (value 0 is a true zero), 0 = snow present; null when
              snow is untracked or the quality flag is 2/1/0.
          - name: snow_depth_quality_flag
            description: Quality flag for snow depth (品質情報).
          - name: snow_depth_homogeneity_no
            description: Homogeneity number for snow depth (均質番号; resets per stitched half-year window).
          - name: humidity_pct
            description: Relative humidity at observed_at in percent (相対湿度).
          - name: humidity_quality_flag
            description: Quality flag for humidity (品質情報).
          - name: humidity_homogeneity_no
            description: Homogeneity number for humidity (均質番号; resets per stitched half-year window).
          - name: solar_radiation_mjm2
            description: Global solar radiation over the observation hour in MJ/m² (全天日射量(前1時間)).
          - name: solar_radiation_quality_flag
            description: Quality flag for solar radiation (品質情報).
          - name: solar_radiation_homogeneity_no
            description: Homogeneity number for solar radiation (均質番号; resets per stitched half-year window).
      - name: jma_msm_surface_forecast
        description: >
          JMA MSM (メソ数値予報モデル) GPV point-forecast extracts — one row per
          station, forecast reference run and forecast lead hour. This
          pipeline ingests a single vintage per delivery day D: the 12 UTC
          run of D-2 (21:00 JST), the latest run whose forecast horizon
          still covers every hour of D without leaking information past the
          demand-forecast model's 09:30 JST D-1 cutoff. Source: Kyoto
          University RISH's GRIB2 mirror of the JMA MSM surface grid
          (https://database.rish.kyoto-u.ac.jp/arch/jmadata/data/gpv/original/),
          downloaded and decoded per delivery day by MsmDownloader
          (scripts/download_jma_msm_surface_forecast.py) into one gzip CSV
          extract (msm_surface_YYYYMMDD.csv.gz, one row per station x
          forecast lead hour) and loaded by MsmForecastCsvLoader
          (scripts/load_jma_msm_surface_forecast.py). forecast_reference_at_utc
          and forecast_valid_at_utc are kept as raw-layer ISO 8601 UTC
          strings ("...Z") rather than parsed timestamps, to avoid
          session-timezone parsing ambiguity; std converts them to JST
          wall-clock. Grain: station_id, forecast_reference_at_utc,
          forecast_valid_at_utc; enforced at load time. The nine
          identifying columns (station/grid ids, coordinates, the two
          reference/valid timestamps, lead hours) and source_file_name are
          never null; every weather value column is nullable — a GRIB
          bitmap hole becomes an empty CSV cell, decoded here as NULL.
          Protocol, archive layout and unit conversions:
          docs/JMA-MSM-GPV-Retrieval.md. Load contract:
          conf/schemas/jma_msm_surface_forecast.yaml.
        columns:
          - name: station_id
            description: >
              JMA obsdl station id the MSM value is reported against (e.g.
              s47662 = 東京). Joinable to dim_jma_station.
            data_tests:
              - not_null
          - name: station_latitude
            description: Station latitude in decimal degrees, from the station master.
          - name: station_longitude
            description: Station longitude in decimal degrees, from the station master.
          - name: grid_latitude
            description: >
              Latitude of the MSM grid point nearest the station — the
              source of every weather value column (not the station's own
              location).
          - name: grid_longitude
            description: >
              Longitude of the MSM grid point nearest the station — the
              source of every weather value column (not the station's own
              location).
          - name: grid_distance_km
            description: Great-circle distance in km between the station and the nearest MSM grid point.
          - name: forecast_reference_at_utc
            description: >
              The model run's reference (initialization) time — GRIB2
              Section 1 "start of forecast", read from every message as
              dataDate/dataTime and asserted equal to the run requested; it
              is also the timestamp in the archive file name
              (Z__C_RJTD_<YYYYMMDDhhmmss>_...). UTC ISO 8601 string ("...Z");
              always the 12:00 UTC run of delivery day D-2 (21:00 JST) for
              this pipeline. This is the instant the forecast counts its
              lead hours from, NOT when the data became obtainable: the run
              is computed and disseminated about 2.5 hours later (~23:30
              JST D-2, the JMA/JMBSC operational lag — RISH posts it around
              then), and no publication timestamp is recorded anywhere in
              the file or this pipeline. Treat forecast_reference_at_utc +
              2.5 h as the earliest availability; the demand model's 09:30
              JST D-1 cutoff leaves ~34 h of margin.
            data_tests:
              - not_null
          - name: forecast_valid_at_utc
            description: >
              The time the forecast value is FOR: forecast_reference_at_utc
              plus the message's lead (GRIB2 forecastTime, read as ecCodes
              endStep in hours = forecast_lead_hours). UTC ISO 8601 string
              ("...Z"); the END of the represented weather hour, matching
              the fct_jma_weather_hourly observed_at convention. For the
              instantaneous elements (temperature, humidity, wind, pressure,
              cloud) the value is the model's state AT this instant; for
              precipitation and shortwave/solar radiation it is the
              accumulation/mean over the one-hour interval ending here
              (template 8, asserted at decode). Like the reference time it
              is a model time carried in the message, not a file or
              publication timestamp.
            data_tests:
              - not_null
          - name: forecast_lead_hours
            description: >
              Forecast lead in hours: forecast_valid_at_utc minus
              forecast_reference_at_utc (the message's endStep; 28-51 for
              this pipeline's single ingested vintage — JST hour-endings
              01:00-24:00 of delivery day D, i.e. hour starts 00:00-23:00).
          - name: temperature_c
            description: Air temperature at forecast_valid_at_utc in °C, at the nearest MSM grid point.
          - name: relative_humidity_pct
            description: Relative humidity at forecast_valid_at_utc in percent, at the nearest MSM grid point.
          - name: u_wind_ms
            description: Eastward wind component at forecast_valid_at_utc in m/s, at the nearest MSM grid point.
          - name: v_wind_ms
            description: Northward wind component at forecast_valid_at_utc in m/s, at the nearest MSM grid point.
          - name: wind_speed_ms
            description: Wind speed at forecast_valid_at_utc in m/s, derived from u_wind_ms/v_wind_ms.
          - name: precipitation_mm
            description: >
              Precipitation in mm accumulated over the forecast hour
              preceding forecast_valid_at_utc, at the nearest MSM grid
              point.
          - name: surface_pressure_hpa
            description: Surface pressure at forecast_valid_at_utc in hPa, at the nearest MSM grid point.
          - name: sea_level_pressure_hpa
            description: Sea-level pressure at forecast_valid_at_utc in hPa, at the nearest MSM grid point.
          - name: shortwave_radiation_wm2
            description: >
              Downward shortwave radiation flux in W/m², averaged over the
              forecast hour preceding forecast_valid_at_utc, at the nearest
              MSM grid point.
          - name: solar_radiation_mjm2
            description: >
              Global solar radiation in MJ/m² accumulated over the forecast
              hour preceding forecast_valid_at_utc, at the nearest MSM grid
              point.
          - name: total_cloud_cover_pct
            description: >
              Total cloud cover at forecast_valid_at_utc in percent, at the
              nearest MSM grid point. As decoded from GRIB2 — the packing
              overshoots 100 by up to ~0.011 on rare rows (not clamped).
          - name: high_cloud_cover_pct
            description: High cloud cover at forecast_valid_at_utc in percent, at the nearest MSM grid point.
          - name: middle_cloud_cover_pct
            description: Middle cloud cover at forecast_valid_at_utc in percent, at the nearest MSM grid point.
          - name: low_cloud_cover_pct
            description: Low cloud cover at forecast_valid_at_utc in percent, at the nearest MSM grid point.
          - name: source_file_name
            description: GRIB2 archive member the row's leads were decoded from, e.g. Z__C_RJTD_20260817120000_MSM_GPV_Rjp_Lsurf_FH16-33_grib2.bin.
            data_tests:
              - not_null
      - name: jma_normal_surface_daily
        description: >
          JMA climatological normals (平年値) of the 1991–2020 period: the
          daily file (地上気象観測 日別平年値) of every staffed station in
          normal_surface.zip from the 平年値ダウンロード page, one row per
          station, element code and month as published — 152,604 rows, 157
          stations × 81 elements × 12 months — with the row's 31 (value, flag)
          cells as 62 integer columns. Values are scaled integers per the
          element's unit (0.1 °C, 0.1 mm, 0.1 h, 0.1 MJ/m2, cloud tenths, 1 cm;
          the three occurrence rates in hundredths of a day, which over one day
          is a percentage); a day the month does not have is 0,0. Flags: 8
          normal; 6 normal, no phenomenon (a true zero); 7 and 5 the same two,
          reference only — the observation ended or the series was cut, not
          for anomalies; 0 no statistic. The two year columns are the years the
          row's statistic covers, not the period. The period, the archive's
          version and its in-use date come from the downloader's manifest;
          only the current version is served
          (docs/JMA-Climatological-Normals-Retrieval.md §5). Grain enforced at
          load time. Load contract: conf/schemas/jma_normal_surface_daily.yaml.
        columns:
          - name: normal_kind
            description: JMA's 平年値種別; 15 = the daily file.
            data_tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: [15]
                    quote: false
          - name: station_number
            description: >
              Five-digit station number as published (47662 = 東京);
              station_id = 's' || station_number.
            data_tests:
              - not_null
          - name: element_code
            description: >
              Four-digit element code (0500 = 日平均気温), a string so the zero
              stays; the seed jma_normal_elements names every code.
            data_tests:
              - not_null
          - name: n_years
            description: Years of data behind the statistic (資料年数); 0 when there is none.
            data_tests:
              - not_null
          - name: statistic_start_year
            description: First year the row's statistic covers; 0 with n_years 0.
            data_tests:
              - not_null
          - name: statistic_end_year
            description: >
              Last year the row's statistic covers — 2016 for an observation
              that ended that year; 0 with n_years 0.
            data_tests:
              - not_null
          - name: month
            description: Calendar month 1–12.
            data_tests:
              - not_null
          - name: value_d01
            description: >
              The published integer of day 1 (value_d02 … value_d31 the other
              days), in the element's scaled unit; 0 where the flag is 0 and in
              the padding cells of a day the month does not have.
          - name: flag_d01
            description: >
              Quality flag of day 1 (flag_d02 … flag_d31 the other days): 8, 6,
              7, 5 or 0.
          - name: normals_period_start_year
            description: First year of the normals period (1991), from the manifest.
            data_tests:
              - not_null
          - name: normals_period_end_year
            description: Last year of the normals period (2020), from the manifest.
            data_tests:
              - not_null
          - name: normals_version
            description: The archive's version as the page named it when downloaded ("5").
            data_tests:
              - not_null
          - name: in_use_since
            description: The day JMA put the period's normals into use (2021-05-19).
            data_tests:
              - not_null
          - name: source_file
            description: The daily file the row came from, e.g. nml_sfc_d_47662.csv.
            data_tests:
              - not_null
