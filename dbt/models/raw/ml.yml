sources:
  - name: ml
    schema: pma_ml
    description: >
      Model outputs written back to the warehouse by Python tasks (see
      power_market_analytics/forecasting/publish.py). Rows carry the
      MLflow run_id they came from; MLflow keeps the experiment record
      (params, metrics, artifacts) while these tables keep the row-level
      outputs for SQL/BI analysis.
    tables:
      - name: spot_price_forecast
        description: >
          Day-ahead spot price forecasts from backtest runs
          (scripts/spot_price_backtest.py). One row per MLflow run, area and
          30-minute delivery period; partitioned by run_id and overwritten
          per run, so republishing a run replaces exactly its rows. Forecasts
          only — actuals live in fct_jepx_spot_area_price and are joined
          downstream.
        columns:
          - name: run_id
            description: >
              MLflow run id (experiment spot_price) that produced the
              forecast; the run's tag warehouse_table points back here.
            data_tests:
              - not_null
          - name: strategy
            description: Strategy registry key, e.g. previous_day.
            data_tests:
              - not_null
          - name: area_code
            description: Bidding zone, joins to dim_area.area_code.
            data_tests:
              - not_null
          - name: forecast_issued_ts
            description: >
              When the forecast was made: 9:30 JST on the day before
              delivery, per the task definition (naive JST, like all
              warehouse timestamps).
            data_tests:
              - not_null
          - name: trade_date
            description: Target delivery date.
            data_tests:
              - not_null
          - name: time_code
            description: 30-minute delivery period of the day, 1-48.
            data_tests:
              - not_null
          - name: forecast_price_jpy_kwh
            description: Forecast area price in JPY/kWh.
            data_tests:
              - not_null
          - name: published_at
            description: >
              When the run's rows were written to the warehouse (naive JST);
              one value per run, refreshed if a run is republished. Lets BI
              tools label runs without querying MLflow.
            data_tests:
              - not_null
      - name: demand_forecast
        description: >
          Day-ahead area demand forecasts from backtest runs
          (scripts/demand_backtest.py). One row per MLflow run, area and
          30-minute delivery period; partitioned by run_id and overwritten
          per run, so republishing a run replaces exactly its rows. Forecasts
          only — actuals live in fct_area_demand_generation_actual and are
          joined downstream.
        columns:
          - name: run_id
            description: >
              MLflow run id (experiment demand) that produced the forecast;
              the run's tag warehouse_table points back here.
            data_tests:
              - not_null
          - name: strategy
            description: Strategy registry key, e.g. lightgbm.
            data_tests:
              - not_null
          - name: area_code
            description: Bidding zone, joins to dim_area.area_code.
            data_tests:
              - not_null
          - name: forecast_issued_ts
            description: >
              When the forecast was made: 09:30 JST on the day before
              delivery, per the task definition (naive JST, like all
              warehouse timestamps).
            data_tests:
              - not_null
          - name: trade_date
            description: Target delivery date.
            data_tests:
              - not_null
          - name: time_code
            description: 30-minute delivery period of the day, 1-48.
            data_tests:
              - not_null
          - name: forecast_demand_kwh
            description: Forecast area demand over the 30-minute period, kWh.
            data_tests:
              - not_null
          - name: published_at
            description: >
              When the run's rows were written to the warehouse (naive JST);
              one value per run, refreshed if a run is republished.
            data_tests:
              - not_null
      - name: demand_forecast_contribution
        description: >
          Per-component decomposition of the forecasts in demand_forecast,
          written by the same backtest run (scripts/demand_backtest.py;
          SlidingWindowLightGbmStrategy.contributions — exact TreeSHAP from
          LightGBM's pred_contrib). One row per MLflow run, area, 30-minute
          delivery period and component: the model's base value (component
          'base', component_order 0) or one feature. Per period, base + the sum
          of the feature contributions = forecast_demand_kwh. Partitioned by
          run_id and overwritten per run like demand_forecast; a strategy that
          cannot explain its forecasts writes nothing here.
        columns:
          - name: run_id
            description: MLflow run id (experiment demand); the run's tag contribution_table points back here.
            data_tests:
              - not_null
          - name: strategy
            description: Strategy registry key, e.g. lightgbm_msm_popw_daytype.
            data_tests:
              - not_null
          - name: area_code
            description: Bidding zone, joins to dim_area.area_code.
            data_tests:
              - not_null
          - name: forecast_issued_ts
            description: When the forecast was made (09:30 JST on D-1), as on demand_forecast.
            data_tests:
              - not_null
          - name: trade_date
            description: Target delivery date.
            data_tests:
              - not_null
          - name: time_code
            description: 30-minute delivery period of the day, 1-48.
            data_tests:
              - not_null
          - name: component
            description: >
              'base' for the model's expected value, else the feature name as
              listed in the run's lgbm_feature_cols param (time_code, month,
              day_of_week, wavg_temperature_c, lag_7d_demand_kwh, ...).
            data_tests:
              - not_null
          - name: component_order
            description: 0 for the base, then the feature's 1-based position in the model's feature list.
            data_tests:
              - not_null
          - name: feature_value
            description: >
              The feature's value as the model saw it (units vary per feature:
              a time code, a month, degrees C, kWh, a day-type code); null on
              the base row.
          - name: contribution_demand_kwh
            description: The component's additive contribution to the forecast, kWh per 30-minute period.
            data_tests:
              - not_null
          - name: published_at
            description: Same instant as the run's demand_forecast rows (naive JST).
            data_tests:
              - not_null
      - name: spot_price_forecast_contribution
        description: >
          Per-component decomposition of the forecasts in spot_price_forecast,
          written by the same backtest run (scripts/spot_price_backtest.py;
          SlidingWindowLightGbmStrategy.contributions — exact TreeSHAP from
          LightGBM's pred_contrib). One row per MLflow run, area, 30-minute
          delivery period and component: the model's base value (component
          'base', component_order 0) or one feature. Per period, base + the sum
          of the feature contributions = forecast_price_jpy_kwh. Partitioned by
          run_id and overwritten per run like spot_price_forecast; a strategy
          that cannot explain its forecasts (previous_day) writes nothing here.
        columns:
          - name: run_id
            description: MLflow run id (experiment spot_price); the run's tag contribution_table points back here.
            data_tests:
              - not_null
          - name: strategy
            description: Strategy registry key, e.g. lightgbm.
            data_tests:
              - not_null
          - name: area_code
            description: Bidding zone, joins to dim_area.area_code.
            data_tests:
              - not_null
          - name: forecast_issued_ts
            description: When the forecast was made (9:30 JST on D-1), as on spot_price_forecast.
            data_tests:
              - not_null
          - name: trade_date
            description: Target delivery date.
            data_tests:
              - not_null
          - name: time_code
            description: 30-minute delivery period of the day, 1-48.
            data_tests:
              - not_null
          - name: component
            description: >
              'base' for the model's expected value, else the feature name as
              listed in the run's lgbm_feature_cols param (time_code, month,
              day_of_week, the price lags, ...).
            data_tests:
              - not_null
          - name: component_order
            description: 0 for the base, then the feature's 1-based position in the model's feature list.
            data_tests:
              - not_null
          - name: feature_value
            description: >
              The feature's value as the model saw it (units vary per feature:
              a time code, a month, JPY/kWh, MW); null on the base row.
          - name: contribution_price_jpy_kwh
            description: The component's additive contribution to the forecast, JPY/kWh.
            data_tests:
              - not_null
          - name: published_at
            description: Same instant as the run's spot_price_forecast rows (naive JST).
            data_tests:
              - not_null
      - name: demand_forecast_importance
        description: >
          Permutation feature importance of the forecasts in demand_forecast,
          written by the same backtest run (scripts/demand_backtest.py;
          SlidingWindowLightGbmStrategy.permutation_importance —
          scikit-learn's permutation_importance over the run's refits, each
          row re-scored by the model that forecast its day). One row per
          MLflow run, area, model feature and repeat: the run's MAE on its
          scored periods and the MAE after shuffling that feature's column
          across them. Partitioned by run_id and overwritten per run like
          demand_forecast; a strategy with nothing to shuffle writes nothing here.
          The table exists only once a run has published to it, so no test
          runs against the source itself: the guarded staging model is the
          only node that reads it, and its contract and tests check every
          column.
        columns:
          - name: run_id
            description: MLflow run id (experiment demand); the run's tag importance_table points back here.
          - name: strategy
            description: Strategy registry key, e.g. lightgbm_msm_popw_daytype.
          - name: area_code
            description: Bidding zone, joins to dim_area.area_code.
          - name: feature
            description: The model feature, as listed in the run's lgbm_feature_cols param.
          - name: feature_order
            description: The feature's 1-based position in the model's feature list.
          - name: repeat_index
            description: Shuffle number, 0 .. permutation_repeats − 1 (run param).
          - name: n_periods
            description: The run's scored periods (the rows of fct_demand_forecast_accuracy with an actual); the same on every row of the run.
          - name: mae_demand_kwh
            description: The run's MAE over its scored periods (kWh per 30-minute period), the baseline; the same on every row of the run.
          - name: permuted_mae_demand_kwh
            description: The MAE over the same periods after shuffling the feature's column (kWh per 30-minute period); minus mae_demand_kwh = the importance.
          - name: published_at
            description: Same instant as the run's demand_forecast rows (naive JST).
      - name: spot_price_forecast_importance
        description: >
          Permutation feature importance of the forecasts in spot_price_forecast,
          written by the same backtest run (scripts/spot_price_backtest.py;
          SlidingWindowLightGbmStrategy.permutation_importance —
          scikit-learn's permutation_importance over the run's refits, each
          row re-scored by the model that forecast its day). One row per
          MLflow run, area, model feature and repeat: the run's MAE on its
          scored periods and the MAE after shuffling that feature's column
          across them. Partitioned by run_id and overwritten per run like
          spot_price_forecast; a strategy with nothing to shuffle (previous_day) writes nothing here.
          The table exists only once a run has published to it, so no test
          runs against the source itself: the guarded staging model is the
          only node that reads it, and its contract and tests check every
          column.
        columns:
          - name: run_id
            description: MLflow run id (experiment spot_price); the run's tag importance_table points back here.
          - name: strategy
            description: Strategy registry key, e.g. lightgbm.
          - name: area_code
            description: Bidding zone, joins to dim_area.area_code.
          - name: feature
            description: The model feature, as listed in the run's lgbm_feature_cols param.
          - name: feature_order
            description: The feature's 1-based position in the model's feature list.
          - name: repeat_index
            description: Shuffle number, 0 .. permutation_repeats − 1 (run param).
          - name: n_periods
            description: The run's scored periods (the rows of fct_spot_price_forecast_accuracy with an actual); the same on every row of the run.
          - name: mae_price_jpy_kwh
            description: The run's MAE over its scored periods (JPY/kWh), the baseline; the same on every row of the run.
          - name: permuted_mae_price_jpy_kwh
            description: The MAE over the same periods after shuffling the feature's column (JPY/kWh); minus mae_price_jpy_kwh = the importance.
          - name: published_at
            description: Same instant as the run's spot_price_forecast rows (naive JST).
      - name: similar_day
        description: >
          The demand task's similar-day features as scripts/fit_similar_day.py
          scored them walking forward (tasks/demand/similar_day.py ranks the
          days, similar_day_feature.py refits every few days and writes the
          rows). A delivery day D's pool is the paper's (Park, Song and Kwon
          2020): D - 2 ... D - 31 and D - 335 ... D - 394, without special days
          (dim_date.is_holiday) and without days whose load was not public by
          D's issue time. The three nearest pool days under weights fitted only
          on days before D give four features per period: their hourly loads,
          halved, and their inverse-distance weighted mean. A special day whose
          same holiday last year (dim_date.holiday_name_ja) lies 335 ... 394
          days back, with that day's whole load public by D's issue time, takes
          that day instead: rank 1 and the mean carry its load, and the
          ranked-only columns are null. Otherwise it is ranked. One row per MLflow run, area and
          period; partitioned by run_id and overwritten per run like the
          forecast tables, so a re-run is a new run whose rows the
          ftr_period_similar_day mart passes to Feast next to the older runs'.
          The table exists only once a run has published to it, so no test
          runs against the source itself: the guarded staging model is the
          only node that reads it, and its contract and tests check every
          column.
        columns:
          - name: run_id
            description: >
              MLflow run id (experiment similar_day) of the fit-and-score run; the run's tag feature_table points back here.
          - name: area_code
            description: >
              Bidding zone the features were scored for; joins to dim_area.area_code.
          - name: trade_date
            description: >
              The delivery day D.
          - name: time_code
            description: >
              30-minute delivery period of the day, 1-48.
          - name: similar_day_rank1_demand_kwh
            description: >
              The nearest pool day's hourly load (fct_area_power_usage_hourly, kWh over the hour containing the period) halved, kWh per 30-minute period; on a same-holiday day, the load of last year's same holiday. Never null.
          - name: similar_day_rank2_demand_kwh
            description: >
              The second nearest pool day's hourly load halved, kWh per 30-minute period. Null on a same-holiday day and when the pool has fewer than two days.
          - name: similar_day_rank3_demand_kwh
            description: >
              The third nearest pool day's hourly load halved, kWh per 30-minute period. Null on a same-holiday day and when the pool has fewer than three days.
          - name: wavg_similar_day_top3_demand_kwh
            description: >
              The mean of the rank loads present, weighted by inverse distance (w_r = (1 / d_r) / sum_s (1 / d_s), summed in rank order; zero-distance days share the weight when there are any), kWh per 30-minute period. Equals rank 1 on a same-holiday day. Never null.
          - name: similar_day_rank1_reference_date
            description: >
              Rank 1's day: the nearest pool day, or last year's same holiday on a same-holiday day. Never null.
          - name: similar_day_rank2_reference_date
            description: >
              Rank 2's day; null where its load is.
          - name: similar_day_rank3_reference_date
            description: >
              Rank 3's day; null where its load is.
          - name: similar_day_rank1_distance
            description: >
              Rank 1's distance from D under the run's fitted weights; null on a same-holiday day.
          - name: similar_day_rank2_distance
            description: >
              Rank 2's distance from D; null where its load is.
          - name: similar_day_rank3_distance
            description: >
              Rank 3's distance from D; null where its load is.
          - name: similar_day_n_candidates
            description: >
              Pool days that could be ranked for D (up to 90); null on a same-holiday day.
          - name: similar_day_fit_cutoff
            description: >
              When the fit whose weights ranked the day ran, naive JST, on or before D's issue time: the job refits every few days as it walks forward, each fit on the pairs of the 730 days before its cutoff whose target load was public by then, and ranks each day with the latest fit before its issue time. Null on a same-holiday day.
          - name: similar_day_method
            description: >
              similarity (the day was ranked) or same_holiday (the day took last year's same holiday).
          - name: available_at
            description: >
              When the row became usable, naive JST, never after D's issue time: on a ranked day the latest of D's MSM forecast vintage (reference + 4 h, 01:00 on D-1), similar_day_fit_cutoff and the load availability of the ranked days; on a same-holiday day the load availability of last year's same holiday.
          - name: published_at
            description: >
              When the run's rows were written to the warehouse (naive JST); the newest published run wins among rows tied on available_at.
