models:
  - name: stg_ml__demand_forecast
    config:
      contract:
        enforced: true
    description: >
      As-is representation of pma_ml.demand_forecast (day-ahead area demand
      forecasts from backtest runs). One row per MLflow run, area and
      30-minute time_code. Column documentation lives on the source
      (models/raw/ml.yml).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - run_id
              - area_code
              - trade_date
              - time_code
    columns:
      - name: run_id
        data_type: string
        data_tests:
          - not_null
      - name: strategy
        data_type: string
        data_tests:
          - not_null
      - name: area_code
        data_type: string
        data_tests:
          - not_null
      - name: forecast_issued_ts
        data_type: timestamp
        data_tests:
          - not_null
      - name: trade_date
        data_type: date
        data_tests:
          - not_null
      - name: time_code
        data_type: int
        data_tests:
          - not_null
      - name: forecast_demand_kwh
        data_type: double
        data_tests:
          - not_null
      - name: published_at
        data_type: timestamp
        data_tests:
          - not_null
