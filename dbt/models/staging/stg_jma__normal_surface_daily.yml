models:
  - name: stg_jma__normal_surface_daily
    config:
      contract:
        enforced: true
    description: >
      As-is representation of pma_raw.jma_normal_surface_daily (JMA daily
      climatological normals, 1991–2020, staffed stations). One row per
      period, station number, element code and month; 31 (value, flag) pairs.
      Column documentation lives on the source (models/raw/jma.yml).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - normals_period_end_year
              - station_number
              - element_code
              - month
    columns:
      - name: normal_kind
        data_type: int
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [15]
                quote: false
      - name: station_number
        data_type: string
        data_tests:
          - not_null
      - name: element_code
        data_type: string
        data_tests:
          - not_null
      - name: n_years
        data_type: int
        data_tests:
          - not_null
      - name: statistic_start_year
        data_type: int
        data_tests:
          - not_null
      - name: statistic_end_year
        data_type: int
        data_tests:
          - not_null
      - name: month
        data_type: int
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                max_value: 12
      - name: value_d01
        data_type: int
      - name: flag_d01
        data_type: int
      - name: value_d02
        data_type: int
      - name: flag_d02
        data_type: int
