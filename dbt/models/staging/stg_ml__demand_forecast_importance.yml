models:
  - name: stg_ml__demand_forecast_importance
    config:
      contract:
        enforced: true
    description: >
      As-is representation of pma_ml.demand_forecast_importance (the
      permutation feature importance of the demand forecasts). One
      row per MLflow run, area, model feature and repeat. Column documentation
      lives on the source (models/raw/ml.yml). Empty (no rows, the contract's
      types) until the first backtest creates the source table.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - run_id
              - area_code
              - feature
              - repeat_index
    columns:
      - name: run_id
        data_type: string
        data_tests:
          - not_null
      - name: strategy
        data_type: string
        data_tests:
          - not_null
      - name: area_code
        data_type: string
        data_tests:
          - not_null
      - name: feature
        data_type: string
        data_tests:
          - not_null
      - name: feature_order
        data_type: int
        data_tests:
          - not_null
      - name: repeat_index
        data_type: int
        data_tests:
          - not_null
      - name: n_periods
        data_type: int
        data_tests:
          - not_null
      - name: mae_demand_kwh
        data_type: double
        data_tests:
          - not_null
      - name: permuted_mae_demand_kwh
        data_type: double
        data_tests:
          - not_null
      - name: published_at
        data_type: timestamp
        data_tests:
          - not_null
