models:
  - name: stg_tepco__area_demand_generation_actual
    config:
      contract:
        enforced: true
    description: >
      As-is representation of pma_raw.tepco_area_demand_generation_actual
      (TEPCO Tokyo-area 30-minute demand / generation actuals). One row per
      target_date and time_code. Column documentation lives on the source
      (models/raw/tepco.yml).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - target_date
              - time_code
    columns:
      - name: target_date
        data_type: date
        data_tests:
          - not_null
      - name: time_code
        data_type: int
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                max_value: 48
      - name: period_start_time
        data_type: string
        data_tests:
          - not_null
      - name: period_end_time
        data_type: string
        data_tests:
          - not_null
      - name: demand_kwh
        data_type: double
        data_tests:
          - not_null
      - name: generation_kwh
        data_type: double
        data_tests:
          - not_null
      - name: wind_solar_generation_kwh
        data_type: double
        data_tests:
          - not_null
      - name: file_updated_at
        data_type: timestamp
        data_tests:
          - not_null
