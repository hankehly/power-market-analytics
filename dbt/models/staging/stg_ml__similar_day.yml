models:
  - name: stg_ml__similar_day
    config:
      contract:
        enforced: true
    description: >
      As-is representation of pma_ml.similar_day (the demand similar-day
      features as the fit-and-score runs wrote them). One row per MLflow run,
      area and 30-minute period. A ranked day (similar_day_method similarity)
      carries up to three ranks and their inverse-distance weighted mean; a
      same-holiday day (same_holiday) carries last year's same holiday as rank
      1 and the mean, and nulls in the ranked-only columns. Column
      documentation lives on the source (models/raw/ml.yml). Empty (no rows,
      the contract's types) until the first run creates the source table.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - run_id
              - area_code
              - trade_date
              - time_code
      - dbt_utils.expression_is_true:
          name: stg_ml__similar_day_same_holiday_rows_carry_one_reference
          arguments:
            expression: >
              similar_day_method = 'similarity' or (
                similar_day_rank2_demand_kwh is null and similar_day_rank3_demand_kwh is null
                and similar_day_rank2_reference_date is null and similar_day_rank3_reference_date is null
                and similar_day_rank1_distance is null and similar_day_rank2_distance is null
                and similar_day_rank3_distance is null and similar_day_n_candidates is null
                and similar_day_fit_cutoff is null
                and wavg_similar_day_top3_demand_kwh = similar_day_rank1_demand_kwh
                and datediff(trade_date, similar_day_rank1_reference_date) between 335 and 394
              )
      - dbt_utils.expression_is_true:
          name: stg_ml__similar_day_distances_do_not_decrease_by_rank
          arguments:
            expression: >
              similar_day_method = 'same_holiday' or (
                coalesce(similar_day_rank1_distance <= similar_day_rank2_distance, true)
                and coalesce(similar_day_rank2_distance <= similar_day_rank3_distance, true)
              )
      - dbt_utils.expression_is_true:
          name: stg_ml__similar_day_weighted_mean_recomputes
          arguments:
            expression: >
              similar_day_method = 'same_holiday'
              or similar_day_rank3_distance is null
              or least(similar_day_rank1_distance, similar_day_rank2_distance, similar_day_rank3_distance) = 0
              or abs(
                wavg_similar_day_top3_demand_kwh
                - (
                  similar_day_rank1_demand_kwh / similar_day_rank1_distance
                  + similar_day_rank2_demand_kwh / similar_day_rank2_distance
                  + similar_day_rank3_demand_kwh / similar_day_rank3_distance
                ) / (
                  cast(1 as double) / similar_day_rank1_distance
                  + cast(1 as double) / similar_day_rank2_distance
                  + cast(1 as double) / similar_day_rank3_distance
                )
              ) <= cast(1e-9 as double) * wavg_similar_day_top3_demand_kwh
    columns:
      - name: run_id
        data_type: string
        data_tests:
          - not_null
      - name: area_code
        data_type: string
        data_tests:
          - not_null
      - name: trade_date
        data_type: date
        data_tests:
          - not_null
      - name: time_code
        data_type: int
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                max_value: 48
      - name: similar_day_rank1_demand_kwh
        data_type: double
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: false
      - name: similar_day_rank2_demand_kwh
        data_type: double
        data_tests:
          - not_null:
              config:
                where: "similar_day_method = 'similarity' and similar_day_n_candidates >= 2"
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: false
      - name: similar_day_rank3_demand_kwh
        data_type: double
        data_tests:
          - not_null:
              config:
                where: "similar_day_method = 'similarity' and similar_day_n_candidates >= 3"
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: false
      - name: wavg_similar_day_top3_demand_kwh
        data_type: double
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: false
      - name: similar_day_rank1_reference_date
        data_type: date
        data_tests:
          - not_null
      - name: similar_day_rank2_reference_date
        data_type: date
        data_tests:
          - not_null:
              config:
                where: "similar_day_method = 'similarity' and similar_day_n_candidates >= 2"
      - name: similar_day_rank3_reference_date
        data_type: date
        data_tests:
          - not_null:
              config:
                where: "similar_day_method = 'similarity' and similar_day_n_candidates >= 3"
      - name: similar_day_rank1_distance
        data_type: double
        data_tests:
          - not_null:
              config:
                where: "similar_day_method = 'similarity'"
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: similar_day_rank2_distance
        data_type: double
        data_tests:
          - not_null:
              config:
                where: "similar_day_method = 'similarity' and similar_day_n_candidates >= 2"
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: similar_day_rank3_distance
        data_type: double
        data_tests:
          - not_null:
              config:
                where: "similar_day_method = 'similarity' and similar_day_n_candidates >= 3"
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: similar_day_n_candidates
        data_type: int
        data_tests:
          - not_null:
              config:
                where: "similar_day_method = 'similarity'"
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
      - name: similar_day_fit_cutoff
        data_type: timestamp
        data_tests:
          - not_null:
              config:
                where: "similar_day_method = 'similarity'"
      - name: similar_day_method
        data_type: string
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [similarity, same_holiday]
      - name: available_at
        data_type: timestamp
        data_tests:
          - not_null
      - name: published_at
        data_type: timestamp
        data_tests:
          - not_null
