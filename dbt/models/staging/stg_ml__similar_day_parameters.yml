models:
  - name: stg_ml__similar_day_parameters
    config:
      contract:
        enforced: true
    description: >
      As-is representation of pma_ml.similar_day_parameters (the fitted
      weights of the demand task's similar-day distance, one row per fit).
      Column documentation lives on the source (models/raw/ml.yml). Empty (no
      rows, the contract's types) until the first fit creates the source table.
    columns:
      - name: run_id
        data_type: string
        data_tests:
          - not_null
          - unique
      - name: area_code
        data_type: string
        data_tests:
          - not_null
      - name: fit_from
        data_type: date
        data_tests:
          - not_null
      - name: fit_through
        data_type: date
        data_tests:
          - not_null
      - name: center_lag_days
        data_type: int
        data_tests:
          - not_null
      - name: window_half_width_days
        data_type: int
        data_tests:
          - not_null
      - name: census_year
        data_type: int
        data_tests:
          - not_null
      - name: weight_calendar_days
        data_type: double
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
      - name: weight_temperature
        data_type: double
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
      - name: weight_humidity
        data_type: double
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
      - name: weight_rain
        data_type: double
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
      - name: weight_days_since_holiday
        data_type: double
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
      - name: weight_days_until_holiday
        data_type: double
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
      - name: weight_holiday_degree
        data_type: double
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
      - name: scale_calendar_days
        data_type: double
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: false
      - name: scale_temperature
        data_type: double
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: false
      - name: scale_humidity
        data_type: double
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: false
      - name: scale_rain
        data_type: double
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: false
      - name: scale_days_since_holiday
        data_type: double
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: false
      - name: scale_days_until_holiday
        data_type: double
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: false
      - name: scale_holiday_degree
        data_type: double
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: false
      - name: alpha
        data_type: double
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: beta
        data_type: double
        data_tests:
          - not_null
      - name: n_pairs
        data_type: bigint
        data_tests:
          - not_null
      - name: n_targets
        data_type: int
        data_tests:
          - not_null
      - name: fit_rmse
        data_type: double
        data_tests:
          - not_null
      - name: available_at
        data_type: timestamp
        data_tests:
          - not_null
      - name: published_at
        data_type: timestamp
        data_tests:
          - not_null
