models:
  - name: fct_area_demand_generation_actual
    config:
      contract:
        enforced: true
    description: >
      TSO-published area demand / generation actuals — the インバランス料金
      「系統の需給に関する情報」 disclosure items A-1 (エリア総需要量), B-1
      (エリア総発電量) and B-4 (エリア風力・太陽光発電量) — for every JEPX area
      whose TSO feed is loaded: Tokyo (TEPCO Power Grid,
      std_tepco__area_demand_generation_actual) and Kansai (関西電力送配電,
      std_kansai__area_demand_generation_actual). Grain: one row per delivery
      period (date_key x 30-minute time_code) per area — the same grain as
      fct_jepx_spot_area_price and fct_occto_demand_supply_forecast_30m, so
      the three join on (date_key, time_code, area_key). Both areas cover
      2022-04-01 through the last finalized day (files are finalized shortly
      after midnight of the next day; each refresh re-downloads the whole
      archive, picking up the TSOs' occasional revisions). Measures are energy
      per 30-minute period in kWh (30分kWh, as published) and ADDITIVE across
      periods, days and areas; divide by 500 for average MW (x 0.5 h, /1000).
      wind_solar_generation_kwh is the wind + solar share of generation_kwh.
      Measures are null where the TSO published no observation and the row is
      kept so the grain stays dense: Tokyo 2025-06-14 time codes 11-48
      (archive froze mid-day) and Kansai 2025-10-12, 22 periods (blank cells).
      Each TSO measures its own area with its own system, so precision differs
      (TEPCO values are multiples of 1,000 kWh; Kansai values are exact kWh).
      delivery_datetime is a standalone period-start timestamp for
      time-series work, not a dimension key. Retrieval details and quirks per
      TSO: docs/TEPCO-Area-Demand-Generation-Retrieval.md,
      docs/Kansai-Area-Demand-Generation-Retrieval.md.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - date_key
              - time_code
              - area_key
      - dbt_utils.expression_is_true:
          name: fct_area_actual_wind_solar_lte_generation
          arguments:
            expression: "wind_solar_generation_kwh <= generation_kwh"
    columns:
      - name: date_key
        data_type: date
        description: Delivery date; 2022-04-01 onward.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: "date '2022-04-01'"
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
      - name: time_code
        data_type: int
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_delivery_period')
                field: time_code
      - name: area_key
        data_type: int
        description: JEPX area (dim_area); currently 'tokyo' and 'kansai'.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_area')
                field: area_key
      - name: delivery_datetime
        data_type: timestamp
        data_tests:
          - not_null
      - name: demand_kwh
        data_type: bigint
        description: Area total demand over the 30-minute period, kWh; additive.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: generation_kwh
        data_type: bigint
        description: Area total generation over the 30-minute period, kWh; additive.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: wind_solar_generation_kwh
        data_type: bigint
        description: Wind + solar generation over the 30-minute period, kWh; additive.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
