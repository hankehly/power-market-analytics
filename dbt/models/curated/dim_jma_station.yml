models:
  - name: dim_jma_station
    config:
      contract:
        enforced: true
    description: >
      JMA weather observation station dimension, one row per station,
      including discontinued stations (type-1 snapshot of the JMA obsdl
      station master; see docs/JMA-Weather-Data-Retrieval.md §4). Staffed
      stations only since the 2026-08 re-scope, and only stations inside a
      JEPX area — Okinawa (沖縄電力 is not a JEPX area), Antarctica (昭和)
      and 南鳥島 (outside TEPCO PG's supply area) are excluded, so area_key
      is a required foreign key to dim_area. Built from the jma_stations
      seed (regenerated by scripts/update_jma_stations_seed.py) joined to
      the hand-curated jma_station_areas seed, which assigns each station
      the JEPX area whose TSO supply region contains it.
      Coordinates are decimal degrees converted from JMA's degrees + decimal
      minutes (0.1′ ≈ 185 m precision). Historical relocations are not
      tracked here — the hourly facts carry homogeneity numbers instead.
    columns:
      - name: station_id
        data_type: string
        description: >
          JMA obsdl station id and natural key, e.g. s47662 = 東京. The
          s/a prefix encodes the station type.
        data_tests:
          - unique
          - not_null
      - name: station_type
        data_type: string
        description: >
          always staffed (気象官署) since the 2026-08 re-scope; the amedas
          value would reappear only if AMeDAS ingestion returns.
        data_tests:
          - accepted_values:
              arguments:
                values: [staffed]
      - name: prefecture_code
        data_type: int
        description: >
          JMA area code (pd), e.g. 44 = 東京. Hokkaidō is subdivided into 14
          areas; see docs/JMA-Weather-Data-Retrieval.md Appendix A. The
          non-JEPX codes 91 (Okinawa) and 99 (Antarctica) never appear here.
        data_tests:
          - not_null
      - name: station_name
        data_type: string
        description: Station name in Japanese (e.g. 東京, 府中).
        data_tests:
          - not_null
      - name: station_kana
        data_type: string
        description: Station name in katakana.
      - name: area_key
        data_type: int
        description: >
          JEPX area (dim_area.area_key) whose TSO supply region contains the
          station, from the jma_station_areas seed. Prefecture-level except
          静岡, which splits at the 富士川 (TEPCO PG east of it, Chubu PG
          west); sources documented in the seed's assignment_basis column.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_area')
                field: area_key
      - name: area_code
        data_type: string
        description: >
          Snake-case JEPX area code (dim_area.area_code) matching area_key,
          carried for readable filters and joins.
        data_tests:
          - not_null
      - name: latitude
        data_type: double
        description: Latitude in decimal degrees (negative = south).
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: -90
                max_value: 90
      - name: longitude
        data_type: double
        description: Longitude in decimal degrees (negative = west).
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 180
      - name: elevation_m
        data_type: double
        description: Station elevation in meters (can be below sea level).
      - name: kansoku
        data_type: string
        description: >
          Raw 6-digit observed-element mask from the obsdl site, digit order
          [precipitation, wind, temperature, sunshine, snow, other];
          0 = not observed, 1 = observed, 2 = estimated. Decoded into the
          obs_* columns.
      - name: obs_precipitation
        data_type: int
        description: Observes precipitation (0/1).
      - name: obs_wind
        data_type: int
        description: Observes wind (0/1).
      - name: obs_temperature
        data_type: int
        description: Observes temperature (0/1).
      - name: obs_sunshine
        data_type: int
        description: >
          Observes sunshine (0/1/2; 2 = satellite-derived estimate, the norm
          at active AMeDAS stations since 2021-03).
      - name: obs_snow
        data_type: int
        description: Observes snow depth/snowfall (0/1).
      - name: obs_other
        data_type: int
        description: >
          Observes the "other" element group (0/1): staffed-station extras
          (pressure, solar radiation, weather, cloud, visibility) or
          humidity at modernized AMeDAS stations.
      - name: observation_ended_on
        data_type: date
        description: >
          Date observations ended, for discontinued stations; null while the
          station is active.
      - name: is_active
        data_type: boolean
        description: True when observation_ended_on is null.
        data_tests:
          - not_null
