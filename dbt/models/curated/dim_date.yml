models:
  - name: dim_date
    config:
      contract:
        enforced: true
    description: >
      Calendar date dimension, one row per day from 2016-01-01 (earliest date
      across all fact sources; JMA weather starts here, JEPX spot at fiscal
      year 2016 = 2016-04-01) through the end of the last calendar year
      covered by the jpn_national_holidays seed (the spine end derives from
      the seed).
      Japanese fiscal calendar (April-March). is_holiday covers the official
      national holidays from the Cabinet Office (seed jpn_national_holidays,
      refresh with scripts/update_holidays_seed.py) plus the customary
      non-working days, computed as fixed month/day rules: 年末年始
      (12/30-12/31, 1/2-1/3) and ゴールデンウィーク (4/30-5/2) — the 休日 set the
      family-A TSO 託送供給等約款 share (北海道・東京・中部・関西・四国・九州;
      東北, 北陸, 中国 and 沖縄 differ slightly) — and お盆 (8/13-8/16), a
      nationwide convention with no statutory or tariff basis.
      Keyed by the date itself (Kimball exempts the date dimension from
      surrogate keys).
    data_tests:
      - dbt_utils.expression_is_true:
          name: dim_date_weekend_matches_day_of_week
          arguments:
            expression: "is_weekend = (day_of_week_iso in (6, 7))"
      # The customary non-working days are holidays in every year of the spine,
      # whatever weekday they fall on.
      - dbt_utils.expression_is_true:
          name: dim_date_customary_days_are_holidays
          arguments:
            expression: >
              is_holiday or not (
                (month = 1 and day_of_month in (2, 3))
                or (month = 4 and day_of_month = 30)
                or (month = 5 and day_of_month in (1, 2))
                or (month = 8 and day_of_month between 13 and 16)
                or (month = 12 and day_of_month in (30, 31))
              )
      - dbt_utils.expression_is_true:
          name: dim_date_holiday_name_matches_flag
          arguments:
            expression: "is_holiday = (holiday_name_ja <> 'Not Applicable')"
      - dbt_utils.expression_is_true:
          name: dim_date_business_day_is_non_holiday_weekday
          arguments:
            expression: "is_business_day = (day_of_week_iso <= 5 and not is_holiday)"
      # A Sunday or a national holiday (the customary names never win over an
      # official one) is a full holiday.
      - dbt_utils.expression_is_true:
          name: dim_date_holiday_degree_sunday_or_national_holiday_is_one
          arguments:
            expression: >
              holiday_degree = 1.0
              or not (
                day_of_week_iso = 7
                or (is_holiday and holiday_name_ja not in ('年末年始', 'ゴールデンウィーク', 'お盆'))
              )
      # Every non-working day scores at least a Saturday; a working day scores
      # 0 unless sandwiched between off days.
      - dbt_utils.expression_is_true:
          name: dim_date_holiday_degree_non_business_day_at_least_saturday
          arguments:
            expression: "is_business_day or holiday_degree >= 0.8"
      - dbt_utils.expression_is_true:
          name: dim_date_holiday_degree_business_day_is_sandwich_value
          arguments:
            expression: "not is_business_day or holiday_degree in (0, 0.3, 0.5)"
    columns:
      - name: date_key
        data_type: date
        data_tests:
          - unique
          - not_null
      - name: year
        data_type: int
        data_tests:
          - not_null
      - name: quarter
        data_type: int
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                max_value: 4
      - name: month
        data_type: int
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                max_value: 12
      - name: day_of_month
        data_type: int
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                max_value: 31
      - name: day_of_week_iso
        data_type: int
        description: ISO day of week, 1 = Monday through 7 = Sunday.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                max_value: 7
      - name: day_name
        data_type: string
        data_tests:
          - not_null
      - name: month_name
        data_type: string
        data_tests:
          - not_null
      - name: fiscal_year
        data_type: int
        description: Japanese fiscal year (April through March).
        data_tests:
          - not_null
      - name: fiscal_quarter
        data_type: int
        description: Quarter within the Japanese fiscal year (Q1 = April-June).
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                max_value: 4
      - name: is_weekend
        data_type: boolean
        data_tests:
          - not_null
      - name: is_holiday
        data_type: boolean
        description: >
          Non-working day: a Japanese national holiday per the Cabinet Office
          calendar, or a customary holiday (年末年始 12/30-1/3, ゴールデンウィーク
          4/30-5/2, お盆 8/13-8/16) whatever weekday it falls on.
        data_tests:
          - not_null
      - name: holiday_name_ja
        data_type: string
        description: >
          Holiday name in Japanese: the Cabinet Office name on a national
          holiday (which wins when a customary day is also one, e.g.
          2019-05-01 即位の日), else 年末年始 / ゴールデンウィーク / お盆 on a
          customary holiday; "Not Applicable" on non-holidays.
        data_tests:
          - not_null
      - name: is_business_day
        data_type: boolean
        description: >
          Working day: a Monday-Friday that is not a holiday (national or
          customary). Banks, offices and exchanges are open on 12/30, 4/30-5/2
          and お盆, so this is not a "banks open" flag.
        data_tests:
          - not_null
      - name: holiday_degree
        data_type: double
        description: >
          休日度合い, how much of a non-working day the date is, 0 to 1: the
          largest of three graded values after JP 4448226 B2 (新日本製鐵, 2000;
          docs/research/papers.md). Type 1, calendar: 1.0 on a Sunday or a
          national holiday, 0.8 on a Saturday, 0 on a weekday. Type 2, special
          period: 0.8 on the first day of 年末年始 (12/30), ゴールデンウィーク
          (4/29) and お盆 (8/13), 1.0 on their other days (12/30-1/3, 4/29-5/5,
          8/13-8/16). Type 3, sandwiched: 0.5 on a single working day with a
          non-working day on each side (飛び石連休の中日), 0.3 on each of two
          consecutive working days between non-working days (二飛び石連休の中日);
          longer runs of working days score 0. "Non-working" is not
          is_business_day, so the customary periods count as off days on both
          sides. Design: docs/superpowers/specs/2026-09-05-dim-date-holiday-degree-design.md.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 0.3, 0.5, 0.8, 1.0]
                quote: false
