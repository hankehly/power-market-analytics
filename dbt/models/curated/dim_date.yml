models:
  - name: dim_date
    config:
      contract:
        enforced: true
    description: >
      Calendar date dimension, one row per day from 2016-01-01 (earliest date
      across all fact sources; JMA weather starts here, JEPX spot at fiscal
      year 2016 = 2016-04-01) through the end of the last calendar year
      covered by the jpn_national_holidays seed (the spine end derives from
      the seed).
      Japanese fiscal calendar (April-March). is_holiday covers the official
      national holidays from the Cabinet Office (seed jpn_national_holidays,
      refresh with scripts/update_holidays_seed.py) plus the customary
      non-working days, computed as fixed month/day rules: 年末年始
      (12/30-12/31, 1/2-1/3) and ゴールデンウィーク (4/30-5/2) — the 休日 set the
      family-A TSO 託送供給等約款 share (北海道・東京・中部・関西・四国・九州;
      東北, 北陸, 中国 and 沖縄 differ slightly) — and お盆 (8/13-8/16), a
      nationwide convention with no statutory or tariff basis.
      Keyed by the date itself (Kimball exempts the date dimension from
      surrogate keys).
      prior_year_reference_date is the day one year earlier that stands for
      the day in a year-over-year comparison (the demand task's year-ago load
      feature), with prior_year_reference_rule naming how it was chosen —
      never null: a working day takes the same weekday 52 weeks back (D-364,
      same_weekday) when that is a working day too, else the same weekday one
      week nearer (D-357), else one week farther (D-371)
      (same_weekday_shifted); a weekend takes D-364 (same_weekday); a holiday
      takes the nearest day with the same holiday_name_ja within 14 days of
      the same calendar date a year earlier (same_holiday; a tie goes to the
      earlier day), else the nearest non-working day to that date
      (nearest_non_working_day — a new holiday, a one-off move such as the
      Olympic 海の日, a substitute 休日). References are resolved against a
      lookup calendar that starts 13 months before the spine, so the first
      year's references precede the spine and are not themselves rows here.
      The worked examples behind the rules are pinned in
      dbt_tests/assert_dim_date_prior_year_reference_examples.sql.
    data_tests:
      - dbt_utils.expression_is_true:
          name: dim_date_weekend_matches_day_of_week
          arguments:
            expression: "is_weekend = (day_of_week_iso in (6, 7))"
      # The customary non-working days are holidays in every year of the spine,
      # whatever weekday they fall on.
      - dbt_utils.expression_is_true:
          name: dim_date_customary_days_are_holidays
          arguments:
            expression: >
              is_holiday or not (
                (month = 1 and day_of_month in (2, 3))
                or (month = 4 and day_of_month = 30)
                or (month = 5 and day_of_month in (1, 2))
                or (month = 8 and day_of_month between 13 and 16)
                or (month = 12 and day_of_month in (30, 31))
              )
      - dbt_utils.expression_is_true:
          name: dim_date_holiday_name_matches_flag
          arguments:
            expression: "is_holiday = (holiday_name_ja <> 'Not Applicable')"
      - dbt_utils.expression_is_true:
          name: dim_date_business_day_is_non_holiday_weekday
          arguments:
            expression: "is_business_day = (day_of_week_iso <= 5 and not is_holiday)"
      # The reference lies 51-54 weeks back: 357 / 364 / 371 days for the
      # weekday rules, up to 14 days either side of the same calendar date a
      # year earlier (365 or 366 days) for the holiday rules.
      - dbt_utils.expression_is_true:
          name: dim_date_prior_year_reference_within_range
          arguments:
            expression: "datediff(date_key, prior_year_reference_date) between 357 and 378"
      - dbt_utils.expression_is_true:
          name: dim_date_prior_year_reference_rule_matches_holiday_flag
          arguments:
            expression: >
              is_holiday = (prior_year_reference_rule in ('same_holiday', 'nearest_non_working_day'))
      - dbt_utils.expression_is_true:
          name: dim_date_prior_year_same_weekday_is_364_days_back
          arguments:
            expression: >
              prior_year_reference_rule <> 'same_weekday'
              or datediff(date_key, prior_year_reference_date) = 364
      - dbt_utils.expression_is_true:
          name: dim_date_prior_year_shifted_weekday_is_357_or_371_days_back
          arguments:
            expression: >
              prior_year_reference_rule <> 'same_weekday_shifted'
              or datediff(date_key, prior_year_reference_date) in (357, 371)
    columns:
      - name: date_key
        data_type: date
        data_tests:
          - unique
          - not_null
      - name: year
        data_type: int
        data_tests:
          - not_null
      - name: quarter
        data_type: int
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                max_value: 4
      - name: month
        data_type: int
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                max_value: 12
      - name: day_of_month
        data_type: int
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                max_value: 31
      - name: day_of_week_iso
        data_type: int
        description: ISO day of week, 1 = Monday through 7 = Sunday.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                max_value: 7
      - name: day_name
        data_type: string
        data_tests:
          - not_null
      - name: month_name
        data_type: string
        data_tests:
          - not_null
      - name: fiscal_year
        data_type: int
        description: Japanese fiscal year (April through March).
        data_tests:
          - not_null
      - name: fiscal_quarter
        data_type: int
        description: Quarter within the Japanese fiscal year (Q1 = April-June).
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                max_value: 4
      - name: is_weekend
        data_type: boolean
        data_tests:
          - not_null
      - name: is_holiday
        data_type: boolean
        description: >
          Non-working day: a Japanese national holiday per the Cabinet Office
          calendar, or a customary holiday (年末年始 12/30-1/3, ゴールデンウィーク
          4/30-5/2, お盆 8/13-8/16) whatever weekday it falls on.
        data_tests:
          - not_null
      - name: holiday_name_ja
        data_type: string
        description: >
          Holiday name in Japanese: the Cabinet Office name on a national
          holiday (which wins when a customary day is also one, e.g.
          2019-05-01 即位の日), else 年末年始 / ゴールデンウィーク / お盆 on a
          customary holiday; "Not Applicable" on non-holidays.
        data_tests:
          - not_null
      - name: is_business_day
        data_type: boolean
        description: >
          Working day: a Monday-Friday that is not a holiday (national or
          customary). Banks, offices and exchanges are open on 12/30, 4/30-5/2
          and お盆, so this is not a "banks open" flag.
        data_tests:
          - not_null
      - name: prior_year_reference_date
        data_type: date
        description: >
          The day one year earlier that stands for this day in a
          year-over-year comparison; see the model description for the rules.
          Never null; for the spine's first year it precedes the spine (a
          2015 date with no row of its own).
        data_tests:
          - not_null
      - name: prior_year_reference_rule
        data_type: string
        description: >
          How prior_year_reference_date was chosen: same_weekday (D-364),
          same_weekday_shifted (D-357 or D-371, because D-364 is a holiday),
          same_holiday (the same holiday_name_ja a year earlier) or
          nearest_non_working_day (a holiday without a same-name twin).
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - same_weekday
                  - same_weekday_shifted
                  - same_holiday
                  - nearest_non_working_day
