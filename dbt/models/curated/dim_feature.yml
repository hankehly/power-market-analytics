models:
  - name: dim_feature
    config:
      contract:
        enforced: true
    description: >
      The feature dimension: one row per feature a model can use or has used, with the two
      names every feature has. feature_name is the mart column, the name code, presets, Feast,
      LightGBM and the stored contribution and importance rows use; it never changes.
      feature_expression is the name people read, built from the base value and its transforms
      (LAG(demand_kwh, 2d), ROLLING_MEAN(demand_kwh, gap=7d, window=4, step=7d)), and it may be
      edited. Every human-facing surface labels a feature through this dimension: the Superset
      feature catalogue and the forecast dashboards join it on feature_name, falling back to the
      name where it has no row. The rows are the tagged columns of every feature mart, each
      declaring meta.expression in its YAML, then the retired features that old runs still name
      (seed retired_features). The model SQL is generated by scripts/generate_feature_views.py
      from the manifest (just feature-views); never edit it, and the singular test
      assert_dim_feature_covers_every_tagged_column fails the build when it is stale. The
      naming rules for expressions are in docs/Feature-Naming.md.
    columns:
      - name: feature_name
        data_type: string
        description: >
          The mart column: the physical name, unique across every mart and retired feature. The
          contribution facts store it as component and the importance facts as feature.
        data_tests:
          - not_null
          - unique
      - name: feature_expression
        data_type: string
        description: >
          The name people read: the base value and its transforms (docs/Feature-Naming.md).
          Unique.
        data_tests:
          - not_null
          - unique
      - name: feature_view
        data_type: string
        description: >
          The feature mart the column is in, which is also its Feast feature view; null for a
          retired feature.
        data_tests:
          - not_null:
              config:
                where: "not is_retired"
      - name: feature_ref
        data_type: string
        description: >
          feature_view:feature_name, the reference a preset uses (tasks/<task>/presets.py,
          --add / --drop) and fct_feature_value.feature_ref; null for a retired feature.
        data_tests:
          - unique
          - not_null:
              config:
                where: "not is_retired"
      - name: grain
        data_type: string
        description: >
          The mart's grain: day (area_code x trade_date), hour (... x hour_ending) or period
          (... x time_code); null for a retired feature.
        data_tests:
          - accepted_values:
              arguments:
                values: ["day", "hour", "period"]
          - not_null:
              config:
                where: "not is_retired"
      - name: data_type
        data_type: string
        description: >
          The column's contract data type in its mart (int, bigint, double, ...); null for a
          retired feature.
        data_tests:
          - not_null:
              config:
                where: "not is_retired"
      - name: is_categorical
        data_type: boolean
        description: >
          True when the mart tags the column categorical, so LightGBM splits on category sets.
        data_tests:
          - not_null
      - name: is_retired
        data_type: boolean
        description: >
          True for a feature no mart has any more, kept so old runs keep their labels.
        data_tests:
          - not_null
      - name: feature_description
        data_type: string
        description: >
          The column's description from its mart YAML (the seed's for a retired feature).
