models:
  - name: fct_occto_demand_supply_forecast_30m
    config:
      contract:
        enforced: true
    description: >
      OCCTO day-after-next (翌々日) half-hourly area demand and supply-capacity
      forecasts by JEPX bidding zone, taken from the 広域予備率 エリア・広域ブロック
      情報 publication (std_occto__area_reserve_rate_dad). Grain: one row per
      delivery period (date_key x 30-minute time_code) per area — the same
      grain as fct_jepx_spot_area_price and
      fct_tepco_area_demand_generation_actual, so the three join on
      (date_key, time_code, area_key). The 9 JEPX areas only, from
      2025-04-01 (the 48-point 翌々日 series began with FY2025); Okinawa and
      the wide-area block / reserve columns are excluded here but remain in
      the standardized model. Periodic snapshot: exactly one published value
      per (date_key, time_code, area) — the series is formulated on
      date_key - 2 and published that day at ~17:35-18:05 JST (rule: 17:30
      以降速やかに), i.e. it is known ~16 h before the JEPX day-ahead auction
      for date_key closes (D-1 10:00) and is usable as a spot-price feature;
      see docs/OCCTO-Demand-Forecast-Retrieval.md §7 and §9. Measures are
      power in MW for the 30-minute period and ADDITIVE across areas (an
      area's demand_mw values sum to the wide-area block demand OCCTO
      publishes); they are not additive across periods — multiply by 0.5 h
      for MWh (x 500 for the kWh unit of the TEPCO actuals fact).
      supply_capacity_mw is available supply capacity (供給力), not a
      generation forecast; supply_capacity_mw - demand_mw is the published
      area reserve (エリア予備力) and can be negative. delivery_datetime is a
      standalone period-start timestamp for time-series work, not a
      dimension key.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - date_key
              - time_code
              - area_key
    columns:
      - name: date_key
        data_type: date
        description: Forecast target date (対象年月日); 2025-04-01 onward.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: "date '2025-04-01'"
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
      - name: time_code
        data_type: int
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_delivery_period')
                field: time_code
      - name: area_key
        data_type: int
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_area')
                field: area_key
      - name: delivery_datetime
        data_type: timestamp
        data_tests:
          - not_null
      - name: demand_mw
        data_type: double
        description: Forecast area demand for the 30-minute period, MW; additive across areas.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: supply_capacity_mw
        data_type: double
        description: Forecast area supply capacity (供給力) for the 30-minute period, MW; additive across areas.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
