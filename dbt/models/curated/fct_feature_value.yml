models:
  - name: fct_feature_value
    config:
      contract:
        enforced: true
    description: >
      Every tagged feature column of every feature mart as one long fact, the Superset surface
      of the feature catalogue (docs/superpowers/specs/2026-09-10-feature-catalogue-design.md
      section 8). Grain: area_code x trade_date x time_code x feature_ref x available_at, one
      row per delivery period, feature and vintage. Day marts are broadcast to the 48 periods
      and hour marts to the two periods of their hour (dim_delivery_period.hour_of_day + 1 =
      hour_ending); a mart with published_at (a fitted feature's scoring runs) keeps the newest
      published row per key and available_at, the row Feast serves. feature_value is the mart's
      value cast to double, null where the mart's is. The model SQL is generated by
      scripts/generate_feature_views.py from the manifest (just feature-views), so a newly
      tagged column reaches Superset with real ref edges; never edit it, and the singular test
      assert_fct_feature_value_covers_every_tagged_column fails the build when it is stale.
      This is a measure-type dimension, which the Kimball guidance accepts when the facts run
      to hundreds and a query reads a handful, the catalogue's stated goal; a feature's exact
      value for training is in its mart, and this fact is for browsing and charting.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - area_code
              - trade_date
              - time_code
              - feature_ref
              - available_at
    columns:
      - name: area_code
        data_type: string
        description: >
          dim_area.area_code of the bidding zone.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_area')
                field: area_code
      - name: trade_date
        data_type: date
        description: >
          The delivery day D.
        data_tests:
          - not_null
      - name: time_code
        data_type: int
        description: >
          JEPX delivery period 1-48 of D.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                max_value: 48
          - relationships:
              arguments:
                to: ref('dim_delivery_period')
                field: time_code
      - name: feature_view
        data_type: string
        description: >
          The feature mart the value comes from, which is also its Feast feature view (ftr_day_calendar, ...).
        data_tests:
          - not_null
      - name: feature_name
        data_type: string
        description: >
          The mart column.
        data_tests:
          - not_null
      - name: feature_ref
        data_type: string
        description: >
          feature_view:feature_name, the reference a preset uses (tasks/<task>/presets.py, --add / --drop).
        data_tests:
          - not_null
      - name: feature_value
        data_type: double
        description: >
          The mart's value cast to double; a boolean is 1 or 0; null where the mart's value is null (a training row without it is dropped).
      - name: is_categorical
        data_type: boolean
        description: >
          The mart column's categorical tag, how LightGBM treats the feature.
        data_tests:
          - not_null
      - name: available_at
        data_type: timestamp
        description: >
          When the mart row became public, naive JST; the as-of join and the Superset as-of dataset compare it with the issue time, 09:30 on D-1.
        data_tests:
          - not_null
      - name: published_at
        data_type: timestamp
        description: >
          When the mart row was written, for a mart with several vintages per key (a fitted feature's runs); null for the others.
