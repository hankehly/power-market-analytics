models:
  - name: std_occto__demand_forecast_dad
    config:
      contract:
        enforced: true
    description: >
      Standardized OCCTO day-after-next (翌々日) demand / peak supply
      forecasts: stg_occto__demand_forecast_dad with the Japanese area name
      mapped to a snake-case area_code (matching dim_area for the JEPX
      bidding zones; 'okinawa' and the two total rows 'total_9_areas' /
      'total_10_areas' have no dim_area row), an is_area_total flag, the
      forecast horizon in days (always 2), and the hour-ending labels parsed
      to integers 1-24 (24 = the hour ending at midnight). One row per
      target_date and area_code. Per OCCTO, min_demand_mw for target dates
      2025-03-31 and earlier is the demand at the minimum-reserve-rate time,
      not the minimum demand, and the hour-ending columns are null for
      total_10_areas rows through 2025-03-31.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - target_date
              - area_code
    columns:
      - name: target_date
        data_type: date
        data_tests:
          - not_null
      - name: formulated_date
        data_type: date
        data_tests:
          - not_null
      - name: forecast_horizon_days
        data_type: int
        description: target_date - formulated_date in days; 2 for the whole history.
        data_tests:
          - accepted_values:
              arguments:
                values: [2]
                quote: false
      - name: area_name_ja
        data_type: string
        data_tests:
          - not_null
      - name: area_code
        data_type: string
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [hokkaido, tohoku, tokyo, chubu, hokuriku, kansai, chugoku, shikoku, kyushu, okinawa, total_9_areas, total_10_areas]
      - name: is_area_total
        data_type: boolean
        data_tests:
          - not_null
      - name: min_demand_hour_ending
        data_type: int
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                max_value: 24
      - name: min_demand_mw
        data_type: int
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: max_demand_hour_ending
        data_type: int
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                max_value: 24
      - name: max_demand_mw
        data_type: int
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: max_supply_capacity_mw
        data_type: int
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: usage_rate_pct
        data_type: double
        data_tests:
          - not_null
      - name: reserve_rate_pct
        data_type: double
        data_tests:
          - not_null
