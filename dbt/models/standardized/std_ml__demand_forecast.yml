models:
  - name: std_ml__demand_forecast
    config:
      contract:
        enforced: true
    description: >
      stg_ml__demand_forecast with the typed time axis: trade_datetime is
      the start of the forecast 30-minute delivery period (trade_date +
      (time_code - 1) x 30 minutes), same construction as std_jepx__spot.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - run_id
              - area_code
              - trade_date
              - time_code
    columns:
      - name: run_id
        data_type: string
        data_tests:
          - not_null
      - name: strategy
        data_type: string
        data_tests:
          - not_null
      - name: area_code
        data_type: string
        data_tests:
          - not_null
      - name: trade_date
        data_type: date
        data_tests:
          - not_null
      - name: time_code
        data_type: int
        data_tests:
          - not_null
      - name: trade_datetime
        data_type: timestamp
        data_tests:
          - not_null
      - name: forecast_issued_ts
        data_type: timestamp
        data_tests:
          - not_null
      - name: forecast_demand_kwh
        data_type: double
        data_tests:
          - not_null
      - name: published_at
        data_type: timestamp
        data_tests:
          - not_null
