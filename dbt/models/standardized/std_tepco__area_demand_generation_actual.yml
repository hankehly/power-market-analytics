models:
  - name: std_tepco__area_demand_generation_actual
    config:
      contract:
        enforced: true
    description: >
      Standardized TEPCO Tokyo-area 30-minute actuals:
      stg_tepco__area_demand_generation_actual with a typed time axis
      (delivery_date, time_code, delivery_datetime = period start, Japanese
      fiscal_year) and the three measures rounded to bigint kWh (raw stores
      double because 13 April-2022 files use scientific notation). One row
      per delivery_date and time_code. Rows where all three published values
      are 0 — TEPCO's "not yet observed" sentinel, which survived in the
      archive for 2025-06-14 time codes 11-48 — have all three measures set
      to null; the row is kept so the grain stays dense. The published
      period-label strings are dropped (dim_half_hour carries them).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - delivery_date
              - time_code
      - dbt_utils.expression_is_true:
          name: std_tepco_area_actual_wind_solar_lte_generation
          arguments:
            expression: "wind_solar_generation_kwh <= generation_kwh"
      - dbt_utils.expression_is_true:
          name: std_tepco_area_actual_available_at_after_period_end
          arguments:
            expression: "available_at >= timestampadd(minute, 30, delivery_datetime)"
    columns:
      - name: delivery_date
        data_type: date
        data_tests:
          - not_null
      - name: time_code
        data_type: int
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                max_value: 48
      - name: delivery_datetime
        data_type: timestamp
        description: Start of the 30-minute period (delivery_date + (time_code - 1) * 30 min).
        data_tests:
          - not_null
      - name: fiscal_year
        data_type: int
        description: Japanese fiscal year (April-March) of delivery_date.
        data_tests:
          - not_null
      - name: demand_kwh
        data_type: bigint
        description: Area total demand in kWh over the period; null for the unpublished sentinel rows.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: generation_kwh
        data_type: bigint
        description: Area total generation in kWh over the period; null for the unpublished sentinel rows.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: wind_solar_generation_kwh
        data_type: bigint
        description: Wind + solar generation in kWh over the period; null for the unpublished sentinel rows.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: file_updated_at
        data_type: timestamp
        description: >
          The file's own ファイル更新日/時間, naive JST: when the version held was
          written. Kept for reference; available_at does not use it.
        data_tests:
          - not_null
      - name: available_at
        data_type: timestamp
        description: >
          When the row became public, naive JST: 00:30 on the day after
          delivery_date, for every row. TEPCO writes each day's file at 00:05 the
          next day (1,616 of 1,619 files, 2022-04-01 → 2026-09-05); the rule
          rounds that up to the half-hour. file_updated_at is not used: it dates
          the version held, not the first one. The 2022-12-01 and 12-02 files
          were replaced on 2022-12-14 and carry that date, though their first
          versions were public on time. A replacement that kept its stamp
          (2024-03-11, replaced 2024-04-19) gets the same rule, so a corrected
          value is dated to its day's normal publication. The frozen 2025-06-14
          file (written 05:05 that day) gets 2025-06-15 00:30.
        data_tests:
          - not_null
