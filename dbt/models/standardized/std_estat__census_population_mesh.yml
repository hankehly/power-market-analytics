models:
  - name: std_estat__census_population_mesh
    config:
      contract:
        enforced: true
    description: >
      Standardized census 500 m population mesh: stg_estat__census_population_mesh
      plus the mesh geography decoded from mesh_code — the bounding box
      (south/north latitude, west/east longitude; a 500 m mesh is 15" x 22.5")
      and its centroid, in decimal degrees on the vintage's geodetic_datum
      (JGD2000). One row per census_year and mesh_code; the source values are
      passed through unchanged (population as published for every mesh,
      privacy metadata verbatim). The decoding is the JIS X 0410 formula
      documented in docs/eStat-Census-Population-Mesh-Retrieval.md and mirrored
      by power_market_analytics.estat.decode_mesh_code (e.g. 533946114 →
      centroid 35.681250 N, 139.771875 E).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - census_year
              - mesh_code
      - dbt_utils.expression_is_true:
          name: std_estat_census_mesh_code_is_nine_digit_500m
          arguments:
            expression: "mesh_code rlike '^[0-9]{4}[0-7]{2}[0-9]{2}[1-4]$'"
      - dbt_utils.expression_is_true:
          name: std_estat_census_mesh_code_starts_with_primary
          arguments:
            expression: "substr(mesh_code, 1, 4) = primary_mesh_code"
      - dbt_utils.expression_is_true:
          name: std_estat_census_mesh_box_is_15_by_22_5_arcsec
          arguments:
            expression: >
              abs((north_latitude - south_latitude) - cast(1 as double) / 240) < 1e-9
              and abs((east_longitude - west_longitude) - cast(1 as double) / 160) < 1e-9
      - dbt_utils.expression_is_true:
          name: std_estat_census_mesh_centroid_inside_box
          arguments:
            expression: >
              centroid_latitude > south_latitude and centroid_latitude < north_latitude
              and centroid_longitude > west_longitude and centroid_longitude < east_longitude
    columns:
      - name: census_year
        data_type: int
        data_tests:
          - not_null
      - name: census_date
        data_type: date
        data_tests:
          - not_null
      - name: geodetic_datum
        data_type: string
        data_tests:
          - not_null
      - name: stats_id
        data_type: string
        data_tests:
          - not_null
      - name: primary_mesh_code
        data_type: string
        data_tests:
          - not_null
      - name: mesh_code
        data_type: string
        data_tests:
          - not_null
      - name: privacy_processing_code
        data_type: int
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1, 2]
                quote: false
      - name: aggregation_destination_mesh_code
        data_type: string
      - name: aggregation_source_mesh_codes
        data_type: string
      - name: population_total
        data_type: bigint
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: source_file
        data_type: string
        data_tests:
          - not_null
      - name: south_latitude
        data_type: double
        description: Southern edge of the mesh, decimal degrees north.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 20
                max_value: 46
      - name: north_latitude
        data_type: double
        description: Northern edge (south_latitude + 1/240°).
        data_tests:
          - not_null
      - name: west_longitude
        data_type: double
        description: Western edge of the mesh, decimal degrees east.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 122
                max_value: 155
      - name: east_longitude
        data_type: double
        description: Eastern edge (west_longitude + 1/160°).
        data_tests:
          - not_null
      - name: centroid_latitude
        data_type: double
        description: Midpoint latitude of the mesh.
        data_tests:
          - not_null
      - name: centroid_longitude
        data_type: double
        description: Midpoint longitude of the mesh.
        data_tests:
          - not_null
