models:
  - name: ftr_hour_jma_obs
    config:
      contract:
        enforced: true
    description: >
      The recency-weighted same-hour temperature at each bidding zone's representative JMA station (dim_area.representative_jma_station_id) over D-8..D-2, the demand presets' wavg_temperature_c; and, since feature candidate #150, the area's population-weighted observed temperature accumulated along the clock over the 24 and 72 hours ending at the hour on D-2, with its 24-hour half-life weighted average. Since 2026-09-29 the weighted hour comes from fct_area_weather_hourly, and the mart carries the D-2 and D-7 population-weighted temperature and solar radiation at the hour, the weather the two load lags were recorded under (feature candidates #237 and #238). Grain: area_code x trade_date x hour_ending (1-24, hour ending). A row exists for every delivery day that at least one lag observation of the representative station reaches; the value is null only when every lag is missing.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - area_code
              - trade_date
              - hour_ending
    columns:
      - name: area_code
        data_type: string
        description: >
          dim_area.area_code of the bidding zone.
        data_tests:
          - not_null
      - name: trade_date
        data_type: date
        description: >
          The delivery day D.
        data_tests:
          - not_null
      - name: hour_ending
        data_type: int
        description: >
          Observation hour 1-24, hour ending; a period's hour is (time_code + 1) div 2.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                max_value: 24
      - name: wavg_temperature_c
        data_type: double
        description: >
          Weighted mean of the station's temperature at this hour on D-2..D-8, weight 0.5 ** (k - 2) for lag k, renormalised over the lags present; null when all are missing. The terms are added in lag order (D-2 first), so the value is the same on every build (the ordered_weighted_mean macro).
        config:
          meta:
            feature: true
            categorical: false
            expression: "EWA(temperature_c, gap=2d, window=7, step=1d, halflife=1)"
      - name: mean_24h_popw_temperature_c
        data_type: double
        description: >
          The area's population-weighted observed temperature averaged over the 24 hours that end at this hour on D-2, C (feature candidate #150). Each hour is weighted over the area's stations that report it, with the latest census vintage's weights, renormalised and added in station order (the ordered_weighted_mean macro), as ftr_hour_msm weighs the forecast; the 24 hours are added oldest first. Complete windows only: null unless all 24 hours have a value. A missing station does not break a window; an hour no station reports does.
        config:
          meta:
            feature: true
            categorical: false
            expression: "ROLLING_MEAN(MEAN(temperature_c, weight=population), gap=2d, window=24, step=1h)"
      - name: mean_72h_popw_temperature_c
        data_type: double
        description: >
          The same over the 72 hours that end at this hour on D-2, C (feature candidate #150). Null unless all 72 hours have a value.
        config:
          meta:
            feature: true
            categorical: false
            expression: "ROLLING_MEAN(MEAN(temperature_c, weight=population), gap=2d, window=72, step=1h)"
      - name: ewm_72h_popw_temperature_c
        data_type: double
        description: >
          The same 72 hours weighted 0.5^(k / 24), k hours back from the newest: a half-life of 24 hours, divided by the sum of the weights, C (feature candidate #150). The 72 weights are literals the model computes when it compiles, so the SQL only adds and multiplies and the value is the same on every build. Null unless all 72 hours have a value.
        config:
          meta:
            feature: true
            categorical: false
            expression: "EWA(MEAN(temperature_c, weight=population), gap=2d, window=72, step=1h, halflife=24)"
      - name: lag_2d_popw_temperature_c
        data_type: double
        description: >
          The area's population-weighted observed temperature at this hour on D-2, C, from
          fct_area_weather_hourly: the weather the load lag LAG(demand_kwh, 2d) was recorded
          under (the researcher's lag-window weather idea of 2026-09-28, feature candidate
          #237; spec docs/superpowers/specs/2026-09-29-lag-window-weather-siblings-design.md).
          Null when no weighted station reported that hour. Its difference from D's forecast
          is ftr_hour_msm.delta_lag_2d_popw_temperature_c. Not a duplicate of the windows
          above: mean_24h_popw_temperature_c averages the 24 hours ending here on D-2, and
          wavg_temperature_c gives D-2 half its weight over D-2 to D-8; this is the one hour.
        config:
          meta:
            feature: true
            categorical: false
            expression: "LAG(MEAN(temperature_c, weight=population), 2d)"
      - name: lag_7d_popw_temperature_c
        data_type: double
        description: >
          The same at this hour on D-7: the weather under LAG(demand_kwh, 7d) (feature
          candidate #237).
        config:
          meta:
            feature: true
            categorical: false
            expression: "LAG(MEAN(temperature_c, weight=population), 7d)"
      - name: lag_2d_popw_solar_radiation_mjm2
        data_type: double
        description: >
          The area's population-weighted observed solar radiation over this hour on D-2,
          MJ/m2, from fct_area_weather_hourly (feature candidate #238), weighted over the
          stations that record it: 7 of Tokyo's 21 weighted stations (東京 three quarters of
          their weight; 横浜, 千葉 and 熊谷 the largest without) and 3 of Kansai's 11 (大阪
          four fifths; 京都, 神戸 and 姫路 without), 55.4 % of each area's weight, so the value
          is close to the representative station's; the fact's
          weight_share_solar_radiation_mjm2 gives the hour's share. A more representative
          radiation source is future work. Null when none of them reported the hour.
        config:
          meta:
            feature: true
            categorical: false
            expression: "LAG(MEAN(solar_radiation_mjm2, weight=population), 2d)"
      - name: lag_7d_popw_solar_radiation_mjm2
        data_type: double
        description: >
          The same over this hour on D-7 (feature candidate #238).
        config:
          meta:
            feature: true
            categorical: false
            expression: "LAG(MEAN(solar_radiation_mjm2, weight=population), 7d)"
      - name: available_at
        data_type: timestamp
        description: >
          When the row became public, naive JST: D-2's hour end + 1 h, the JMA rule for the newest observation the window can hold. The D-2 siblings end at that hour and the D-7 ones are older, so the same instant holds.
        data_tests:
          - not_null

unit_tests:
  - name: ftr_hour_jma_obs_recency_weights_renormalisation_and_shift
    description: >
      Hour 1 at the Tokyo station on 2025-03-07 (11 C), 2025-03-08 (5 C) and a
      null reading on 2025-03-06. Each observation feeds the seven delivery days
      2 to 8 days later; where both readings fall in a window the halving
      weights give 7.0 whatever the lags, a lone reading gives itself, and the
      null alone gives null. available_at is D-2's hour end + 1 h.
    model: ftr_hour_jma_obs
    given:
      - input: ref('dim_area')
        rows:
          - {area_key: 1, area_code: tokyo, representative_jma_station_id: s1}
      - input: ref('fct_area_weather_hourly')
        format: sql
        rows: |
          select cast(null as int) as area_key, cast(null as date) as date_key,
            cast(null as int) as hour_ending, cast(null as timestamp) as observed_hour_start_at,
            cast(null as double) as popw_temperature_c, cast(null as double) as popw_solar_radiation_mjm2
          where false
      - input: ref('fct_jma_weather_hourly')
        rows:
          - {station_id: s1, date_key: 2025-03-06, observed_hour_start_at: "2025-03-06 00:00:00", temperature_c: null}
          - {station_id: s1, date_key: 2025-03-07, observed_hour_start_at: "2025-03-07 00:00:00", temperature_c: 11.0}
          - {station_id: s1, date_key: 2025-03-08, observed_hour_start_at: "2025-03-08 00:00:00", temperature_c: 5.0}
    expect:
      rows:
        - {area_code: tokyo, trade_date: 2025-03-08, hour_ending: 1, wavg_temperature_c: null, available_at: "2025-03-06 02:00:00"}
        - {area_code: tokyo, trade_date: 2025-03-09, hour_ending: 1, wavg_temperature_c: 11.0, available_at: "2025-03-07 02:00:00"}
        - {area_code: tokyo, trade_date: 2025-03-10, hour_ending: 1, wavg_temperature_c: 7.0, available_at: "2025-03-08 02:00:00"}
        - {area_code: tokyo, trade_date: 2025-03-11, hour_ending: 1, wavg_temperature_c: 7.0, available_at: "2025-03-09 02:00:00"}
        - {area_code: tokyo, trade_date: 2025-03-12, hour_ending: 1, wavg_temperature_c: 7.0, available_at: "2025-03-10 02:00:00"}
        - {area_code: tokyo, trade_date: 2025-03-13, hour_ending: 1, wavg_temperature_c: 7.0, available_at: "2025-03-11 02:00:00"}
        - {area_code: tokyo, trade_date: 2025-03-14, hour_ending: 1, wavg_temperature_c: 7.0, available_at: "2025-03-12 02:00:00"}
        - {area_code: tokyo, trade_date: 2025-03-15, hour_ending: 1, wavg_temperature_c: 7.0, available_at: "2025-03-13 02:00:00"}
        - {area_code: tokyo, trade_date: 2025-03-16, hour_ending: 1, wavg_temperature_c: 5.0, available_at: "2025-03-14 02:00:00"}

  - name: ftr_hour_jma_obs_population_weighted_24h_and_72h_windows
    description: >
      The fact holds Tokyo's population-weighted hour for every hour from
      03-01 00:00 to 03-05 23:00 at 11 + 0.5 x the hour + the day of the
      month (the weighting itself is the fact's own unit test). Two things
      are missing. The fact has no row for 03-01 10:00, the hour no station
      reported. 03-03 07:00 is one degree lower, 16.5, the hour one station
      reported alone. s1, the representative station, has two readings, 03-03
      and 03-04 at 23:00, which make the mart's rows: hour ending 24 on 03-05
      to 03-12. Each row reads the windows that end at that hour on D-2. 03-05
      has its 24-hour mean, 03-03's hours, one of them the lower one
      (19.75 - 1 / 24), but no 72-hour value: its window holds the missing
      hour. 03-06 and 03-07 have all three. From 03-08 the windows end after
      the last fact hour, so all are null. The weighted average's 72 weights
      halve every 24 hours and are literals in the model, so the expected
      doubles are the same additions and multiplications in the same order in
      Python.
    model: ftr_hour_jma_obs
    given:
      - input: ref('dim_area')
        rows:
          - {area_key: 1, area_code: tokyo, representative_jma_station_id: s1}
      - input: ref('fct_jma_weather_hourly')
        rows:
          - {station_id: s1, date_key: 2025-03-03, observed_hour_start_at: "2025-03-03 23:00:00", temperature_c: 8.0}
          - {station_id: s1, date_key: 2025-03-04, observed_hour_start_at: "2025-03-04 23:00:00", temperature_c: 9.0}
      - input: ref('fct_area_weather_hourly')
        format: sql
        rows: |
          with hours as (
            select explode(sequence(
              timestamp '2025-03-01 00:00:00', timestamp '2025-03-05 23:00:00', interval 1 hour)) as ts
          )
          select 1 as area_key, cast(ts as date) as date_key, hour(ts) + 1 as hour_ending,
            ts as observed_hour_start_at,
            case when ts = timestamp '2025-03-03 07:00:00'
              then cast(10 + hour(ts) * 0.5 + day(ts) as double)
              else cast(11 + hour(ts) * 0.5 + day(ts) as double) end as popw_temperature_c,
            cast(null as double) as popw_solar_radiation_mjm2
          from hours where ts <> timestamp '2025-03-01 10:00:00'
    expect:
      rows:
        - {area_code: tokyo, trade_date: 2025-03-05, hour_ending: 24, mean_24h_popw_temperature_c: 19.708333333333332, mean_72h_popw_temperature_c: null, ewm_72h_popw_temperature_c: null}
        - {area_code: tokyo, trade_date: 2025-03-06, hour_ending: 24, mean_24h_popw_temperature_c: 20.75, mean_72h_popw_temperature_c: 19.73611111111111, ewm_72h_popw_temperature_c: 20.854779715085353}
        - {area_code: tokyo, trade_date: 2025-03-07, hour_ending: 24, mean_24h_popw_temperature_c: 21.75, mean_72h_popw_temperature_c: 20.73611111111111, ewm_72h_popw_temperature_c: 21.85990364459824}
        - {area_code: tokyo, trade_date: 2025-03-08, hour_ending: 24, mean_24h_popw_temperature_c: null, mean_72h_popw_temperature_c: null, ewm_72h_popw_temperature_c: null}
        - {area_code: tokyo, trade_date: 2025-03-09, hour_ending: 24, mean_24h_popw_temperature_c: null, mean_72h_popw_temperature_c: null, ewm_72h_popw_temperature_c: null}
        - {area_code: tokyo, trade_date: 2025-03-10, hour_ending: 24, mean_24h_popw_temperature_c: null, mean_72h_popw_temperature_c: null, ewm_72h_popw_temperature_c: null}
        - {area_code: tokyo, trade_date: 2025-03-11, hour_ending: 24, mean_24h_popw_temperature_c: null, mean_72h_popw_temperature_c: null, ewm_72h_popw_temperature_c: null}
        - {area_code: tokyo, trade_date: 2025-03-12, hour_ending: 24, mean_24h_popw_temperature_c: null, mean_72h_popw_temperature_c: null, ewm_72h_popw_temperature_c: null}

  - name: ftr_hour_jma_obs_lag_2d_and_7d_weather_siblings
    description: >
      The representative station's hour-1 readings on 2025-03-07 and 03-08 make the
      mart's rows for 03-09 to 03-16. The fact holds hour 1 of 03-07 (12 C, 0.3 MJ/m2)
      and of 03-02 (9 C, 0.1). 03-09 reads 03-07 as D-2 and 03-02 as D-7; 03-14 reads
      03-07 as D-7; every other row has no fact hour two or seven days back and is null.
      wavg_temperature_c and available_at are the first test's, untouched.
    model: ftr_hour_jma_obs
    given:
      - input: ref('dim_area')
        rows:
          - {area_key: 1, area_code: tokyo, representative_jma_station_id: s1}
      - input: ref('fct_jma_weather_hourly')
        rows:
          - {station_id: s1, date_key: 2025-03-07, observed_hour_start_at: "2025-03-07 00:00:00", temperature_c: 11.0}
          - {station_id: s1, date_key: 2025-03-08, observed_hour_start_at: "2025-03-08 00:00:00", temperature_c: 5.0}
      - input: ref('fct_area_weather_hourly')
        format: sql
        rows: |
          select 1 as area_key, date '2025-03-07' as date_key, 1 as hour_ending,
            timestamp '2025-03-07 00:00:00' as observed_hour_start_at,
            cast(12 as double) as popw_temperature_c, cast(0.3 as double) as popw_solar_radiation_mjm2
          union all
          select 1, date '2025-03-02', 1, timestamp '2025-03-02 00:00:00', cast(9 as double), cast(0.1 as double)
    expect:
      rows:
        - {area_code: tokyo, trade_date: 2025-03-09, hour_ending: 1, wavg_temperature_c: 11.0, lag_2d_popw_temperature_c: 12.0, lag_7d_popw_temperature_c: 9.0, lag_2d_popw_solar_radiation_mjm2: 0.3, lag_7d_popw_solar_radiation_mjm2: 0.1, available_at: "2025-03-07 02:00:00"}
        - {area_code: tokyo, trade_date: 2025-03-10, hour_ending: 1, wavg_temperature_c: 7.0, lag_2d_popw_temperature_c: null, lag_7d_popw_temperature_c: null, lag_2d_popw_solar_radiation_mjm2: null, lag_7d_popw_solar_radiation_mjm2: null, available_at: "2025-03-08 02:00:00"}
        - {area_code: tokyo, trade_date: 2025-03-11, hour_ending: 1, wavg_temperature_c: 7.0, lag_2d_popw_temperature_c: null, lag_7d_popw_temperature_c: null, lag_2d_popw_solar_radiation_mjm2: null, lag_7d_popw_solar_radiation_mjm2: null, available_at: "2025-03-09 02:00:00"}
        - {area_code: tokyo, trade_date: 2025-03-12, hour_ending: 1, wavg_temperature_c: 7.0, lag_2d_popw_temperature_c: null, lag_7d_popw_temperature_c: null, lag_2d_popw_solar_radiation_mjm2: null, lag_7d_popw_solar_radiation_mjm2: null, available_at: "2025-03-10 02:00:00"}
        - {area_code: tokyo, trade_date: 2025-03-13, hour_ending: 1, wavg_temperature_c: 7.0, lag_2d_popw_temperature_c: null, lag_7d_popw_temperature_c: null, lag_2d_popw_solar_radiation_mjm2: null, lag_7d_popw_solar_radiation_mjm2: null, available_at: "2025-03-11 02:00:00"}
        - {area_code: tokyo, trade_date: 2025-03-14, hour_ending: 1, wavg_temperature_c: 7.0, lag_2d_popw_temperature_c: null, lag_7d_popw_temperature_c: 12.0, lag_2d_popw_solar_radiation_mjm2: null, lag_7d_popw_solar_radiation_mjm2: 0.3, available_at: "2025-03-12 02:00:00"}
        - {area_code: tokyo, trade_date: 2025-03-15, hour_ending: 1, wavg_temperature_c: 7.0, lag_2d_popw_temperature_c: null, lag_7d_popw_temperature_c: null, lag_2d_popw_solar_radiation_mjm2: null, lag_7d_popw_solar_radiation_mjm2: null, available_at: "2025-03-13 02:00:00"}
        - {area_code: tokyo, trade_date: 2025-03-16, hour_ending: 1, wavg_temperature_c: 5.0, lag_2d_popw_temperature_c: null, lag_7d_popw_temperature_c: null, lag_2d_popw_solar_radiation_mjm2: null, lag_7d_popw_solar_radiation_mjm2: null, available_at: "2025-03-14 02:00:00"}
