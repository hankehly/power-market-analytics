models:
  - name: ftr_period_similar_day
    config:
      contract:
        enforced: true
    description: >
      The demand similar-day features for every delivery period, as scripts/fit_similar_day.py
      scored them walking forward and wrote them to pma_ml.similar_day. The pool follows Park,
      Song and Kwon (2020): for a delivery day D, the days D - 2 ... D - 31 and D - 335 ... D -
      394, without special days (dim_date.is_holiday) and without days whose whole load was not
      public by D's issue time (09:30 on D-1). Every few days the job refits the seven weights of
      tasks/demand/similar_day.py's distance on the 730 days before that step and ranks the days
      that follow with them. The distance has seven parts: the lag in days, the 24-hour RMSE of
      D's population-weighted MSM forecast against the candidate's population-weighted
      observation for temperature, humidity and rain, and the differences in days since and
      until a named holiday and in holiday degree. The three nearest days give four features:
      their hourly loads over the hour containing the period, halved, and their inverse-distance
      weighted mean. A special day whose same holiday last year (dim_date.holiday_name_ja) lies
      335 ... 394 days back, with its load public by the issue time, takes that day instead
      (similar_day_method same_holiday): rank 1 and the mean carry its load, and ranks 2 and 3,
      the distances, the candidate count and the fit cutoff are null. Any other special day is
      ranked like an ordinary day (similarity). The similar_day_pool_* columns carry the
      ranking on every day, that override included, so a preset picks the variant it wants. No day is ranked with weights that saw a load
      that was not yet public: each fit runs at a cutoff on the pairs of the 730 days before it
      whose target load was public by then, and a day is ranked by the latest fit whose cutoff
      is on or before its issue time. available_at is the latest of every input behind the
      row, both variants' included: D's MSM forecast vintage, the fit's cutoff and the load
      availability of the days either variant ranked or took. The reference days, distances, candidate
      count, fit cutoff and method sit next to the features, untagged. One row per scoring run:
      the as-of join takes the newest run usable at the issue time, and among rows tied on
      available_at the newest published wins. So a re-run replaces an older run's row only where
      the two rows' available_at tie: a same-holiday row, public about a year before its day,
      loses to an older run's ranked row for the same day. When the method's rules change, drop
      pma_ml.similar_day (or the older run's partition) before the re-run. Since 2026-09-29
      (feature candidates #237 and #238, spec
      docs/superpowers/specs/2026-09-29-lag-window-weather-siblings-design.md, section 5.7)
      the mart also carries the pool days' observed weather at the hour containing the
      period — fct_area_weather_hourly's population-weighted temperature and solar radiation
      on each pool rank's reference date, their inverse-distance mean under the job's rule
      (the inverse_distance_mean macro, proven equal to the job's own mean by the singular
      test assert_ftr_period_similar_day_mean_rule_reproduces_the_job) — and D's
      population-weighted forecast at that hour (ftr_hour_msm, one vintage per delivery
      day) minus each: 16 columns, null where the fact has no hour on a pool day, the pool
      has no such rank or D has no forecast. available_at is unchanged: the row already
      waits for the vintage, and a pool day's weather is public an hour after its hour,
      long before its load. Grain: area_code x trade_date x time_code x
      similar_day_run_id.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - area_code
              - trade_date
              - time_code
              - similar_day_run_id
    columns:
      - name: area_code
        data_type: string
        description: >
          dim_area.area_code of the bidding zone.
        data_tests:
          - not_null
      - name: trade_date
        data_type: date
        description: >
          The delivery day D.
        data_tests:
          - not_null
      - name: time_code
        data_type: int
        description: >
          JEPX time code 1-48 of the delivery period.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                max_value: 48
      - name: similar_day_run_id
        data_type: string
        description: >
          The scoring run: the MLflow run id (experiment similar_day) that ranked the day or took its same holiday.
        data_tests:
          - not_null
      - name: similar_day_rank1_demand_kwh
        data_type: double
        description: >
          The nearest pool day's hourly load (fct_area_power_usage_hourly, kWh over the hour containing the period) halved, kWh per 30-minute period. On a same-holiday day, the load of last year's same holiday. Never null.
        config:
          meta:
            feature: true
            categorical: false
            expression: "SIMILAR_DAY(power_usage_demand_kwh, gap=(2d, 335d), window=(30, 60), rank=1, holidays=same_holiday) / 2"
        data_tests:
          - not_null
      - name: similar_day_rank2_demand_kwh
        data_type: double
        description: >
          The second nearest pool day's hourly load (fct_area_power_usage_hourly, kWh over the hour containing the period) halved, kWh per 30-minute period. Null on a same-holiday day and when the pool has fewer than two days.
        config:
          meta:
            feature: true
            categorical: false
            expression: "SIMILAR_DAY(power_usage_demand_kwh, gap=(2d, 335d), window=(30, 60), rank=2, holidays=same_holiday) / 2"
      - name: similar_day_rank3_demand_kwh
        data_type: double
        description: >
          The third nearest pool day's hourly load (fct_area_power_usage_hourly, kWh over the hour containing the period) halved, kWh per 30-minute period. Null on a same-holiday day and when the pool has fewer than three days.
        config:
          meta:
            feature: true
            categorical: false
            expression: "SIMILAR_DAY(power_usage_demand_kwh, gap=(2d, 335d), window=(30, 60), rank=3, holidays=same_holiday) / 2"
      - name: wavg_similar_day_top3_demand_kwh
        data_type: double
        description: >
          The mean of the three nearest pool days' hourly loads halved, weighted by inverse distance (w_r = (1 / d_r) / sum_s (1 / d_s) over the ranks present, summed in rank order; days at distance 0 share all the weight), kWh per 30-minute period. On a same-holiday day, rank 1's load. Never null.
        config:
          meta:
            feature: true
            categorical: false
            expression: "SIMILAR_DAY_MEAN(power_usage_demand_kwh, gap=(2d, 335d), window=(30, 60), k=3, weight=inverse_distance, holidays=same_holiday) / 2"
        data_tests:
          - not_null
      - name: similar_day_rank1_reference_date
        data_type: date
        description: >
          Rank 1's day: the nearest pool day, or last year's same holiday on a same-holiday day.
        data_tests:
          - not_null
      - name: similar_day_rank2_reference_date
        data_type: date
        description: >
          Rank 2's day; null where its load is.
      - name: similar_day_rank3_reference_date
        data_type: date
        description: >
          Rank 3's day; null where its load is.
      - name: similar_day_rank1_distance
        data_type: double
        description: >
          Rank 1's distance from D under the run's weights: how good the match is, smaller is closer. Null on a same-holiday day, which is not ranked and has no distance (7 % of Tokyo's days). A feature since 2026-09-19 (feature candidate #138).
        config:
          meta:
            feature: true
            categorical: false
            expression: "similar_day_rank1_distance"
      - name: similar_day_rank2_distance
        data_type: double
        description: >
          Rank 2's distance from D under the run's weights; null where its load is.
      - name: similar_day_rank3_distance
        data_type: double
        description: >
          Rank 3's distance from D under the run's weights; null where its load is.
      - name: similar_day_n_candidates
        data_type: int
        description: >
          Pool days that could be ranked for D (up to 90); null on a same-holiday day.
      - name: similar_day_fit_cutoff
        data_type: timestamp
        description: >
          When the fit whose weights ranked the day ran, naive JST: on or before D's issue time, and every pair it used was public by then. Null on a same-holiday day.
      - name: similar_day_rank1_lag_days
        data_type: int
        description: >
          The days from the rank-1 day to D: trade_date minus similar_day_rank1_reference_date (feature candidate #138). On a ranked day it falls in one of the pool's two windows, 2 to 31 or 335 to 394, and nowhere between; on a same-holiday day it is the days back to the same holiday last year.
        config:
          meta:
            feature: true
            categorical: false
            expression: "similar_day_rank1_lag_days"
        data_tests:
          - not_null
      - name: similar_day_pool_rank1_demand_kwh
        data_type: double
        description: >
          The nearest pool day's hourly load (fct_area_power_usage_hourly, kWh over the hour containing the period) halved, kWh per 30-minute period. Unlike similar_day_rank1_demand_kwh this is the ranking on every day, a same-holiday day included, so a preset picks between copying last year's same holiday and ranking every day (experiment #219). Null where the pool had no candidate.
        config:
          meta:
            feature: true
            categorical: false
            expression: "SIMILAR_DAY(power_usage_demand_kwh, gap=(2d, 335d), window=(30, 60), rank=1, holidays=similarity) / 2"
      - name: similar_day_pool_rank2_demand_kwh
        data_type: double
        description: >
          The second nearest pool day's hourly load (fct_area_power_usage_hourly, kWh over the hour containing the period) halved, kWh per 30-minute period. Unlike similar_day_rank2_demand_kwh this is the ranking on every day, a same-holiday day included, so a preset picks between copying last year's same holiday and ranking every day (experiment #219). Null where the pool had no candidate. Null when the pool has fewer than two days.
        config:
          meta:
            feature: true
            categorical: false
            expression: "SIMILAR_DAY(power_usage_demand_kwh, gap=(2d, 335d), window=(30, 60), rank=2, holidays=similarity) / 2"
      - name: similar_day_pool_rank3_demand_kwh
        data_type: double
        description: >
          The third nearest pool day's hourly load (fct_area_power_usage_hourly, kWh over the hour containing the period) halved, kWh per 30-minute period. Unlike similar_day_rank3_demand_kwh this is the ranking on every day, a same-holiday day included, so a preset picks between copying last year's same holiday and ranking every day (experiment #219). Null where the pool had no candidate. Null when the pool has fewer than three days.
        config:
          meta:
            feature: true
            categorical: false
            expression: "SIMILAR_DAY(power_usage_demand_kwh, gap=(2d, 335d), window=(30, 60), rank=3, holidays=similarity) / 2"
      - name: wavg_similar_day_pool_top3_demand_kwh
        data_type: double
        description: >
          The mean of the pool rank loads present, weighted by inverse distance by the rule of wavg_similar_day_top3_demand_kwh, kWh per 30-minute period. The ranking on every day, a same-holiday day included. Null where the pool had no candidate.
        config:
          meta:
            feature: true
            categorical: false
            expression: "SIMILAR_DAY_MEAN(power_usage_demand_kwh, gap=(2d, 335d), window=(30, 60), k=3, weight=inverse_distance, holidays=similarity) / 2"
      - name: similar_day_pool_rank1_reference_date
        data_type: date
        description: >
          The pool ranking's rank-1 day; null where its load is.
      - name: similar_day_pool_rank2_reference_date
        data_type: date
        description: >
          The pool ranking's rank-2 day; null where its load is.
      - name: similar_day_pool_rank3_reference_date
        data_type: date
        description: >
          The pool ranking's rank-3 day; null where its load is.
      - name: similar_day_pool_rank1_distance
        data_type: double
        description: >
          The pool ranking's rank-1 distance from D under the run's fitted weights. Unlike similar_day_rank1_distance it is filled on a same-holiday day.
        config:
          meta:
            feature: true
            categorical: false
            expression: "similar_day_pool_rank1_distance"
      - name: similar_day_pool_rank2_distance
        data_type: double
        description: >
          The pool ranking's rank-2 distance from D; null where its load is.
      - name: similar_day_pool_rank3_distance
        data_type: double
        description: >
          The pool ranking's rank-3 distance from D; null where its load is.
      - name: similar_day_pool_n_candidates
        data_type: int
        description: >
          Pool days that could be ranked for D (up to 90). Unlike similar_day_n_candidates it is filled on a same-holiday day.
      - name: similar_day_pool_fit_cutoff
        data_type: timestamp
        description: >
          When the fit that ranked the day ran, naive JST; filled on a same-holiday day, where similar_day_fit_cutoff is null.
      - name: similar_day_pool_rank1_lag_days
        data_type: int
        description: >
          The days from the pool ranking's rank-1 day to D. Always in one of the pool's two windows, 2 to 31 or 335 to 394: the same-holiday override cannot reach it. Null where the pool had no candidate.
        config:
          meta:
            feature: true
            categorical: false
            expression: "similar_day_pool_rank1_lag_days"
      - name: similar_day_pool_rank1_popw_temperature_c
        data_type: double
        description: >
          The area's population-weighted observed temperature (fct_area_weather_hourly) at the hour containing the period on the pool's rank-1 day, similar_day_pool_rank1_reference_date, C: the weather similar_day_pool_rank1_demand_kwh was recorded under (feature candidate #237). Null where the fact has no hour on that day or the pool has no rank 1.
        config:
          meta:
            feature: true
            categorical: false
            expression: "SIMILAR_DAY(MEAN(temperature_c, weight=population), gap=(2d, 335d), window=(30, 60), rank=1, holidays=similarity)"
      - name: similar_day_pool_rank2_popw_temperature_c
        data_type: double
        description: >
          The same on the pool's rank-2 day (feature candidate #237).
        config:
          meta:
            feature: true
            categorical: false
            expression: "SIMILAR_DAY(MEAN(temperature_c, weight=population), gap=(2d, 335d), window=(30, 60), rank=2, holidays=similarity)"
      - name: similar_day_pool_rank3_popw_temperature_c
        data_type: double
        description: >
          The same on the pool's rank-3 day (feature candidate #237).
        config:
          meta:
            feature: true
            categorical: false
            expression: "SIMILAR_DAY(MEAN(temperature_c, weight=population), gap=(2d, 335d), window=(30, 60), rank=3, holidays=similarity)"
      - name: wavg_similar_day_pool_top3_popw_temperature_c
        data_type: double
        description: >
          The three ranks' temperatures weighted by the job's inverse-distance weights (the inverse_distance_mean macro: 1 / distance per rank, renormalised over the ranks whose value is present, zero distances sharing the weight equally), C: the temperature wavg_similar_day_pool_top3_demand_kwh's loads were recorded under (feature candidate #237). Null where no rank has a value.
        config:
          meta:
            feature: true
            categorical: false
            expression: "SIMILAR_DAY_MEAN(MEAN(temperature_c, weight=population), gap=(2d, 335d), window=(30, 60), k=3, weight=inverse_distance, holidays=similarity)"
      - name: similar_day_pool_rank1_popw_solar_radiation_mjm2
        data_type: double
        description: >
          The area's population-weighted observed solar radiation over the hour containing the period on the pool's rank-1 day, MJ/m2 (feature candidate #238), weighted over the stations that record it: 7 of Tokyo's 21 weighted stations and 3 of Kansai's 11, 55.4 % of each area's weight (fct_area_weather_hourly's description); a more representative radiation source is future work. Null where the fact has no hour on that day or the pool has no rank 1.
        config:
          meta:
            feature: true
            categorical: false
            expression: "SIMILAR_DAY(MEAN(solar_radiation_mjm2, weight=population), gap=(2d, 335d), window=(30, 60), rank=1, holidays=similarity)"
      - name: similar_day_pool_rank2_popw_solar_radiation_mjm2
        data_type: double
        description: >
          The same on the pool's rank-2 day (feature candidate #238).
        config:
          meta:
            feature: true
            categorical: false
            expression: "SIMILAR_DAY(MEAN(solar_radiation_mjm2, weight=population), gap=(2d, 335d), window=(30, 60), rank=2, holidays=similarity)"
      - name: similar_day_pool_rank3_popw_solar_radiation_mjm2
        data_type: double
        description: >
          The same on the pool's rank-3 day (feature candidate #238).
        config:
          meta:
            feature: true
            categorical: false
            expression: "SIMILAR_DAY(MEAN(solar_radiation_mjm2, weight=population), gap=(2d, 335d), window=(30, 60), rank=3, holidays=similarity)"
      - name: wavg_similar_day_pool_top3_popw_solar_radiation_mjm2
        data_type: double
        description: >
          The three ranks' radiation weighted by the job's inverse-distance weights, as the temperature mean is (feature candidate #238). Null where no rank has a value.
        config:
          meta:
            feature: true
            categorical: false
            expression: "SIMILAR_DAY_MEAN(MEAN(solar_radiation_mjm2, weight=population), gap=(2d, 335d), window=(30, 60), k=3, weight=inverse_distance, holidays=similarity)"
      - name: delta_similar_day_pool_rank1_popw_temperature_c
        data_type: double
        description: >
          D's population-weighted forecast temperature at this hour (ftr_hour_msm) minus similar_day_pool_rank1_popw_temperature_c, C: how far the target hour's weather sits from the weather the rank-1 day's load comes from; positive when D is warmer (feature candidate #237). Null without a forecast row or a sibling.
        config:
          meta:
            feature: true
            categorical: false
            expression: "MEAN(forecast_temperature_c, weight=population) - SIMILAR_DAY(MEAN(temperature_c, weight=population), gap=(2d, 335d), window=(30, 60), rank=1, holidays=similarity)"
      - name: delta_similar_day_pool_rank2_popw_temperature_c
        data_type: double
        description: >
          The same against the rank-2 day's temperature (feature candidate #237).
        config:
          meta:
            feature: true
            categorical: false
            expression: "MEAN(forecast_temperature_c, weight=population) - SIMILAR_DAY(MEAN(temperature_c, weight=population), gap=(2d, 335d), window=(30, 60), rank=2, holidays=similarity)"
      - name: delta_similar_day_pool_rank3_popw_temperature_c
        data_type: double
        description: >
          The same against the rank-3 day's temperature (feature candidate #237).
        config:
          meta:
            feature: true
            categorical: false
            expression: "MEAN(forecast_temperature_c, weight=population) - SIMILAR_DAY(MEAN(temperature_c, weight=population), gap=(2d, 335d), window=(30, 60), rank=3, holidays=similarity)"
      - name: delta_wavg_similar_day_pool_top3_popw_temperature_c
        data_type: double
        description: >
          The same against wavg_similar_day_pool_top3_popw_temperature_c (feature candidate #237).
        config:
          meta:
            feature: true
            categorical: false
            expression: "MEAN(forecast_temperature_c, weight=population) - SIMILAR_DAY_MEAN(MEAN(temperature_c, weight=population), gap=(2d, 335d), window=(30, 60), k=3, weight=inverse_distance, holidays=similarity)"
      - name: delta_similar_day_pool_rank1_popw_solar_radiation_mjm2
        data_type: double
        description: >
          D's population-weighted forecast solar radiation over this hour minus similar_day_pool_rank1_popw_solar_radiation_mjm2, MJ/m2; positive when D is forecast brighter than the rank-1 day (feature candidate #238). The observed side rests on the stations that record radiation, 55.4 % of the area; the forecast side on every station. Null without a forecast row or a sibling.
        config:
          meta:
            feature: true
            categorical: false
            expression: "MEAN(forecast_solar_radiation_mjm2, weight=population) - SIMILAR_DAY(MEAN(solar_radiation_mjm2, weight=population), gap=(2d, 335d), window=(30, 60), rank=1, holidays=similarity)"
      - name: delta_similar_day_pool_rank2_popw_solar_radiation_mjm2
        data_type: double
        description: >
          The same against the rank-2 day's radiation (feature candidate #238).
        config:
          meta:
            feature: true
            categorical: false
            expression: "MEAN(forecast_solar_radiation_mjm2, weight=population) - SIMILAR_DAY(MEAN(solar_radiation_mjm2, weight=population), gap=(2d, 335d), window=(30, 60), rank=2, holidays=similarity)"
      - name: delta_similar_day_pool_rank3_popw_solar_radiation_mjm2
        data_type: double
        description: >
          The same against the rank-3 day's radiation (feature candidate #238).
        config:
          meta:
            feature: true
            categorical: false
            expression: "MEAN(forecast_solar_radiation_mjm2, weight=population) - SIMILAR_DAY(MEAN(solar_radiation_mjm2, weight=population), gap=(2d, 335d), window=(30, 60), rank=3, holidays=similarity)"
      - name: delta_wavg_similar_day_pool_top3_popw_solar_radiation_mjm2
        data_type: double
        description: >
          The same against wavg_similar_day_pool_top3_popw_solar_radiation_mjm2 (feature candidate #238).
        config:
          meta:
            feature: true
            categorical: false
            expression: "MEAN(forecast_solar_radiation_mjm2, weight=population) - SIMILAR_DAY_MEAN(MEAN(solar_radiation_mjm2, weight=population), gap=(2d, 335d), window=(30, 60), k=3, weight=inverse_distance, holidays=similarity)"
      - name: similar_day_method
        data_type: string
        description: >
          similarity (the day was ranked) or same_holiday (the day took last year's same holiday).
        data_tests:
          - not_null
      - name: available_at
        data_type: timestamp
        description: >
          When the row became usable, naive JST, never after D's issue time: the latest of D's MSM forecast vintage (reference + 4 h, 01:00 on D-1), similar_day_fit_cutoff and the load availability of every day either variant used. Both variants sit on the one row, so a same-holiday row waits for its pool columns as well as for its reference's load.
        data_tests:
          - not_null
      - name: published_at
        data_type: timestamp
        description: >
          When the scoring run wrote the row (naive JST); breaks ties on available_at, newest wins.
        data_tests:
          - not_null

unit_tests:
  - name: ftr_period_similar_day_passes_every_run_through
    description: >
      Two scoring runs, each with a ranked day and a same-holiday day, pass
      through as four rows, the run id renamed. Two values are computed: each
      variant's rank-1 lag, the days from its day to the delivery day. On a
      ranked row the two variants are the same ranking, so the lags agree at 364
      and 363. On a same-holiday row the base carries last year's holiday, lag
      365 and no distance, while the pool columns keep the ranking it set aside,
      lag 366 with its distances and pool size.
    model: ftr_period_similar_day
    given:
      - input: ref('dim_area')
        rows:
          - {area_key: 1, area_code: tokyo}
      - input: ref('fct_area_weather_hourly')
        format: sql
        rows: |
          select 1 as area_key, date '2024-03-11' as date_key, 1 as hour_ending, cast(null as double) as popw_temperature_c, cast(null as double) as popw_solar_radiation_mjm2, timestamp '2024-03-11 02:00:00' as available_at where 1 = 0
      - input: ref('ftr_hour_msm')
        format: sql
        rows: |
          select 'tokyo' as area_code, date '2025-03-10' as trade_date, 1 as hour_ending, cast(null as double) as popw_forecast_temperature_c, cast(null as double) as popw_forecast_solar_radiation_mjm2, timestamp '2025-03-09 01:00:00' as available_at where 1 = 0
      - input: ref('stg_ml__similar_day')
        format: sql
        rows: |
          select
            'score-1' as run_id, 'tokyo' as area_code, date '2025-03-10' as trade_date, 1 as time_code,
            cast(504000 as double) as similar_day_rank1_demand_kwh,
            cast(497000 as double) as similar_day_rank2_demand_kwh,
            cast(511000 as double) as similar_day_rank3_demand_kwh,
            cast(503000 as double) as wavg_similar_day_top3_demand_kwh,
            date '2024-03-11' as similar_day_rank1_reference_date,
            date '2025-03-03' as similar_day_rank2_reference_date,
            date '2024-03-04' as similar_day_rank3_reference_date,
            cast(0.25 as double) as similar_day_rank1_distance,
            cast(0.5 as double) as similar_day_rank2_distance,
            cast(1.0 as double) as similar_day_rank3_distance,
            87 as similar_day_n_candidates,
            cast(504000 as double) as similar_day_pool_rank1_demand_kwh,
            cast(497000 as double) as similar_day_pool_rank2_demand_kwh,
            cast(511000 as double) as similar_day_pool_rank3_demand_kwh,
            cast(503000 as double) as wavg_similar_day_pool_top3_demand_kwh,
            date '2024-03-11' as similar_day_pool_rank1_reference_date,
            date '2025-03-03' as similar_day_pool_rank2_reference_date,
            date '2024-03-04' as similar_day_pool_rank3_reference_date,
