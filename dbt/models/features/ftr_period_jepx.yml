models:
  - name: ftr_period_jepx
    config:
      contract:
        enforced: true
    description: >
      The area spot price one day before each delivery period, the spot-price strategies' lag_1d_price, from fct_jepx_spot_area_price. Grain: area_code x trade_date x time_code. A period whose D-1 price is null (Hokkaido 2018-09) has no row. available_at is the D-1 row's: D-2 12:00.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - area_code
              - trade_date
              - time_code
    columns:
      - name: area_code
        data_type: string
        description: >
          dim_area.area_code of the bidding zone.
        data_tests:
          - not_null
      - name: trade_date
        data_type: date
        description: >
          The delivery day D (the price's day + 1).
        data_tests:
          - not_null
      - name: time_code
        data_type: int
        description: >
          JEPX time code 1-48 of the delivery period.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                max_value: 48
      - name: lag_1d_price
        data_type: double
        description: >
          Area price of the same period on D-1, JPY/kWh.
        config:
          meta:
            feature: true
            categorical: false
        data_tests:
          - not_null
      - name: available_at
        data_type: timestamp
        description: >
          When the row became public, naive JST: the D-1 price row's available_at, D-2 12:00.
        data_tests:
          - not_null

unit_tests:
  - name: ftr_period_jepx_shift_and_null_price
    description: >
      A price row moves one day forward with its available_at; a null price
      produces no lag row.
    model: ftr_period_jepx
    given:
      - input: ref('dim_area')
        rows:
          - {area_key: 1, area_code: tokyo}
      - input: ref('fct_jepx_spot_area_price')
        rows:
          - {date_key: 2025-03-01, time_code: 1, area_key: 1, area_price_jpy_kwh: 12.5, available_at: "2025-02-28 12:00:00"}
          - {date_key: 2025-03-01, time_code: 2, area_key: 1, area_price_jpy_kwh: null, available_at: "2025-02-28 12:00:00"}
    expect:
      rows:
        - {area_code: tokyo, trade_date: 2025-03-02, time_code: 1, lag_1d_price: 12.5, available_at: "2025-02-28 12:00:00"}
