  - name: ftr_period_actuals_neighbouring_periods_and_ramps
    description: >
      A few periods around midnight. For D = 03-10: D-7 is 03-03 and D-8 is
      03-02. Period 1's neighbours are 03-02 period 48 (900) and 03-03 period
      2 (1030), so its mean is (900 + 1000 + 1030) / 3 and its D-7 ramp 1000 -
      900 = 100. Period 48's t+1 is 03-04 period 1 (1150): mean (1200 + 1100 +
      1150) / 3, ramp 1100 - 1200 = -100. Period 47 has no t-1, so its mean
      takes the two values present and its ramp is null. The weekly ramps of
      period 1 are D-7's 100, D-14's 1010 - 950 = 60 and D-28's 1000 - 800 =
      200, and D-21's t-1 is a hole: the mean is 120.0.
      A neighbour alone makes no row.
    model: ftr_period_actuals
    given:
      - input: ref('dim_area')
        rows:
          - {area_key: 1, area_code: tokyo}
      - input: ref('ftr_day_calendar')
        rows:
          - {area_code: tokyo, trade_date: 2025-03-10, day_type: 0}
      - input: ref('fct_area_demand_generation_actual')
        format: sql
        rows: |
          select
            d as date_key,
            tc as time_code,
            1 as area_key,
            cast(v as bigint) as demand_kwh,
            timestamp '2025-03-05 00:30:00' as available_at
          from (values
            (date '2025-02-09', 48, 800),
            (date '2025-02-10', 1, 1000),
            (date '2025-02-16', 48, null),
            (date '2025-02-17', 1, 990),
            (date '2025-02-23', 48, 950),
            (date '2025-02-24', 1, 1010),
            (date '2025-03-02', 48, 900),
            (date '2025-03-03', 1, 1000),
            (date '2025-03-03', 2, 1030),
            (date '2025-03-03', 47, 1200),
            (date '2025-03-03', 48, 1100),
            (date '2025-03-04', 1, 1150)
          ) as t(d, tc, v)
