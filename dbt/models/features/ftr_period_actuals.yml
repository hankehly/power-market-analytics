  - name: ftr_period_actuals_weekly_lag_trend_std_median
    description: >
      One period on four Mondays, 02-03 = 100, 02-17 = 160, 02-24 = 250 and
      03-03 = 130 kWh, and a hole on 02-10. The trend is the least-squares
      slope of the weekly lags present against time in weeks, D-7 at -1 back
      to D-28 at -4: 03-03 fits D-7, D-14 and D-28 around the hole at D-21
      (660 / 14, rising); 03-24 has only D-21 and D-28 (-120 per week,
      falling). The standard deviation divides by n - 1 and the median takes
      the middle two of an even count; with one lag the trend and the
      standard deviation are null and the median is that lag (02-10, 03-31).
      The z-score scores D-7 against the prior weeks present: 03-03 has
      D-14 and D-28 around the hole (240 / (2 x sqrt(3600 / 2))); 03-10 has
      D-14 and D-21 (-150 / (2 x sqrt(8100 / 2))).
    model: ftr_period_actuals
    given:
      - input: ref('dim_area')
        rows:
          - {area_key: 1, area_code: tokyo}
      - input: ref('ftr_day_calendar')
        rows:
          - {area_code: tokyo, trade_date: 2025-03-03, day_type: 0}
      - input: ref('fct_area_demand_generation_actual')
        format: sql
        rows: |
          select
            d as date_key,
            1 as time_code,
            1 as area_key,
            cast(v as bigint) as demand_kwh,
            timestamp '2025-03-04 00:05:00' as available_at
          from (values
            (date '2025-02-03', 100),
            (date '2025-02-10', null),
            (date '2025-02-17', 160),
            (date '2025-02-24', 250),
            (date '2025-03-03', 130)
          ) as t(d, v)
    # Dict rows, so only the three columns are compared; each value is the
    # shortest decimal of the division in its comment, exact as a double.
    expect:
      rows:
        - {area_code: tokyo, trade_date: 2025-02-05, time_code: 1, trend_weekly_lags_demand_kwh: null, std_weekly_lags_demand_kwh: null, median_weekly_lags_demand_kwh: null, zscore_7d_vs_14d_28d_demand_kwh: null}
        - {area_code: tokyo, trade_date: 2025-02-06, time_code: 1, trend_weekly_lags_demand_kwh: null, std_weekly_lags_demand_kwh: null, median_weekly_lags_demand_kwh: null, zscore_7d_vs_14d_28d_demand_kwh: null}
