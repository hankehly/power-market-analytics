               ewm_5d_minus_weekly, available_at)
        cross join (select explode(sequence(1, 48)) as time_code) as p

  - name: ftr_period_actuals_ewm_5d_weights
    description: >
      One period on five days, 03-03 = 700, 03-04 = 600, 03-05 = 500,
      03-07 = 300, 03-08 = 200 kWh, and a hole on 03-06. ewm_5d weighs D-2,
      D-3, D-4, D-5 and D-6 by 16, 8, 4, 2, 1 over the days present: 03-10
      skips the hole at D-4 and leaves out 03-03, its D-7 (7200 / 27); 03-14
      has only 03-08, at D-6. From 03-15 no input is within D-6, so the value
      is null on the rows the longer lags keep. From 03-10 the D-7 lag gives
      the weekly mean too, and the difference is the two means' difference.
    model: ftr_period_actuals
    given:
      - input: ref('dim_area')
        rows:
          - {area_key: 1, area_code: tokyo}
      - input: ref('ftr_day_calendar')
        rows:
          - {area_code: tokyo, trade_date: 2025-03-10, day_type: 0}
      - input: ref('fct_area_demand_generation_actual')
        format: sql
        rows: |
          select
            d as date_key,
            1 as time_code,
            1 as area_key,
            cast(v as bigint) as demand_kwh,
            timestamp '2025-03-09 00:05:00' as available_at
          from (values
            (date '2025-03-03', 700),
            (date '2025-03-04', 600),
            (date '2025-03-05', 500),
            (date '2025-03-06', null),
            (date '2025-03-07', 300),
            (date '2025-03-08', 200)
          ) as t(d, v)
    # Dict rows, so only ewm_5d_demand_kwh is compared; each value is the
    # shortest decimal of the division in its comment, exact as a double.
    expect:
      rows:
        - {area_code: tokyo, trade_date: 2025-03-05, time_code: 1, ewm_5d_demand_kwh: 700.0, ewm_5d_minus_ewm_weekly_lags_demand_kwh: null}  # 11200 / 16
        - {area_code: tokyo, trade_date: 2025-03-06, time_code: 1, ewm_5d_demand_kwh: 633.3333333333334, ewm_5d_minus_ewm_weekly_lags_demand_kwh: null}  # 15200 / 24
