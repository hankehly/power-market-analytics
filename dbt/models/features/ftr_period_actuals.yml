models:
  - name: ftr_period_actuals
    config:
      contract:
        enforced: true
    description: >
      The area's own recent demand for each delivery period, from fct_area_demand_generation_actual: the demand 2, 3, 7, 9, 14, 21 and 28 days before, a plain and an exponentially weighted mean, a weighted standard deviation, a least-squares trend, a sample standard deviation, a median and the mean period-to-period ramp over the four weekly lags, D-7's z-score against D-14, D-21 and D-28, the D-2 minus D-9 change, D-7's mean with its neighbouring periods and its ramp from the period before, an exponentially weighted mean, a sample standard deviation and a weighted standard deviation over D-2 to D-6, the weighted mean's difference from the weekly one, and a plain and an exponentially weighted mean over the same period of the last four complete days of D's day type (the lag_7d_demand_kwh of research demand/R-001 to R-005; ewm_5d_demand_kwh, the weekly lags' trend, standard deviation and median, the D-7 z-score and the EWA difference added 2026-09-13, the standard deviations, the neighbouring-period mean and the ramps later that day; the rest research demand/R-006). Grain: area_code x trade_date x time_code. A row exists wherever at least one lag exists, D-4 to D-6 included; a column is null where its input is absent (a TSO hole, or a day before the history starts). The two four-input exponentially weighted means and the weekly weighted standard deviation use the weights 8, 4, 2, 1 from the newest input back, and the D-2 to D-6 ones the weights 16, 8, 4, 2, 1, tied to the input's position and renormalised over the inputs present. A neighbouring period is the one before or after on the timeline, so period 1's t-1 is period 48 of the day before and period 48's t+1 is period 1 of the day after. A complete day has all 48 periods non-null. available_at is the greatest over the rows shifted onto the row, the neighbouring periods included, so the whole row is usable only once its newest input is public.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - area_code
              - trade_date
              - time_code
      - dbt_utils.expression_is_true:
          arguments:
            expression: >
              coalesce(lag_2d_demand_kwh, lag_3d_demand_kwh, lag_7d_demand_kwh, lag_9d_demand_kwh,
              lag_14d_demand_kwh, lag_21d_demand_kwh, lag_28d_demand_kwh, ewm_5d_demand_kwh) is not null
      - dbt_utils.expression_is_true:
          arguments:
            expression: >
              (change_2d_9d_demand_kwh is null) = (lag_2d_demand_kwh is null or lag_9d_demand_kwh is null)
    columns:
      - name: area_code
        data_type: string
        description: >
          dim_area.area_code of the bidding zone.
        data_tests:
          - not_null
      - name: trade_date
        data_type: date
        description: >
          The delivery day D.
        data_tests:
          - not_null
      - name: time_code
        data_type: int
        description: >
          JEPX time code 1-48 of the delivery period.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                max_value: 48
      - name: lag_2d_demand_kwh
        data_type: bigint
        description: >
          Area demand over the same period on D-2, kWh. Public about 00:05 on D-1.
        config:
          meta:
            feature: true
            categorical: false
            expression: "LAG(demand_kwh, 2d)"
      - name: lag_3d_demand_kwh
        data_type: bigint
        description: >
          Area demand over the same period on D-3, kWh.
        config:
          meta:
            feature: true
            categorical: false
            expression: "LAG(demand_kwh, 3d)"
      - name: lag_7d_demand_kwh
        data_type: bigint
        description: >
          Area demand over the same period on D-7, kWh.
        config:
          meta:
            feature: true
            categorical: false
            expression: "LAG(demand_kwh, 7d)"
      - name: lag_9d_demand_kwh
        data_type: bigint
        description: >
          Area demand over the same period on D-9, kWh: the older side of change_2d_9d_demand_kwh.
        config:
          meta:
            feature: true
            categorical: false
            expression: "LAG(demand_kwh, 9d)"
      - name: lag_14d_demand_kwh
        data_type: bigint
        description: >
          Area demand over the same period on D-14, kWh.
        config:
          meta:
            feature: true
            categorical: false
            expression: "LAG(demand_kwh, 14d)"
      - name: lag_21d_demand_kwh
        data_type: bigint
        description: >
          Area demand over the same period on D-21, kWh.
        config:
          meta:
            feature: true
            categorical: false
            expression: "LAG(demand_kwh, 21d)"
      - name: lag_28d_demand_kwh
        data_type: bigint
        description: >
          Area demand over the same period on D-28, kWh.
        config:
          meta:
            feature: true
            categorical: false
            expression: "LAG(demand_kwh, 28d)"
      - name: mean_weekly_lags_demand_kwh
        data_type: double
        description: >
          Mean of the D-7, D-14, D-21 and D-28 lags present, kWh; null when none is.
        config:
          meta:
            feature: true
            categorical: false
            expression: "ROLLING_MEAN(demand_kwh, gap=7d, window=4, step=7d)"
      - name: ewm_weekly_lags_demand_kwh
        data_type: double
        description: >
          Exponentially weighted mean of the D-7, D-14, D-21 and D-28 lags with weights 8, 4, 2, 1, renormalised over the lags present, kWh; null when none is.
        config:
          meta:
            feature: true
            categorical: false
            expression: "EWA(demand_kwh, gap=7d, window=4, step=7d, halflife=1)"
      - name: ewstd_weekly_lags_demand_kwh
        data_type: double
        description: >
          Exponentially weighted standard deviation of the D-7, D-14, D-21 and D-28 lags, weights 8, 4, 2, 1, with the reliability-weight correction of pandas ewm().std(): sqrt(sum w (x - m)^2 / (V1 - V2 / V1)), where m is the weighted mean, V1 the sum of the weights and V2 the sum of their squares, over the lags present. With equal weights it is the sample standard deviation. kWh. Null with fewer than two lags.
        config:
          meta:
            feature: true
            categorical: false
            expression: "EWSTD(demand_kwh, gap=7d, window=4, step=7d, halflife=1)"
      - name: trend_weekly_lags_demand_kwh
        data_type: double
        description: >
          Least-squares slope of the D-7, D-14, D-21 and D-28 lags present against time in weeks, kWh per week: positive when demand in this period has been rising. With all four lags it is (3 x D-7 + D-14 - D-21 - 3 x D-28) / 10. Null with fewer than two lags.
        config:
          meta:
            feature: true
            categorical: false
            expression: "ROLLING_TREND(demand_kwh, gap=7d, window=4, step=7d)"
      - name: std_weekly_lags_demand_kwh
        data_type: double
        description: >
          Sample standard deviation (n - 1 in the denominator) of the D-7, D-14, D-21 and D-28 lags present, kWh. Null with fewer than two lags.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
        config:
          meta:
            feature: true
            categorical: false
            expression: "ROLLING_STD(demand_kwh, gap=7d, window=4, step=7d)"
      - name: median_weekly_lags_demand_kwh
        data_type: double
        description: >
          Median of the D-7, D-14, D-21 and D-28 lags present, kWh: the mean of the middle two when an even number is present. Null when none is.
        config:
          meta:
            feature: true
            categorical: false
            expression: "ROLLING_MEDIAN(demand_kwh, gap=7d, window=4, step=7d)"
      - name: zscore_7d_vs_14d_28d_demand_kwh
        data_type: double
        description: >
          How unusual D-7 was against the three weeks before it: (D-7 - mean) / s, where mean and s are the mean and sample standard deviation (n - 1 in the denominator) of the D-14, D-21 and D-28 lags present. Unitless. Null when D-7 is absent, fewer than two of the three weeks are present, or s is 0.
        config:
          meta:
            feature: true
            categorical: false
            expression: "ROLLING_ZSCORE(demand_kwh, 7d, gap=14d, window=3, step=7d)"
      - name: change_2d_9d_demand_kwh
        data_type: bigint
        description: >
          The D-2 lag minus the D-9 lag, kWh: the week-on-week change of the newest complete day. Null when either is absent.
        config:
          meta:
            feature: true
            categorical: false
            expression: "LAG(DIFF(demand_kwh, 7d), 2d)"
      - name: lag_7d_adjacent_mean_demand_kwh
        data_type: double
        description: >
          Mean of D-7's demand at the period before, this period and the period after, over the values present, kWh; null when none is. Robust to a small shift in the timing of the load.
        config:
          meta:
            feature: true
            categorical: false
            expression: "LAG(ROLLING_MEAN(demand_kwh, window=3, step=30m, center=true), 7d)"
      - name: lag_7d_ramp_demand_kwh
        data_type: bigint
        description: >
          D-7's demand at this period minus at the period before, kWh: whether demand was rising or falling at this time a week ago. Null when either is absent.
        config:
          meta:
            feature: true
            categorical: false
            expression: "LAG(DIFF(demand_kwh, 30m), 7d)"
      - name: mean_weekly_lags_ramp_demand_kwh
        data_type: double
        description: >
          Mean of the period-to-period ramps (this period minus the period before) of D-7, D-14, D-21 and D-28, over the ramps present, kWh; null when none is.
        config:
          meta:
            feature: true
            categorical: false
            expression: "ROLLING_MEAN(DIFF(demand_kwh, 30m), gap=7d, window=4, step=7d)"
      - name: mean_daytype_4d_demand_kwh
        data_type: double
        description: >
          Mean over the same period of the last four complete days of D's day type (ftr_day_calendar.day_type) at or before D-2, kWh; fewer days at the start of the history; null when there is none.
        config:
          meta:
            feature: true
            categorical: false
            expression: "ROLLING_MEAN(demand_kwh, gap=2d, window=4) by day_type"
      - name: ewm_daytype_4d_demand_kwh
        data_type: double
        description: >
          The same four days with weights 8, 4, 2, 1 from the newest back, renormalised over the days present, kWh.
        config:
          meta:
            feature: true
            categorical: false
            expression: "EWA(demand_kwh, gap=2d, window=4, halflife=1) by day_type"
      - name: ewm_5d_demand_kwh
        data_type: double
        description: >
          Exponentially weighted mean of the D-2, D-3, D-4, D-5 and D-6 demand over the same period with weights 16, 8, 4, 2, 1, renormalised over the days present, kWh; null when none is. The part of the past week that is public at 09:30 on D-1.
        config:
          meta:
            feature: true
            categorical: false
            expression: "EWA(demand_kwh, gap=2d, window=5, step=1d, halflife=1)"
      - name: std_5d_demand_kwh
        data_type: double
        description: >
          Sample standard deviation (n - 1 in the denominator) of the D-2, D-3, D-4, D-5 and D-6 demand over the same period, over the days present, kWh. Null with fewer than two.
        config:
          meta:
            feature: true
            categorical: false
            expression: "ROLLING_STD(demand_kwh, gap=2d, window=5, step=1d)"
      - name: ewstd_5d_demand_kwh
        data_type: double
        description: >
          Exponentially weighted standard deviation of the D-2, D-3, D-4, D-5 and D-6 demand over the same period, weights 16, 8, 4, 2, 1, with the reliability-weight correction of pandas ewm().std(): sqrt(sum w (x - m)^2 / (V1 - V2 / V1)), where m is the weighted mean, V1 the sum of the weights and V2 the sum of their squares, over the lags present. With equal weights it is the sample standard deviation. kWh. Null with fewer than two lags.
        config:
          meta:
            feature: true
            categorical: false
            expression: "EWSTD(demand_kwh, gap=2d, window=5, step=1d, halflife=1)"
      - name: ewm_5d_minus_ewm_weekly_lags_demand_kwh
        data_type: double
        description: >
          ewm_5d_demand_kwh minus ewm_weekly_lags_demand_kwh, kWh: the recent weighted level of this period against its weighted level on the same weekday over the last four weeks. Null when either is.
        config:
          meta:
            feature: true
            categorical: false
            expression: "EWA(demand_kwh, gap=2d, window=5, step=1d, halflife=1) - EWA(demand_kwh, gap=7d, window=4, step=7d, halflife=1)"
      - name: lag_2d_over_daily_mean_demand
        data_type: double
        description: >
          D-2's demand at the period over the mean of D-2's 48 periods: the shape of the day without its level, 1.0 at the day's average (feature candidate #137). One division, 48 x lag / the day's sum, so the integers stay exact. Null unless D-2 is complete, all 48 periods, or when its sum is 0.
        config:
          meta:
            feature: true
            categorical: false
            expression: "LAG(demand_kwh, 2d) / LAG(DAILY_MEAN(demand_kwh), 2d)"
      - name: lag_7d_over_daily_mean_demand
        data_type: double
        description: >
          D-7's demand at the period over the mean of D-7's 48 periods, as lag_2d_over_daily_mean_demand (feature candidate #137). Null unless D-7 is complete or when its sum is 0.
        config:
          meta:
            feature: true
            categorical: false
            expression: "LAG(demand_kwh, 7d) / LAG(DAILY_MEAN(demand_kwh), 7d)"
      - name: lag_2d_position_28d_demand
        data_type: double
        description: >
          Where D-2's demand at the period sits between the lowest and the highest of the same period over the 28 days D-2 to D-29, the values present: 0 at the lowest, 1 at the highest (feature candidate #149). D-2 is inside the window, so the value is within 0 to 1. Null when D-2 is absent or the highest equals the lowest.
        config:
          meta:
            feature: true
            categorical: false
            expression: "(LAG(demand_kwh, 2d) - ROLLING_MIN(demand_kwh, gap=2d, window=28, step=1d)) / (ROLLING_MAX(demand_kwh, gap=2d, window=28, step=1d) - ROLLING_MIN(demand_kwh, gap=2d, window=28, step=1d))"
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
      - name: rel_ewm_5d_minus_ewm_weekly_lags_demand
        data_type: double
        description: >
          ewm_5d_minus_ewm_weekly_lags_demand_kwh over ewm_weekly_lags_demand_kwh: the recent level against the weekly one as a fraction of the weekly one, -0.05 when the last five days ran 5 % under it (feature candidate #146). A fraction, not a percentage. Null when either mean is null or the weekly one is 0.
        config:
          meta:
            feature: true
            categorical: false
            expression: "(EWA(demand_kwh, gap=2d, window=5, step=1d, halflife=1) - EWA(demand_kwh, gap=7d, window=4, step=7d, halflife=1)) / EWA(demand_kwh, gap=7d, window=4, step=7d, halflife=1)"
      - name: rel_change_2d_9d_demand
        data_type: double
        description: >
          change_2d_9d_demand_kwh over lag_9d_demand_kwh: the week-on-week change from D-9 to D-2 as a fraction of D-9 (feature candidate #147). A fraction, not a percentage. Null when D-2 or D-9 is absent or D-9 is 0.
        config:
          meta:
            feature: true
            categorical: false
            expression: "LAG(DIFF(demand_kwh, 7d), 2d) / LAG(demand_kwh, 9d)"
      - name: lag_7d_minus_median_weekly_lags_demand_kwh
        data_type: double
        description: >
          lag_7d_demand_kwh minus median_weekly_lags_demand_kwh, kWh: how far D-7 sits from the middle of the four weekly lags present, itself among them (feature candidate #154). Null when D-7 is absent.
        config:
          meta:
            feature: true
            categorical: false
            expression: "LAG(demand_kwh, 7d) - ROLLING_MEDIAN(demand_kwh, gap=7d, window=4, step=7d)"
      - name: available_at
        data_type: timestamp
        description: >
          When the row became public, naive JST: the greatest available_at over the lag rows and the day-type window's days the row used.
        data_tests:
          - not_null

unit_tests:
  - name: ftr_period_actuals_lags_means_change_and_day_type_window
    description: >
      Five complete Saturdays (2025-01-25 = 40, 02-01 = 100, 02-08 = 220,
      02-15 = 280, 02-22 = 340 kWh in every period) and one all-null Saturday
      (03-01). Every actual feeds the ten delivery days it is a lag of. The
      weekly means take the D-7, D-14, D-21 and D-28 lags present with the
      weights 8, 4, 2, 1 of their positions (03-08 has no D-7: 2140 / 7); the
      trend, standard deviation and median take the same lags present, the
      first two null with a single lag (02-01, 03-22). The z-score scores D-7
      against the D-14, D-21 and D-28 present: 02-15 has two of them, 02-22
      and 03-01 all three, 02-08 only one (null). No row has both weighted
      means, so their difference is null throughout. The
      change is D-2 minus D-9, null when either is absent (03-03: 03-01 is a
      hole, so its row has a null lag_2d, not no row). A Saturday D takes the
      last four complete Saturdays at or before D-2: 03-01's window ends at
      02-22 and leaves 01-25 out; 03-08's skips the incomplete 03-01. Mondays
      and Tuesdays have no complete weekday, so their window is null. The
      02-01 file is public only 03-10, so every row that used it, through a
      lag or the window alone (03-08, 03-15, 03-22), carries that instant.
      ewm_5d takes D-2 to D-6, so each Saturday also feeds the Wednesday,
      Thursday and Friday after it: rows with no other value. With one
      Saturday a week a window holds one input at most, so the weights and
      the D-2 to D-6 standard deviations have their own test. The weekly
      weighted standard deviation takes the weekly lags present. The position
      reads the 28 days D-2 to D-29, so 02-17 and 02-24, which hold 02-01 in
      that window and in no lag, wait for its file too.
    model: ftr_period_actuals
    given:
      - input: ref('dim_area')
        rows:
          - {area_key: 1, area_code: tokyo}
      - input: ref('ftr_day_calendar')
        format: sql
        rows: |
          select
            'tokyo' as area_code,
            d as trade_date,
            case when dayofweek(d) in (1, 7) then 1 else 0 end as day_type
          from
            (select explode(sequence(date '2025-01-20', date '2025-03-31')) as d)
      - input: ref('fct_area_demand_generation_actual')
        format: sql
        rows: |
          select
            d as date_key,
            p as time_code,
            1 as area_key,
            case d
              when date '2025-01-25' then 40
              when date '2025-02-01' then 100
              when date '2025-02-08' then 220
              when date '2025-02-15' then 280
              when date '2025-02-22' then 340
            end as demand_kwh,
            case
              when d = date '2025-02-01' then timestamp '2025-03-10 00:05:00'
              else timestampadd(minute, 5, timestampadd(day, 1, cast(d as timestamp)))
            end as available_at
          from
            (select explode(array(
              date '2025-01-25', date '2025-02-01', date '2025-02-08',
              date '2025-02-15', date '2025-02-22', date '2025-03-01')) as d)
            cross join (select explode(sequence(1, 48)) as p)
    expect:
      format: sql
      rows: |
        select
          'tokyo' as area_code,
          t.trade_date,
          p.time_code,
          cast(t.lag_2d as bigint) as lag_2d_demand_kwh,
          cast(t.lag_3d as bigint) as lag_3d_demand_kwh,
          cast(t.lag_7d as bigint) as lag_7d_demand_kwh,
          cast(t.lag_9d as bigint) as lag_9d_demand_kwh,
          cast(t.lag_14d as bigint) as lag_14d_demand_kwh,
          cast(t.lag_21d as bigint) as lag_21d_demand_kwh,
          cast(t.lag_28d as bigint) as lag_28d_demand_kwh,
          cast(t.mean_weekly as double) as mean_weekly_lags_demand_kwh,
          cast(t.ewm_weekly as double) as ewm_weekly_lags_demand_kwh,
          cast(t.ewstd_weekly as double) as ewstd_weekly_lags_demand_kwh,
          cast(t.trend_weekly as double) as trend_weekly_lags_demand_kwh,
          cast(t.std_weekly as double) as std_weekly_lags_demand_kwh,
          cast(t.median_weekly as double) as median_weekly_lags_demand_kwh,
          cast(t.zscore_7d as double) as zscore_7d_vs_14d_28d_demand_kwh,
          cast(t.change as bigint) as change_2d_9d_demand_kwh,
          cast(t.mean_daytype as double) as mean_daytype_4d_demand_kwh,
          cast(t.ewm_daytype as double) as ewm_daytype_4d_demand_kwh,
          cast(t.ewm_5d as double) as ewm_5d_demand_kwh,
          cast(t.ewm_5d_minus_weekly as double) as ewm_5d_minus_ewm_weekly_lags_demand_kwh,
          -- One Saturday a week: never two values in D-2 to D-6.
          cast(null as double) as std_5d_demand_kwh,
          cast(null as double) as ewstd_5d_demand_kwh,
          -- Every period of a Saturday holds the same value, so D-7's mean with
          -- its neighbours is D-7 and its ramps are 0, except where a neighbour
          -- is another day: period 1's t-1 is a Friday with no data (null
          -- ramps), and on the Friday six days after a Saturday, period 48's t+1
          -- is that Saturday's period 1.
          cast(coalesce(t.lag_7d, sat.demand_kwh) as double) as lag_7d_adjacent_mean_demand_kwh,
          cast(case when p.time_code > 1 and t.lag_7d is not null then 0 end as bigint) as lag_7d_ramp_demand_kwh,
          cast(case when p.time_code > 1 and coalesce(t.lag_7d, t.lag_14d, t.lag_21d, t.lag_28d) is not null then 0 end as double)
            as mean_weekly_lags_ramp_demand_kwh,
          -- Every period of a Saturday holds the same value, so its load over
          -- its day's mean is exactly 1: 48 v / 48 v.
          cast(case when t.lag_2d is not null then 1 end as double) as lag_2d_over_daily_mean_demand,
          cast(case when t.lag_7d is not null then 1 end as double) as lag_7d_over_daily_mean_demand,
          -- The Saturdays rise, so D-2 is the highest of its 28 days: 1. 01-27
          -- has 01-25 alone in its window, so no range.
          cast(case when t.lag_2d is not null and t.trade_date > date '2025-01-27' then 1 end as double)
            as lag_2d_position_28d_demand,
          -- No row has both weighted means.
          cast(null as double) as rel_ewm_5d_minus_ewm_weekly_lags_demand,
          cast(t.change / t.lag_9d as double) as rel_change_2d_9d_demand,
          cast(t.lag_7d - t.median_weekly as double) as lag_7d_minus_median_weekly_lags_demand_kwh,
          t.available_at
        from (values
          (date '2025-01-27',   40, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null,   40, null, timestamp '2025-01-26 00:05:00'),
          (date '2025-01-28', null,   40, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null,   40, null, timestamp '2025-01-26 00:05:00'),
          (date '2025-01-29', null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null,   40, null, timestamp '2025-01-26 00:05:00'),
