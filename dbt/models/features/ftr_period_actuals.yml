          (date '2025-03-01', null, null,  340, null,  280,  220,  100,  235,  292, 1560 / 20, sqrt(126000 / 12), 250, 420 / (3 * sqrt(50400 / 6)), null,  235,  292, null, null, timestamp '2025-03-10 00:05:00'),
          (date '2025-03-03', null, null, null,  340, null, null, null, null, null, null, null, null, null, null, null, null, null, null, timestamp '2025-02-23 00:05:00'),
