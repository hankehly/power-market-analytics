  - name: ftr_period_actuals_ratios_position_and_relative_changes
    description: >
      One period on seven days: 03-01 = 0, 03-02 = 50, 03-03 = 300, 03-08 = 800,
      03-10 = 600, 03-29 = 450 and 03-30 = 700 kWh. The position puts D-2
      between the lowest and highest of D-2 to D-29, the values present: 03-31
      still holds 03-02, its D-29, the lowest of all ((450 - 50) / 750); 04-01
      has lost it at D-30 ((700 - 300) / 500, where keeping it would give
      650 / 750). 03-04 has one value in its window, so no range, and a row
      without D-2 has no position. A zero denominator gives null, not an error:
      03-10's D-9 is the 0 of 03-01, and 03-08's weekly mean is that 0 alone
      while its recent mean has two days. The relative values are fractions,
      not percentages. D-7 minus the weekly median is 0 with one weekly lag.
      No day has 48 periods, so both ratios to a day's mean are null. 03-03 was
      replaced and is public only on 04-15: every row that read it waits for
      it, 04-01 too, which read it through the 28-day window alone. The
      expected doubles are the same operations in the same order in Python.
    model: ftr_period_actuals
    given:
      - input: ref('dim_area')
        rows:
          - {area_key: 1, area_code: tokyo}
      - input: ref('ftr_day_calendar')
        rows:
          - {area_code: tokyo, trade_date: 2025-03-10, day_type: 0}
      - input: ref('fct_area_demand_generation_actual')
        format: sql
        rows: |
          select
            d as date_key,
            1 as time_code,
            1 as area_key,
            cast(v as bigint) as demand_kwh,
            a as available_at
          from (values
            (date '2025-03-01', 0, timestamp '2025-03-02 00:30:00'),
            (date '2025-03-02', 50, timestamp '2025-03-03 00:30:00'),
            (date '2025-03-03', 300, timestamp '2025-04-15 00:30:00'),
            (date '2025-03-08', 800, timestamp '2025-03-09 00:30:00'),
            (date '2025-03-10', 600, timestamp '2025-03-11 00:30:00'),
            (date '2025-03-29', 450, timestamp '2025-03-30 00:30:00'),
            (date '2025-03-30', 700, timestamp '2025-03-31 00:30:00')
          ) as t(d, v, a)
    expect:
      rows:
        - {area_code: tokyo, trade_date: 2025-03-03, time_code: 1, lag_2d_over_daily_mean_demand: null, lag_7d_over_daily_mean_demand: null, lag_2d_position_28d_demand: null, rel_ewm_5d_minus_ewm_weekly_lags_demand: null, rel_change_2d_9d_demand: null, lag_7d_minus_median_weekly_lags_demand_kwh: null, available_at: "2025-03-02 00:30:00"}
