models:
  - name: ftr_hour_msm
    config:
      contract:
        enforced: true
    description: >
      The MSM forecast for each delivery-day hour per bidding zone, one row per forecast vintage: the representative station's temperature (the demand lightgbm_msm feature) and the population-weighted temperature, humidity, rain, solar radiation, cloud cover (total, high, middle, low), wind (speed, u, v) and pressure (surface, sea-level) over the area's staffed stations with the latest census vintage's weights (lightgbm_msm_popw and the similar-day selector; tasks/demand/datasets.py), and the 不快指数 of the weighted temperature and humidity. Grain: area_code x trade_date x hour_ending x forecast_reference_at. available_at is the vintage's: reference + 4 h.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - area_code
              - trade_date
              - hour_ending
              - forecast_reference_at
    columns:
      - name: area_code
        data_type: string
        description: >
          dim_area.area_code of the bidding zone.
        data_tests:
          - not_null
      - name: trade_date
        data_type: date
        description: >
          The delivery day D the forecast hour falls on (hour-start date).
        data_tests:
          - not_null
      - name: hour_ending
        data_type: int
        description: >
          Forecast hour 1-24, hour ending, the JMA observation convention.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                max_value: 24
      - name: forecast_reference_at
        data_type: timestamp
        description: >
          The MSM run's reference time, naive JST (the vintage key).
        data_tests:
          - not_null
      - name: census_year
        data_type: int
        description: >
          Census vintage of the station weights applied (the latest loaded).
      - name: forecast_temperature_c
        data_type: double
        description: >
          Forecast temperature at the area's representative station, C.
        config:
          meta:
            feature: true
            categorical: false
            expression: "forecast_temperature_c"
      - name: popw_forecast_temperature_c
        data_type: double
        description: >
          Population-weighted forecast temperature over the area's stations, C, renormalised over the stations that have a value; the terms are added in station order, so the value is the same on every build (the ordered_weighted_mean macro).
        config:
          meta:
            feature: true
            categorical: false
            expression: "MEAN(forecast_temperature_c, weight=population)"
      - name: popw_forecast_relative_humidity_pct
        data_type: double
        description: >
          Population-weighted forecast relative humidity, %, renormalised over the stations that have a value and added in station order.
        config:
          meta:
            feature: true
            categorical: false
            expression: "MEAN(forecast_relative_humidity_pct, weight=population)"
      - name: popw_forecast_precipitation_mm
        data_type: double
        description: >
          Population-weighted forecast precipitation over the hour, mm, renormalised over the stations that have a value and added in station order.
        config:
          meta:
            feature: true
            categorical: false
            expression: "MEAN(forecast_precipitation_mm, weight=population)"
      - name: popw_forecast_solar_radiation_mjm2
        data_type: double
        description: >
          Population-weighted forecast global solar radiation over the hour, MJ/m2, renormalised over the stations that have a value and added in station order. MJ/m2 is the unit fct_jma_weather_hourly.solar_radiation_mjm2 observes in; the fact's shortwave_radiation_wm2 is the same field at 1 / 0.0036 the scale.
        config:
          meta:
            feature: true
            categorical: false
            expression: "MEAN(forecast_solar_radiation_mjm2, weight=population)"
      - name: popw_forecast_total_cloud_cover_pct
        data_type: double
        description: >
          Population-weighted forecast total cloud cover, %, renormalised over the stations that have a value and added in station order.
        config:
          meta:
            feature: true
            categorical: false
            expression: "MEAN(forecast_total_cloud_cover_pct, weight=population)"
      - name: popw_forecast_high_cloud_cover_pct
        data_type: double
        description: >
          Population-weighted forecast high cloud cover, %, renormalised over the stations that have a value and added in station order.
        config:
          meta:
            feature: true
            categorical: false
            expression: "MEAN(forecast_high_cloud_cover_pct, weight=population)"
      - name: popw_forecast_middle_cloud_cover_pct
        data_type: double
        description: >
          Population-weighted forecast middle cloud cover, %, renormalised over the stations that have a value and added in station order.
        config:
          meta:
            feature: true
            categorical: false
            expression: "MEAN(forecast_middle_cloud_cover_pct, weight=population)"
      - name: popw_forecast_low_cloud_cover_pct
        data_type: double
        description: >
          Population-weighted forecast low cloud cover, %, renormalised over the stations that have a value and added in station order.
        config:
          meta:
            feature: true
            categorical: false
            expression: "MEAN(forecast_low_cloud_cover_pct, weight=population)"
      - name: popw_forecast_wind_speed_ms
        data_type: double
        description: >
          Population-weighted forecast wind speed, m/s, renormalised over the stations that have a value and added in station order. A mean of speeds, so not the speed of the weighted u/v vector.
        config:
          meta:
            feature: true
            categorical: false
            expression: "MEAN(forecast_wind_speed_ms, weight=population)"
      - name: popw_forecast_u_wind_ms
        data_type: double
        description: >
          Population-weighted forecast eastward wind component, m/s, renormalised over the stations that have a value and added in station order.
        config:
          meta:
            feature: true
            categorical: false
            expression: "MEAN(forecast_u_wind_ms, weight=population)"
      - name: popw_forecast_v_wind_ms
        data_type: double
        description: >
          Population-weighted forecast northward wind component, m/s, renormalised over the stations that have a value and added in station order.
        config:
          meta:
            feature: true
            categorical: false
            expression: "MEAN(forecast_v_wind_ms, weight=population)"
      - name: popw_forecast_surface_pressure_hpa
        data_type: double
        description: >
          Population-weighted forecast surface pressure, hPa, renormalised over the stations that have a value and added in station order. Mostly set by the stations' altitudes; sea-level pressure is the comparable one.
        config:
          meta:
            feature: true
            categorical: false
            expression: "MEAN(forecast_surface_pressure_hpa, weight=population)"
      - name: popw_forecast_sea_level_pressure_hpa
        data_type: double
        description: >
          Population-weighted forecast sea-level pressure, hPa, renormalised over the stations that have a value and added in station order.
        config:
          meta:
            feature: true
            categorical: false
            expression: "MEAN(forecast_sea_level_pressure_hpa, weight=population)"
      - name: popw_forecast_discomfort_index
        data_type: double
        description: >
          The 不快指数 (discomfort index) of the population-weighted forecast temperature T, C, and relative humidity H, %: 0.81 T + 0.01 H (0.99 T - 14.3) + 46.3 (the discomfort_index macro; 木内 2001, 天気 48(9), eq. A1, the U.S. Weather Bureau's temperature-humidity index in C). The index of the two means, not the mean of the stations' indexes. Null when either mean is null. No unit; from 15 in Hokkaido's coldest hour to 87 in Tokyo's hottest humid one, 2019-04 to 2026-09. Below 14.4 C a higher humidity lowers it.
        config:
          meta:
            feature: true
            categorical: false
            expression: "DISCOMFORT_INDEX(MEAN(forecast_temperature_c, weight=population), MEAN(forecast_relative_humidity_pct, weight=population))"
      - name: cum_popw_forecast_solar_radiation_mjm2
        data_type: double
        description: >
          The delivery day's population-weighted forecast solar radiation added up from midnight through this hour, MJ/m2: how much sun has fallen so far (feature candidate #151). popw_forecast_solar_radiation_mjm2 summed over the hours 1 to this one of the same vintage, in hour order. It stops at the first hour without a value: from there on it is null for the rest of the day, a total that skipped an hour being too small. At hour 24 it is the day's total.
        config:
          meta:
            feature: true
            categorical: false
            expression: "CUM_SUM(MEAN(forecast_solar_radiation_mjm2, weight=population)) by trade_date"
      - name: available_at
        data_type: timestamp
        description: >
          When the row became public, naive JST: the vintage's available_at, reference + 4 h.
        data_tests:
          - not_null

unit_tests:
  - name: ftr_hour_msm_population_weights_latest_census_and_renormalisation
    description: >
      Two Tokyo stations with 2020 weights 0.75 / 0.25 and a 2015 vintage that
      must be ignored; one forecast hour. The representative station's own
      temperature, every weighted element (cloud, wind and pressure included),
      precipitation renormalised over the one station that reports it, and the
      vintage's available_at.
    model: ftr_hour_msm
    given:
      - input: ref('dim_area')
        rows:
          - {area_key: 1, area_code: tokyo, representative_jma_station_id: s1}
      - input: ref('fct_census_population_jma_station')
        rows:
          - {census_year: 2015, area_key: 1, station_id: s1, area_population_weight: 1.0}
          - {census_year: 2020, area_key: 1, station_id: s1, area_population_weight: 0.75}
          - {census_year: 2020, area_key: 1, station_id: s2, area_population_weight: 0.25}
      - input: ref('fct_jma_msm_weather_forecast_hourly')
        rows:
          - {station_id: s1, date_key: 2025-03-10, forecast_hour_start_at: "2025-03-10 00:00:00", forecast_reference_at: "2025-03-08 21:00:00", temperature_c: 10.0, relative_humidity_pct: 40.0, precipitation_mm: 0.0, solar_radiation_mjm2: 1.0, total_cloud_cover_pct: 40.0, high_cloud_cover_pct: 20.0, middle_cloud_cover_pct: 10.0, low_cloud_cover_pct: 30.0, wind_speed_ms: 2.0, u_wind_ms: 1.0, v_wind_ms: -1.0, surface_pressure_hpa: 1000.0, sea_level_pressure_hpa: 1010.0, available_at: "2025-03-09 01:00:00"}
          - {station_id: s2, date_key: 2025-03-10, forecast_hour_start_at: "2025-03-10 00:00:00", forecast_reference_at: "2025-03-08 21:00:00", temperature_c: 20.0, relative_humidity_pct: 80.0, precipitation_mm: null, solar_radiation_mjm2: 2.0, total_cloud_cover_pct: 80.0, high_cloud_cover_pct: 60.0, middle_cloud_cover_pct: 50.0, low_cloud_cover_pct: 70.0, wind_speed_ms: 6.0, u_wind_ms: 3.0, v_wind_ms: 1.0, surface_pressure_hpa: 1004.0, sea_level_pressure_hpa: 1014.0, available_at: "2025-03-09 01:00:00"}
    expect:
      rows:
        - {area_code: tokyo, trade_date: 2025-03-10, hour_ending: 1, forecast_reference_at: "2025-03-08 21:00:00", census_year: 2020, forecast_temperature_c: 10.0, popw_forecast_temperature_c: 12.5, popw_forecast_relative_humidity_pct: 50.0, popw_forecast_precipitation_mm: 0.0, popw_forecast_solar_radiation_mjm2: 1.25, popw_forecast_total_cloud_cover_pct: 50.0, popw_forecast_high_cloud_cover_pct: 30.0, popw_forecast_middle_cloud_cover_pct: 20.0, popw_forecast_low_cloud_cover_pct: 40.0, popw_forecast_wind_speed_ms: 3.0, popw_forecast_u_wind_ms: 1.5, popw_forecast_v_wind_ms: -0.5, popw_forecast_surface_pressure_hpa: 1001.0, popw_forecast_sea_level_pressure_hpa: 1011.0, available_at: "2025-03-09 01:00:00"}

  - name: ftr_hour_msm_discomfort_index_of_the_weighted_means
    description: >
      Two Tokyo stations with weights 0.75 / 0.25 over three forecast hours.
      The weighted temperature and humidity of hours 1 and 2 are the two worked
      examples of the 不快指数 (27 C and 55 % gives 75, 29 C and 70 % gives 80),
      and the index is taken of those means: the weighted mean of the stations'
      own indexes would be 75.155 and 79.9364. Hour 3 has no humidity, so its
      index is null. The expected doubles are 0.81 T + 0.01 H (0.99 T - 14.3)
      + 46.3 in Python, the same operations in the same order.
    model: ftr_hour_msm
    given:
      - input: ref('dim_area')
        rows:
          - {area_key: 1, area_code: tokyo, representative_jma_station_id: s1}
      - input: ref('fct_census_population_jma_station')
        rows:
          - {census_year: 2020, area_key: 1, station_id: s1, area_population_weight: 0.75}
          - {census_year: 2020, area_key: 1, station_id: s2, area_population_weight: 0.25}
      - input: ref('fct_jma_msm_weather_forecast_hourly')
        rows:
          - {station_id: s1, date_key: 2025-08-01, forecast_hour_start_at: "2025-08-01 00:00:00", forecast_reference_at: "2025-07-30 21:00:00", temperature_c: 26.0, relative_humidity_pct: 50.0, available_at: "2025-07-31 01:00:00"}
          - {station_id: s2, date_key: 2025-08-01, forecast_hour_start_at: "2025-08-01 00:00:00", forecast_reference_at: "2025-07-30 21:00:00", temperature_c: 30.0, relative_humidity_pct: 70.0, available_at: "2025-07-31 01:00:00"}
          - {station_id: s1, date_key: 2025-08-01, forecast_hour_start_at: "2025-08-01 01:00:00", forecast_reference_at: "2025-07-30 21:00:00", temperature_c: 28.0, relative_humidity_pct: 68.0, available_at: "2025-07-31 01:00:00"}
          - {station_id: s2, date_key: 2025-08-01, forecast_hour_start_at: "2025-08-01 01:00:00", forecast_reference_at: "2025-07-30 21:00:00", temperature_c: 32.0, relative_humidity_pct: 76.0, available_at: "2025-07-31 01:00:00"}
          - {station_id: s1, date_key: 2025-08-01, forecast_hour_start_at: "2025-08-01 02:00:00", forecast_reference_at: "2025-07-30 21:00:00", temperature_c: 27.0, relative_humidity_pct: null, available_at: "2025-07-31 01:00:00"}
          - {station_id: s2, date_key: 2025-08-01, forecast_hour_start_at: "2025-08-01 02:00:00", forecast_reference_at: "2025-07-30 21:00:00", temperature_c: 27.0, relative_humidity_pct: null, available_at: "2025-07-31 01:00:00"}
    expect:
      rows:
        - {area_code: tokyo, trade_date: 2025-08-01, hour_ending: 1, popw_forecast_temperature_c: 27.0, popw_forecast_relative_humidity_pct: 55.0, popw_forecast_discomfort_index: 75.0065}
        - {area_code: tokyo, trade_date: 2025-08-01, hour_ending: 2, popw_forecast_temperature_c: 29.0, popw_forecast_relative_humidity_pct: 70.0, popw_forecast_discomfort_index: 79.87700000000001}
        - {area_code: tokyo, trade_date: 2025-08-01, hour_ending: 3, popw_forecast_temperature_c: 27.0, popw_forecast_relative_humidity_pct: null, popw_forecast_discomfort_index: null}

  - name: ftr_hour_msm_cumulative_solar_radiation_from_midnight
    description: >
      One Tokyo station carrying the whole weight, so the weighted radiation is
      the station's. The day's radiation is added up from hour 1 through each
      hour, in hour order: 0.1, 0.2 and 0.3 give 0.6000000000000001 at hour 3,
      where the same three added in reverse give 0.6. The total stops at the
      first hour without a value: 2025-08-01 has none at hour 4, so hours 4 and
      5 are null, a total that skipped an hour being too small. 2025-08-02 has
      no row at all for hour 3, so hour 4 is null the same way. 2025-08-03 has
      two vintages, and each adds up its own hours: they are not pooled.
    model: ftr_hour_msm
    given:
      - input: ref('dim_area')
        rows:
          - {area_key: 1, area_code: tokyo, representative_jma_station_id: s1}
      - input: ref('fct_census_population_jma_station')
        rows:
          - {census_year: 2020, area_key: 1, station_id: s1, area_population_weight: 1.0}
      - input: ref('fct_jma_msm_weather_forecast_hourly')
        rows:
          - {station_id: s1, date_key: 2025-08-01, forecast_hour_start_at: "2025-08-01 00:00:00", forecast_reference_at: "2025-07-30 21:00:00", solar_radiation_mjm2: 0.1, available_at: "2025-07-31 01:00:00"}
          - {station_id: s1, date_key: 2025-08-01, forecast_hour_start_at: "2025-08-01 01:00:00", forecast_reference_at: "2025-07-30 21:00:00", solar_radiation_mjm2: 0.2, available_at: "2025-07-31 01:00:00"}
          - {station_id: s1, date_key: 2025-08-01, forecast_hour_start_at: "2025-08-01 02:00:00", forecast_reference_at: "2025-07-30 21:00:00", solar_radiation_mjm2: 0.3, available_at: "2025-07-31 01:00:00"}
          - {station_id: s1, date_key: 2025-08-01, forecast_hour_start_at: "2025-08-01 03:00:00", forecast_reference_at: "2025-07-30 21:00:00", solar_radiation_mjm2: null, available_at: "2025-07-31 01:00:00"}
          - {station_id: s1, date_key: 2025-08-01, forecast_hour_start_at: "2025-08-01 04:00:00", forecast_reference_at: "2025-07-30 21:00:00", solar_radiation_mjm2: 0.4, available_at: "2025-07-31 01:00:00"}
          - {station_id: s1, date_key: 2025-08-02, forecast_hour_start_at: "2025-08-02 00:00:00", forecast_reference_at: "2025-07-31 21:00:00", solar_radiation_mjm2: 1.0, available_at: "2025-08-01 01:00:00"}
          - {station_id: s1, date_key: 2025-08-02, forecast_hour_start_at: "2025-08-02 01:00:00", forecast_reference_at: "2025-07-31 21:00:00", solar_radiation_mjm2: 2.0, available_at: "2025-08-01 01:00:00"}
          - {station_id: s1, date_key: 2025-08-02, forecast_hour_start_at: "2025-08-02 03:00:00", forecast_reference_at: "2025-07-31 21:00:00", solar_radiation_mjm2: 4.0, available_at: "2025-08-01 01:00:00"}
          - {station_id: s1, date_key: 2025-08-03, forecast_hour_start_at: "2025-08-03 00:00:00", forecast_reference_at: "2025-08-01 21:00:00", solar_radiation_mjm2: 1.5, available_at: "2025-08-02 01:00:00"}
          - {station_id: s1, date_key: 2025-08-03, forecast_hour_start_at: "2025-08-03 01:00:00", forecast_reference_at: "2025-08-01 21:00:00", solar_radiation_mjm2: 2.5, available_at: "2025-08-02 01:00:00"}
          - {station_id: s1, date_key: 2025-08-03, forecast_hour_start_at: "2025-08-03 00:00:00", forecast_reference_at: "2025-08-01 09:00:00", solar_radiation_mjm2: 10.0, available_at: "2025-08-01 13:00:00"}
    expect:
      rows:
        - {area_code: tokyo, trade_date: 2025-08-01, hour_ending: 1, forecast_reference_at: "2025-07-30 21:00:00", popw_forecast_solar_radiation_mjm2: 0.1, cum_popw_forecast_solar_radiation_mjm2: 0.1}
        - {area_code: tokyo, trade_date: 2025-08-01, hour_ending: 2, forecast_reference_at: "2025-07-30 21:00:00", popw_forecast_solar_radiation_mjm2: 0.2, cum_popw_forecast_solar_radiation_mjm2: 0.30000000000000004}
        - {area_code: tokyo, trade_date: 2025-08-01, hour_ending: 3, forecast_reference_at: "2025-07-30 21:00:00", popw_forecast_solar_radiation_mjm2: 0.3, cum_popw_forecast_solar_radiation_mjm2: 0.6000000000000001}
        - {area_code: tokyo, trade_date: 2025-08-01, hour_ending: 4, forecast_reference_at: "2025-07-30 21:00:00", popw_forecast_solar_radiation_mjm2: null, cum_popw_forecast_solar_radiation_mjm2: null}
        - {area_code: tokyo, trade_date: 2025-08-01, hour_ending: 5, forecast_reference_at: "2025-07-30 21:00:00", popw_forecast_solar_radiation_mjm2: 0.4, cum_popw_forecast_solar_radiation_mjm2: null}
        - {area_code: tokyo, trade_date: 2025-08-02, hour_ending: 1, forecast_reference_at: "2025-07-31 21:00:00", popw_forecast_solar_radiation_mjm2: 1.0, cum_popw_forecast_solar_radiation_mjm2: 1.0}
        - {area_code: tokyo, trade_date: 2025-08-02, hour_ending: 2, forecast_reference_at: "2025-07-31 21:00:00", popw_forecast_solar_radiation_mjm2: 2.0, cum_popw_forecast_solar_radiation_mjm2: 3.0}
        - {area_code: tokyo, trade_date: 2025-08-02, hour_ending: 4, forecast_reference_at: "2025-07-31 21:00:00", popw_forecast_solar_radiation_mjm2: 4.0, cum_popw_forecast_solar_radiation_mjm2: null}
        - {area_code: tokyo, trade_date: 2025-08-03, hour_ending: 1, forecast_reference_at: "2025-08-01 21:00:00", popw_forecast_solar_radiation_mjm2: 1.5, cum_popw_forecast_solar_radiation_mjm2: 1.5}
        - {area_code: tokyo, trade_date: 2025-08-03, hour_ending: 2, forecast_reference_at: "2025-08-01 21:00:00", popw_forecast_solar_radiation_mjm2: 2.5, cum_popw_forecast_solar_radiation_mjm2: 4.0}
        - {area_code: tokyo, trade_date: 2025-08-03, hour_ending: 1, forecast_reference_at: "2025-08-01 09:00:00", popw_forecast_solar_radiation_mjm2: 10.0, cum_popw_forecast_solar_radiation_mjm2: 10.0}
