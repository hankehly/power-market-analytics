models:
  - name: ftr_day_msm
    config:
      contract:
        enforced: true
    description: >
      Day-level summaries of the MSM forecast for each delivery day per bidding zone, one row per forecast vintage: the maximum, minimum and mean over the day's 24 hours of ftr_hour_msm's population-weighted forecast temperature, and the hour of the maximum (feature candidate #132). Complete days only: those four columns are null unless all 24 hours of the vintage have a temperature. Also the morning trend of the same temperature over 06:00 to 10:00, which needs its four hours only (feature candidate #151). Grain: area_code x trade_date x forecast_reference_at. available_at is the latest of the day's hours: the vintage's, reference + 4 h.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - area_code
              - trade_date
              - forecast_reference_at
    columns:
      - name: area_code
        data_type: string
        description: >
          dim_area.area_code of the bidding zone.
        data_tests:
          - not_null
      - name: trade_date
        data_type: date
        description: >
          The delivery day D the forecast hours fall on.
        data_tests:
          - not_null
      - name: forecast_reference_at
        data_type: timestamp
        description: >
          The MSM run's reference time, naive JST (the vintage key).
        data_tests:
          - not_null
      - name: max_popw_forecast_temperature_c
        data_type: double
        description: >
          The highest of the day's 24 hourly population-weighted forecast temperatures, C. Null unless all 24 hours have one.
        config:
          meta:
            feature: true
            categorical: false
            expression: "DAILY_MAX(MEAN(forecast_temperature_c, weight=population))"
      - name: min_popw_forecast_temperature_c
        data_type: double
        description: >
          The lowest of the day's 24 hourly population-weighted forecast temperatures, C. Null unless all 24 hours have one.
        config:
          meta:
            feature: true
            categorical: false
            expression: "DAILY_MIN(MEAN(forecast_temperature_c, weight=population))"
      - name: mean_popw_forecast_temperature_c
        data_type: double
        description: >
          The mean of the day's 24 hourly population-weighted forecast temperatures, C, added in hour order so the value is the same on every build (the ordered_weighted_mean macro, every weight 1). Null unless all 24 hours have one.
        config:
          meta:
            feature: true
            categorical: false
            expression: "DAILY_MEAN(MEAN(forecast_temperature_c, weight=population))"
      - name: max_popw_forecast_temperature_hour_ending
        data_type: int
        description: >
          The hour ending, 1-24, of the day's highest hourly population-weighted forecast temperature; the earliest on a tie. Null unless all 24 hours have a temperature.
        config:
          meta:
            feature: true
            categorical: false
            expression: "DAILY_ARGMAX(MEAN(forecast_temperature_c, weight=population))"
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                max_value: 24
      - name: morning_trend_popw_forecast_temperature_c
        data_type: double
        description: >
          How fast the delivery day's morning warms: the least-squares slope of the population-weighted forecast temperature against the hour over the four hours ending 07:00 to 10:00, C per hour (feature candidate #151). Computed over differences, (3 (x10 - x7) + (x9 - x8)) / 10, the same slope as the textbook sums and better conditioned. Negative when the morning cools. Null unless all four hours have a temperature; unlike the day's four summaries it does not need the other twenty.
        config:
          meta:
            feature: true
            categorical: false
            expression: "DAILY_TREND(MEAN(forecast_temperature_c, weight=population), time=06:00-10:00)"
      - name: available_at
        data_type: timestamp
        description: >
          When the row became public, naive JST: the latest available_at of the day's hours in ftr_hour_msm.
        data_tests:
          - not_null

unit_tests:
  - name: ftr_day_msm_complete_days_tied_maximum_and_vintages
    description: >
      Three Tokyo delivery days with the same 24 temperatures. 2025-08-01 is
      complete: the maximum 33.1 falls on hours 14 and 15, so the hour is 14, the
      earliest; the mean is the 24 values added in hour order, which is
      28.549999999999997 (the same values added in reverse give 28.55); and
      available_at is hour 24's, the latest. 2025-08-02 has no temperature at
      hour 5, so its four columns are null. 2025-08-03 has hours 1-23 in one
      vintage and hour 24 only in another: neither vintage is complete, so both
      rows are null. Pooling the two vintages would make a complete day. The
      morning trend needs its four hours only, 07:00 to 10:00: it is there on
      the day without hour 5 and in the vintage without hour 24, where the
      day's four summaries are null, and null in the vintage that has hour 24
      alone. (3 (30.1 - 25.7) + (28.8 - 27.2)) / 10 = 1.4800000000000009.
    model: ftr_day_msm
    given:
      - input: ref('ftr_hour_msm')
        rows:
          - {area_code: tokyo, trade_date: 2025-08-01, hour_ending: 1, forecast_reference_at: "2025-07-30 21:00:00", popw_forecast_temperature_c: 25.9, available_at: "2025-07-31 01:00:00"}
