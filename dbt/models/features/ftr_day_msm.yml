  - name: ftr_day_msm_morning_trend_rising_flat_falling_and_a_missing_hour
    description: >
      Four days with the hours ending 07:00 to 10:00 only. The trend is the
      least-squares slope of the temperature against the hour, C per hour,
      written over differences: (3 (x10 - x7) + (x9 - x8)) / 10. 20, 22, 23, 27
      rises by 2.2; four times 25.5 gives 0; 24.3, 23.9, 23.1, 22.6 falls by
      -0.5899999999999995, the differences' own rounding, where the textbook
      (n Stx - St Sx) / (n Stt - St^2) gives -0.5900000000000318 by subtracting
      two large sums; a morning without hour 9 has no trend. No day has 24
      hours, so the four summaries are null.
    model: ftr_day_msm
    given:
      - input: ref('ftr_day_jma_obs')
        format: sql
        rows: |
          select cast(null as string) as area_code, cast(null as date) as trade_date,
            cast(null as double) as lag_2d_mean_popw_temperature_c,
            cast(null as double) as lag_2d_evening_mean_popw_temperature_c,
            cast(null as double) as lag_2d_mean_popw_solar_radiation_mjm2,
            cast(null as timestamp) as available_at
