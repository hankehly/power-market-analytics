  - name: ftr_day_msm_evening_and_radiation_means_and_the_deltas_to_d_2
    description: >
      One vintage per day, 24 hours each, the forecast temperature 20 + 0.5 x the hour
      (daily mean 26.25, evening hours 19 to 22 mean 30.25) and the forecast radiation
      0.5 every hour (mean 0.5), every sum exact. 2025-03-03 has a D-2 sibling row
      (16.25, 20.25, 0.25): the deltas are 10.0, 10.0 and 0.25. 2025-03-04 has no
      sibling row: its two means stand and its deltas are null. 2025-03-05 has no hour 20:
      the day is incomplete, so every mean and delta is null, the evening ones because
      the evening needs its four hours. A sibling row for 2025-03-06, a day with no
      vintage, makes no row. available_at stays the vintage's on every row: the sibling's
      01:00 on D-1 equals it.
    model: ftr_day_msm
    given:
      - input: ref('ftr_hour_msm')
        format: sql
        rows: |
          with hours as (select explode(sequence(1, 24)) as h)
          select 'tokyo' as area_code, date '2025-03-03' as trade_date, h as hour_ending,
            timestamp '2025-03-01 21:00:00' as forecast_reference_at,
            cast(20 + 0.5 * h as double) as popw_forecast_temperature_c,
            cast(0.5 as double) as popw_forecast_solar_radiation_mjm2,
            cast(null as double) as popw_forecast_precipitation_mm,
            timestamp '2025-03-02 01:00:00' as available_at
          from hours
          union all
          select 'tokyo', date '2025-03-04', h, timestamp '2025-03-02 21:00:00',
            cast(20 + 0.5 * h as double), cast(0.5 as double), cast(null as double),
            timestamp '2025-03-03 01:00:00'
          from hours
          union all
          select 'tokyo', date '2025-03-05', h, timestamp '2025-03-03 21:00:00',
            cast(20 + 0.5 * h as double), cast(0.5 as double), cast(null as double),
            timestamp '2025-03-04 01:00:00'
          from hours where h <> 20
      - input: ref('ftr_day_jma_obs')
        format: sql
        rows: |
          select 'tokyo' as area_code, date '2025-03-03' as trade_date,
            cast(16.25 as double) as lag_2d_mean_popw_temperature_c,
            cast(20.25 as double) as lag_2d_evening_mean_popw_temperature_c,
            cast(0.25 as double) as lag_2d_mean_popw_solar_radiation_mjm2,
            timestamp '2025-03-02 01:00:00' as available_at
          union all
          select 'tokyo', date '2025-03-06', cast(16.25 as double), cast(20.25 as double),
            cast(0.25 as double), timestamp '2025-03-05 01:00:00'
    expect:
      rows:
        - {area_code: tokyo, trade_date: 2025-03-03, forecast_reference_at: "2025-03-01 21:00:00", mean_popw_forecast_temperature_c: 26.25, evening_mean_popw_forecast_temperature_c: 30.25, mean_popw_forecast_solar_radiation_mjm2: 0.5, delta_lag_2d_mean_popw_temperature_c: 10.0, delta_lag_2d_evening_mean_popw_temperature_c: 10.0, delta_lag_2d_mean_popw_solar_radiation_mjm2: 0.25, available_at: "2025-03-02 01:00:00"}
        - {area_code: tokyo, trade_date: 2025-03-04, forecast_reference_at: "2025-03-02 21:00:00", mean_popw_forecast_temperature_c: 26.25, evening_mean_popw_forecast_temperature_c: 30.25, mean_popw_forecast_solar_radiation_mjm2: 0.5, delta_lag_2d_mean_popw_temperature_c: null, delta_lag_2d_evening_mean_popw_temperature_c: null, delta_lag_2d_mean_popw_solar_radiation_mjm2: null, available_at: "2025-03-03 01:00:00"}
        - {area_code: tokyo, trade_date: 2025-03-05, forecast_reference_at: "2025-03-03 21:00:00", mean_popw_forecast_temperature_c: null, evening_mean_popw_forecast_temperature_c: null, mean_popw_forecast_solar_radiation_mjm2: null, delta_lag_2d_mean_popw_temperature_c: null, delta_lag_2d_evening_mean_popw_temperature_c: null, delta_lag_2d_mean_popw_solar_radiation_mjm2: null, available_at: "2025-03-04 01:00:00"}

  - name: ftr_day_msm_previous_day_forecast_from_the_run_one_day_earlier
    description: >
      Tokyo, one run a day, 24 hours each unless said. 2025-03-02 (run 02-28 21:00) has
      the temperature 10 + 0.5 x the hour (mean 16.25, minimum 10.5, evening hours 19 to
      22 mean 20.25), radiation 0.25 and rain 0.125; no D-1 row, so its eight are null.
      2025-03-03 (run 03-01 21:00) has 20 + 0.5 x the hour (26.25, 20.5, 30.25), 0.5 and
      0.25: it reads 03-02's five values, the difference is 26.25 - 16.25 = 10.0, and with
      a D-2 sibling of 12.25 the change is 16.25 - 12.25 = 4.0 and the three-day mean
      (26.25 + 16.25 + 12.25) / 3 = 18.25, every sum exact. 2025-03-04 (run 03-02 21:00)
      has no hour 3: its own summaries are null, so the difference and the three-day mean
      are null, while its five lag columns read the complete 03-03. 2025-03-05 (run 03-03
      21:00) is complete but reads the incomplete 03-04: the mean, the minimum, the
      radiation mean and the rain mean are null, complete days only, while the evening
      mean stands at 30.25, since its four hours are there. 2025-03-06 has two runs, 03-04 21:00 complete and
      03-04 09:00 with hour 1 alone at 99 C. 2025-03-07 (run 03-05 21:00) reads 03-06
      under the run one day before its own, 03-04 21:00: 26.25, not 99; the 09:00 run's
      own row finds no run of 03-03 09:00 and has the eight null. available_at stays
      each vintage's own on every row.
    model: ftr_day_msm
    given:
      - input: ref('ftr_hour_msm')
        format: sql
        rows: |
          with hours as (select explode(sequence(1, 24)) as h)
          select 'tokyo' as area_code, date '2025-03-02' as trade_date, h as hour_ending,
            timestamp '2025-02-28 21:00:00' as forecast_reference_at,
            cast(10 + 0.5 * h as double) as popw_forecast_temperature_c,
            cast(0.25 as double) as popw_forecast_solar_radiation_mjm2,
            cast(0.125 as double) as popw_forecast_precipitation_mm,
            timestamp '2025-03-01 01:00:00' as available_at
          from hours
          union all
          select 'tokyo', date '2025-03-03', h, timestamp '2025-03-01 21:00:00',
            cast(20 + 0.5 * h as double), cast(0.5 as double), cast(0.25 as double),
            timestamp '2025-03-02 01:00:00'
          from hours
          union all
          select 'tokyo', date '2025-03-04', h, timestamp '2025-03-02 21:00:00',
            cast(20 + 0.5 * h as double), cast(0.5 as double), cast(0.25 as double),
            timestamp '2025-03-03 01:00:00'
          from hours where h <> 3
          union all
          select 'tokyo', date '2025-03-05', h, timestamp '2025-03-03 21:00:00',
            cast(20 + 0.5 * h as double), cast(0.5 as double), cast(0.25 as double),
            timestamp '2025-03-04 01:00:00'
          from hours
          union all
          select 'tokyo', date '2025-03-06', h, timestamp '2025-03-04 21:00:00',
            cast(20 + 0.5 * h as double), cast(0.5 as double), cast(0.25 as double),
            timestamp '2025-03-05 01:00:00'
          from hours
          union all
          select 'tokyo', date '2025-03-06', 1, timestamp '2025-03-04 09:00:00',
            cast(99 as double), cast(9 as double), cast(9 as double),
            timestamp '2025-03-04 13:00:00'
          union all
          select 'tokyo', date '2025-03-07', h, timestamp '2025-03-05 21:00:00',
            cast(20 + 0.5 * h as double), cast(0.5 as double), cast(0.25 as double),
            timestamp '2025-03-06 01:00:00'
          from hours
      - input: ref('ftr_day_jma_obs')
        format: sql
        rows: |
          select 'tokyo' as area_code, date '2025-03-03' as trade_date,
            cast(12.25 as double) as lag_2d_mean_popw_temperature_c,
            cast(14.25 as double) as lag_2d_evening_mean_popw_temperature_c,
            cast(0.125 as double) as lag_2d_mean_popw_solar_radiation_mjm2,
            timestamp '2025-03-02 01:00:00' as available_at
    expect:
