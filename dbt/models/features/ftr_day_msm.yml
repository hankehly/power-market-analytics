models:
  - name: ftr_day_msm
    config:
      contract:
        enforced: true
    description: >
      Day-level summaries of the MSM forecast for each delivery day per bidding zone, one row per forecast vintage: the maximum, minimum and mean over the day's 24 hours of ftr_hour_msm's population-weighted forecast temperature, and the hour of the maximum (feature candidate #132). Complete days only: those four columns are null unless all 24 hours of the vintage have a temperature. Also the morning trend of the same temperature over 06:00 to 10:00, which needs its four hours only (feature candidate #151). Since 2026-09-29 also the evening mean of the forecast temperature over the four hours ending 19:00 to 22:00 and the daily mean of the forecast radiation, and the differences of the daily mean, the evening mean and the radiation mean from D-2's observed ones in ftr_day_jma_obs (feature candidates #237 and #238). Since 2026-09-30 also D-1's daily mean, minimum, evening mean, radiation mean and rain mean, D's daily mean minus D-1's, D-1's minus D-2's observed one, and the mean of the three days, read off the mart's own row for D-1 under the run one day earlier (feature candidate #248). Grain: area_code x trade_date x forecast_reference_at. available_at is the latest of the day's hours: the vintage's, reference + 4 h.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - area_code
              - trade_date
              - forecast_reference_at
    columns:
      - name: area_code
        data_type: string
        description: >
          dim_area.area_code of the bidding zone.
        data_tests:
          - not_null
      - name: trade_date
        data_type: date
        description: >
          The delivery day D the forecast hours fall on.
        data_tests:
          - not_null
      - name: forecast_reference_at
        data_type: timestamp
        description: >
          The MSM run's reference time, naive JST (the vintage key).
        data_tests:
          - not_null
      - name: max_popw_forecast_temperature_c
        data_type: double
        description: >
          The highest of the day's 24 hourly population-weighted forecast temperatures, C. Null unless all 24 hours have one.
        config:
          meta:
            feature: true
            categorical: false
            expression: "DAILY_MAX(MEAN(forecast_temperature_c, weight=population))"
      - name: min_popw_forecast_temperature_c
        data_type: double
        description: >
          The lowest of the day's 24 hourly population-weighted forecast temperatures, C. Null unless all 24 hours have one.
        config:
          meta:
            feature: true
            categorical: false
            expression: "DAILY_MIN(MEAN(forecast_temperature_c, weight=population))"
      - name: mean_popw_forecast_temperature_c
        data_type: double
        description: >
          The mean of the day's 24 hourly population-weighted forecast temperatures, C, added in hour order so the value is the same on every build (the ordered_weighted_mean macro, every weight 1). Null unless all 24 hours have one.
        config:
          meta:
            feature: true
            categorical: false
            expression: "DAILY_MEAN(MEAN(forecast_temperature_c, weight=population))"
      - name: max_popw_forecast_temperature_hour_ending
        data_type: int
        description: >
          The hour ending, 1-24, of the day's highest hourly population-weighted forecast temperature; the earliest on a tie. Null unless all 24 hours have a temperature.
        config:
          meta:
            feature: true
            categorical: false
            expression: "DAILY_ARGMAX(MEAN(forecast_temperature_c, weight=population))"
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                max_value: 24
      - name: morning_trend_popw_forecast_temperature_c
        data_type: double
        description: >
          How fast the delivery day's morning warms: the least-squares slope of the population-weighted forecast temperature against the hour over the four hours ending 07:00 to 10:00, C per hour (feature candidate #151). Computed over differences, (3 (x10 - x7) + (x9 - x8)) / 10, the same slope as the textbook sums and better conditioned. Negative when the morning cools. Null unless all four hours have a temperature; unlike the day's four summaries it does not need the other twenty.
        config:
          meta:
            feature: true
            categorical: false
            expression: "DAILY_TREND(MEAN(forecast_temperature_c, weight=population), time=06:00-10:00)"
      - name: evening_mean_popw_forecast_temperature_c
        data_type: double
        description: >
          The mean of the population-weighted forecast temperature over the four hours
          ending 19:00 to 22:00, the load's evening window 18:00 to 22:00, C, added in hour
          order (the ordered_weighted_mean macro, weight 1): D's side of
          delta_lag_2d_evening_mean_popw_temperature_c (feature candidate #237). Null unless
          all four hours have a temperature; the other twenty are not needed.
        config:
          meta:
            feature: true
            categorical: false
            expression: "DAILY_MEAN(MEAN(forecast_temperature_c, weight=population), time=18:00-22:00)"
      - name: mean_popw_forecast_solar_radiation_mjm2
        data_type: double
        description: >
          The mean of the day's 24 hourly population-weighted forecast solar radiation,
          MJ/m2 per hour, added in hour order: D's side of
          delta_lag_2d_mean_popw_solar_radiation_mjm2 (feature candidate #238). Null unless
          all 24 hours have a value.
        config:
          meta:
            feature: true
            categorical: false
            expression: "DAILY_MEAN(MEAN(forecast_solar_radiation_mjm2, weight=population))"
      - name: delta_lag_2d_mean_popw_temperature_c
        data_type: double
        description: >
          mean_popw_forecast_temperature_c minus ftr_day_jma_obs.lag_2d_mean_popw_temperature_c:
          how far D's forecast daily mean sits from the observed one two days earlier, C;
          positive when D is warmer (feature candidate #237). It lives here because a delta
          needs the vintage, which this row already waits for. Null without a sibling row.
        config:
          meta:
            feature: true
            categorical: false
            expression: "DAILY_MEAN(MEAN(forecast_temperature_c, weight=population)) - LAG(DAILY_MEAN(MEAN(temperature_c, weight=population)), 2d)"
      - name: delta_lag_2d_evening_mean_popw_temperature_c
        data_type: double
        description: >
          evening_mean_popw_forecast_temperature_c minus
          ftr_day_jma_obs.lag_2d_evening_mean_popw_temperature_c, C (feature candidate #237).
        config:
          meta:
            feature: true
            categorical: false
            expression: "DAILY_MEAN(MEAN(forecast_temperature_c, weight=population), time=18:00-22:00) - LAG(DAILY_MEAN(MEAN(temperature_c, weight=population), time=18:00-22:00), 2d)"
      - name: delta_lag_2d_mean_popw_solar_radiation_mjm2
        data_type: double
        description: >
          mean_popw_forecast_solar_radiation_mjm2 minus
          ftr_day_jma_obs.lag_2d_mean_popw_solar_radiation_mjm2, MJ/m2 per hour; positive
          when D is forecast brighter (feature candidate #238). The observed side rests on
          the stations that record radiation, 55.4 % of the area; the forecast side on every
          station.
        config:
          meta:
            feature: true
            categorical: false
            expression: "DAILY_MEAN(MEAN(forecast_solar_radiation_mjm2, weight=population)) - LAG(DAILY_MEAN(MEAN(solar_radiation_mjm2, weight=population)), 2d)"
      - name: lag_1d_mean_popw_forecast_temperature_c
        data_type: double
        description: >
          D-1's mean_popw_forecast_temperature_c, C, read off the mart's own row for D-1:
          the 12 UTC run of D-3, the one the warehouse loaded as delivery day D-1, so the
          run one day before the run that gives D. Not an earlier copy of D's forecast
          (feature candidate #248; spec
          docs/superpowers/specs/2026-09-30-previous-day-forecast-weather-design.md). Null
          unless D-1 has all 24 hours under that run.
        config:
          meta:
            feature: true
            categorical: false
            expression: "LAG(DAILY_MEAN(MEAN(forecast_temperature_c, weight=population)), 1d)"
      - name: lag_1d_min_popw_forecast_temperature_c
        data_type: double
        description: >
          D-1's min_popw_forecast_temperature_c, C, from the same D-1 row: D-1's value is its own forecast, the run one day before D's, not a revision of D's
          (feature candidate #248). Null unless D-1 has all 24 hours.
        config:
          meta:
            feature: true
            categorical: false
            expression: "LAG(DAILY_MIN(MEAN(forecast_temperature_c, weight=population)), 1d)"
      - name: lag_1d_evening_mean_popw_forecast_temperature_c
        data_type: double
        description: >
          D-1's evening_mean_popw_forecast_temperature_c, C, the hours ending 19:00 to
          22:00, from the same D-1 row: D-1's value is its own forecast, the run one day before D's, not a revision of D's
          (feature candidate #248). Null unless D-1 has all four evening hours.
        config:
          meta:
            feature: true
            categorical: false
            expression: "LAG(DAILY_MEAN(MEAN(forecast_temperature_c, weight=population), time=18:00-22:00), 1d)"
      - name: lag_1d_mean_popw_forecast_solar_radiation_mjm2
        data_type: double
        description: >
          D-1's mean_popw_forecast_solar_radiation_mjm2, MJ/m2 per hour, from the same D-1
          row: D-1's value is its own forecast, the run one day before D's, not a revision of D's (feature
          candidate #248). Null unless D-1 has all 24 hours.
        config:
          meta:
            feature: true
            categorical: false
            expression: "LAG(DAILY_MEAN(MEAN(forecast_solar_radiation_mjm2, weight=population)), 1d)"
      - name: lag_1d_mean_popw_forecast_precipitation_mm
        data_type: double
        description: >
          The mean of D-1's 24 hourly population-weighted forecast precipitation, mm per
          hour, added in hour order (the ordered_weighted_mean macro, weight 1), from the
          same D-1 row: D-1's value is its own forecast, the run one day before D's, not a revision of D's
          (feature candidate #248). A mean and not a day's total: a tree splits the two the
          same way, and the radiation mean is per hour already. D's own rain mean is not a
          column. Null unless D-1 has all 24 hours.
        config:
          meta:
            feature: true
            categorical: false
            expression: "LAG(DAILY_MEAN(MEAN(forecast_precipitation_mm, weight=population)), 1d)"
      - name: delta_lag_1d_mean_popw_forecast_temperature_c
        data_type: double
        description: >
          mean_popw_forecast_temperature_c minus lag_1d_mean_popw_forecast_temperature_c:
          D's forecast daily mean minus D-1's, C; positive when D is forecast warmer than
          D-1. Both sides are forecasts — D-1's value is its own forecast, the run one day before D's, not a revision of D's —
          so the forecast's bias against the stations cancels (feature candidate #248).
          Null when either is.
        config:
          meta:
            feature: true
            categorical: false
            expression: "DIFF(DAILY_MEAN(MEAN(forecast_temperature_c, weight=population)), 1d)"
      - name: change_1d_2d_mean_popw_temperature_c
        data_type: double
        description: >
          lag_1d_mean_popw_forecast_temperature_c minus
          ftr_day_jma_obs.lag_2d_mean_popw_temperature_c: D-1's forecast daily mean minus
          D-2's observed one, C; positive when D-1 is forecast warmer than D-2 was, so the
          model can tell whether the change in the weather had arrived by D-1 (feature
          candidate #248). D-1's value is its own forecast, the run one day before D's, not a revision of D's. A forecast
          against an observation, as the delta_lag_2d columns are. Null when either is.
        config:
          meta:
            feature: true
            categorical: false
            expression: "LAG(DAILY_MEAN(MEAN(forecast_temperature_c, weight=population)), 1d) - LAG(DAILY_MEAN(MEAN(temperature_c, weight=population)), 2d)"
      - name: mean_3d_popw_temperature_c
        data_type: double
        description: >
          The mean of D's forecast daily mean, D-1's forecast daily mean and D-2's observed
          daily mean, C, added in that order and divided by 3 (feature candidate #248).
          D-1's value is its own forecast, the run one day before D's, not a revision of D's. Null unless all three are present.
        config:
          meta:
            feature: true
            categorical: false
            expression: "(DAILY_MEAN(MEAN(forecast_temperature_c, weight=population)) + LAG(DAILY_MEAN(MEAN(forecast_temperature_c, weight=population)), 1d) + LAG(DAILY_MEAN(MEAN(temperature_c, weight=population)), 2d)) / 3"
      - name: available_at
        data_type: timestamp
        description: >
          When the row became public, naive JST: the latest available_at of the day's hours in ftr_hour_msm, the vintage's, or the D-2 sibling's in ftr_day_jma_obs if later, which it never is (01:00 on D-1 both). The D-1 row's, a day earlier, never wins either.
        data_tests:
          - not_null

unit_tests:
  - name: ftr_day_msm_complete_days_tied_maximum_and_vintages
    description: >
      Three Tokyo delivery days with the same 24 temperatures. 2025-08-01 is
      complete: the maximum 33.1 falls on hours 14 and 15, so the hour is 14, the
      earliest; the mean is the 24 values added in hour order, which is
      28.549999999999997 (the same values added in reverse give 28.55); and
      available_at is hour 24's, the latest. 2025-08-02 has no temperature at
      hour 5, so its four columns are null. 2025-08-03 has hours 1-23 in one
      vintage and hour 24 only in another: neither vintage is complete, so both
      rows are null. Pooling the two vintages would make a complete day. The
      morning trend needs its four hours only, 07:00 to 10:00: it is there on
      the day without hour 5 and in the vintage without hour 24, where the
      day's four summaries are null, and null in the vintage that has hour 24
      alone. (3 (30.1 - 25.7) + (28.8 - 27.2)) / 10 = 1.4800000000000009.
    model: ftr_day_msm
    given:
      - input: ref('ftr_day_jma_obs')
        format: sql
        rows: |
          select cast(null as string) as area_code, cast(null as date) as trade_date,
            cast(null as double) as lag_2d_mean_popw_temperature_c,
            cast(null as double) as lag_2d_evening_mean_popw_temperature_c,
            cast(null as double) as lag_2d_mean_popw_solar_radiation_mjm2,
            cast(null as timestamp) as available_at
          where false
      - input: ref('ftr_hour_msm')
        rows:
          - {area_code: tokyo, trade_date: 2025-08-01, hour_ending: 1, forecast_reference_at: "2025-07-30 21:00:00", popw_forecast_temperature_c: 25.9, available_at: "2025-07-31 01:00:00"}
          - {area_code: tokyo, trade_date: 2025-08-01, hour_ending: 2, forecast_reference_at: "2025-07-30 21:00:00", popw_forecast_temperature_c: 25.4, available_at: "2025-07-31 01:00:00"}
