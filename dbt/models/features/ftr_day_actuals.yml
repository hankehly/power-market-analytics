  - name: ftr_day_actuals_shape_and_weights
    description: >
      Eight days of demand base + 10 x min(time_code, 49 - time_code) +
      (time_code^2 mod 7): a peak tied at time codes 24 and 25 (the earliest,
      24, wins) and ramps that are not straight lines. For D = 03-31: D-2
      (03-29, base 2000), D-3 (03-28, 1800) and D-6 (03-25, 1400) are complete
      and D-4 (03-27) is not, so the D-2 to D-6 means weigh 16, 8 and 1; D-7
      (03-24, 2100), D-14 (03-17, 2050) and D-28 (03-03, 1900) are complete and
      D-21 (03-10) is not, so the weekly means weigh 8, 4 and 1. Every value
      is the reference arithmetic's double: 03-31's load factor
      0.9487250966399048, morning ramp
      20.5, evening ramp
      -20.333333333333332, daily-max difference
      -157.23076923076906.
    model: ftr_day_actuals
    given:
      - input: ref('dim_area')
        rows:
          - {area_key: 1, area_code: tokyo}
