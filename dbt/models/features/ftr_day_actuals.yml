models:
  - name: ftr_day_actuals
    config:
      contract:
        enforced: true
    description: >
      The area's own recent daily demand for each delivery day, from the complete days of fct_area_demand_generation_actual (all 48 periods non-null). D-2, the newest complete day: its mean, maximum, minimum and maximum-minus-minimum (research demand/R-006; the minimum added 2026-09-13), and since 2026-09-13 its load factor, its mean over the morning (06:00-10:00), afternoon (13:00-17:00) and evening (18:00-22:00), the period of its peak and its morning and evening ramps. Then the exponentially weighted means of the daily maximum, mean and minimum over D-2 to D-6 and over D-7, D-14, D-21 and D-28, and the difference of each pair. Grain: area_code x trade_date. A row exists wherever any of those nine days is complete, so the D-2 columns are null where D-2 is not. The windows follow the weekday load shape of both areas: the morning rise, the flat stretch after the midday dip, and the evening decline. available_at is the greatest over the days the row used.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - area_code
              - trade_date
      - dbt_utils.expression_is_true:
          arguments:
            expression: >
              coalesce(lag_2d_mean_demand_kwh, ewm_5d_daily_mean_demand_kwh,
              ewm_weekly_lags_daily_mean_demand_kwh) is not null
      - dbt_utils.expression_is_true:
          arguments:
            expression: >
              (lag_2d_mean_demand_kwh is null) = (lag_2d_evening_ramp_demand_kwh is null)
    columns:
      - name: area_code
        data_type: string
        description: >
          dim_area.area_code of the bidding zone.
        data_tests:
          - not_null
      - name: trade_date
        data_type: date
        description: >
          The delivery day D.
        data_tests:
          - not_null
      - name: lag_2d_mean_demand_kwh
        data_type: double
        description: >
          Mean of D-2's 48 half-hourly demand values, kWh per period. Null when D-2 is not complete.
        config:
          meta:
            feature: true
            categorical: false
            expression: "LAG(DAILY_MEAN(demand_kwh), 2d)"
      - name: lag_2d_max_demand_kwh
        data_type: bigint
        description: >
          D-2's maximum half-hourly demand, kWh per period.
        config:
          meta:
            feature: true
            categorical: false
            expression: "LAG(DAILY_MAX(demand_kwh), 2d)"
      - name: lag_2d_min_demand_kwh
        data_type: bigint
        description: >
          D-2's minimum half-hourly demand, kWh per period.
        config:
          meta:
            feature: true
            categorical: false
            expression: "LAG(DAILY_MIN(demand_kwh), 2d)"
      - name: lag_2d_range_demand_kwh
        data_type: bigint
        description: >
          D-2's maximum minus minimum half-hourly demand, kWh per period.
        config:
          meta:
            feature: true
            categorical: false
            expression: "LAG(DAILY_RANGE(demand_kwh), 2d)"
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: lag_2d_load_factor_demand
        data_type: double
        description: >
          D-2's load factor: its mean over its maximum. Unitless.
        config:
          meta:
            feature: true
            categorical: false
            expression: "LAG(DAILY_MEAN(demand_kwh) / DAILY_MAX(demand_kwh), 2d)"
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
      - name: lag_2d_morning_mean_demand_kwh
        data_type: double
        description: >
          Mean of D-2's demand over the periods from 06:00 to 10:00 (time codes 13-20), kWh per period.
        config:
          meta:
            feature: true
            categorical: false
            expression: "LAG(DAILY_MEAN(demand_kwh, time=06:00-10:00), 2d)"
      - name: lag_2d_afternoon_mean_demand_kwh
        data_type: double
        description: >
          Mean of D-2's demand over the periods from 13:00 to 17:00 (time codes 27-34), kWh per period.
        config:
          meta:
            feature: true
            categorical: false
            expression: "LAG(DAILY_MEAN(demand_kwh, time=13:00-17:00), 2d)"
      - name: lag_2d_evening_mean_demand_kwh
        data_type: double
        description: >
          Mean of D-2's demand over the periods from 18:00 to 22:00 (time codes 37-44), kWh per period.
        config:
          meta:
            feature: true
            categorical: false
            expression: "LAG(DAILY_MEAN(demand_kwh, time=18:00-22:00), 2d)"
      - name: lag_2d_peak_time_code
        data_type: int
        description: >
          The time code (1-48) of D-2's highest demand; the earliest one on a tie. Numeric, not categorical: neighbouring periods are close.
        config:
          meta:
            feature: true
            categorical: false
            expression: "LAG(DAILY_ARGMAX(demand_kwh), 2d)"
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                max_value: 48
      - name: lag_2d_morning_ramp_demand_kwh
        data_type: double
        description: >
          The least-squares slope of D-2's demand against time over the periods from 06:00 to 10:00 (time codes 13-20), kWh per period per hour: positive when demand rose through the window.
        config:
          meta:
            feature: true
            categorical: false
            expression: "LAG(DAILY_TREND(demand_kwh, time=06:00-10:00), 2d)"
      - name: lag_2d_evening_ramp_demand_kwh
        data_type: double
        description: >
          The least-squares slope of D-2's demand against time over the periods from 18:00 to 22:00 (time codes 37-44), kWh per period per hour: positive when demand rose through the window.
        config:
          meta:
            feature: true
            categorical: false
            expression: "LAG(DAILY_TREND(demand_kwh, time=18:00-22:00), 2d)"
      - name: ewm_5d_daily_max_demand_kwh
        data_type: double
        description: >
          Exponentially weighted mean of the daily maximum of D-2, D-3, D-4, D-5 and D-6 with weights 16, 8, 4, 2, 1, renormalised over the complete days present, kWh per period; null when none is.
        config:
          meta:
            feature: true
            categorical: false
            expression: "EWA(DAILY_MAX(demand_kwh), gap=2d, window=5, step=1d, halflife=1)"
      - name: ewm_weekly_lags_daily_max_demand_kwh
        data_type: double
        description: >
          Exponentially weighted mean of the daily maximum of D-7, D-14, D-21 and D-28 with weights 8, 4, 2, 1, renormalised over the complete days present, kWh per period; null when none is.
        config:
          meta:
            feature: true
            categorical: false
            expression: "EWA(DAILY_MAX(demand_kwh), gap=7d, window=4, step=7d, halflife=1)"
      - name: ewm_5d_minus_ewm_weekly_lags_daily_max_demand_kwh
        data_type: double
        description: >
          ewm_5d_daily_max_demand_kwh minus ewm_weekly_lags_daily_max_demand_kwh, kWh per period: the recent weighted daily maximum against the same weekday's. Null when either is.
        config:
          meta:
            feature: true
            categorical: false
            expression: "EWA(DAILY_MAX(demand_kwh), gap=2d, window=5, step=1d, halflife=1) - EWA(DAILY_MAX(demand_kwh), gap=7d, window=4, step=7d, halflife=1)"
      - name: ewm_5d_daily_mean_demand_kwh
        data_type: double
        description: >
          Exponentially weighted mean of the daily mean of D-2, D-3, D-4, D-5 and D-6 with weights 16, 8, 4, 2, 1, renormalised over the complete days present, kWh per period; null when none is.
        config:
          meta:
            feature: true
            categorical: false
            expression: "EWA(DAILY_MEAN(demand_kwh), gap=2d, window=5, step=1d, halflife=1)"
      - name: ewm_weekly_lags_daily_mean_demand_kwh
        data_type: double
        description: >
          Exponentially weighted mean of the daily mean of D-7, D-14, D-21 and D-28 with weights 8, 4, 2, 1, renormalised over the complete days present, kWh per period; null when none is.
        config:
          meta:
            feature: true
            categorical: false
            expression: "EWA(DAILY_MEAN(demand_kwh), gap=7d, window=4, step=7d, halflife=1)"
      - name: ewm_5d_minus_ewm_weekly_lags_daily_mean_demand_kwh
        data_type: double
        description: >
          ewm_5d_daily_mean_demand_kwh minus ewm_weekly_lags_daily_mean_demand_kwh, kWh per period: the recent weighted daily mean against the same weekday's. Null when either is.
        config:
          meta:
            feature: true
            categorical: false
            expression: "EWA(DAILY_MEAN(demand_kwh), gap=2d, window=5, step=1d, halflife=1) - EWA(DAILY_MEAN(demand_kwh), gap=7d, window=4, step=7d, halflife=1)"
      - name: ewm_5d_daily_min_demand_kwh
        data_type: double
        description: >
          Exponentially weighted mean of the daily minimum of D-2, D-3, D-4, D-5 and D-6 with weights 16, 8, 4, 2, 1, renormalised over the complete days present, kWh per period; null when none is.
        config:
          meta:
            feature: true
            categorical: false
            expression: "EWA(DAILY_MIN(demand_kwh), gap=2d, window=5, step=1d, halflife=1)"
      - name: ewm_weekly_lags_daily_min_demand_kwh
        data_type: double
        description: >
          Exponentially weighted mean of the daily minimum of D-7, D-14, D-21 and D-28 with weights 8, 4, 2, 1, renormalised over the complete days present, kWh per period; null when none is.
        config:
          meta:
            feature: true
            categorical: false
            expression: "EWA(DAILY_MIN(demand_kwh), gap=7d, window=4, step=7d, halflife=1)"
      - name: ewm_5d_minus_ewm_weekly_lags_daily_min_demand_kwh
        data_type: double
        description: >
          ewm_5d_daily_min_demand_kwh minus ewm_weekly_lags_daily_min_demand_kwh, kWh per period: the recent weighted daily minimum against the same weekday's. Null when either is.
        config:
          meta:
            feature: true
            categorical: false
            expression: "EWA(DAILY_MIN(demand_kwh), gap=2d, window=5, step=1d, halflife=1) - EWA(DAILY_MIN(demand_kwh), gap=7d, window=4, step=7d, halflife=1)"
      - name: available_at
        data_type: timestamp
        description: >
          When the row became public, naive JST: the newest available_at among the complete days the row used.
        data_tests:
          - not_null

unit_tests:
  - name: ftr_day_actuals_one_complete_day
    description: >
      2025-03-01 is complete with demand 1000 + time_code, its period 48
      public five minutes after the rest; 2025-03-02 has a null period 48 and
      counts for nothing. 03-01 feeds the nine delivery days it is D-2 to D-6,
      D-7, D-14, D-21 or D-28 of. Only D = 03-03 has the D-2 columns: mean
      1024.5, max 1048, min 1001, range 47, load factor 1024.5 / 1048, window
      means 1016.5 / 1030.5 / 1040.5, peak at time code 48 and both ramps
      2 kWh per hour (1 per period). A weighted mean over one day is that day.
    model: ftr_day_actuals
    given:
      - input: ref('dim_area')
        rows:
          - {area_key: 1, area_code: tokyo}
      - input: ref('fct_area_demand_generation_actual')
        format: sql
        rows: |
          select
            d as date_key,
            p as time_code,
            1 as area_key,
            case when d = date '2025-03-02' and p = 48 then null else 1000 + p end as demand_kwh,
            case
              when d = date '2025-03-01' and p = 48 then timestamp '2025-03-02 00:10:00'
              else timestampadd(minute, 5, timestampadd(day, 1, cast(d as timestamp)))
            end as available_at
          from
            (select explode(array(date '2025-03-01', date '2025-03-02')) as d)
            cross join (select explode(sequence(1, 48)) as p)
    expect:
      rows:
        - {area_code: tokyo, trade_date: 2025-03-03, lag_2d_mean_demand_kwh: 1024.5, lag_2d_max_demand_kwh: 1048, lag_2d_min_demand_kwh: 1001, lag_2d_range_demand_kwh: 47, available_at: "2025-03-02 00:10:00", lag_2d_load_factor_demand: 0.9775763358778626, lag_2d_morning_mean_demand_kwh: 1016.5, lag_2d_afternoon_mean_demand_kwh: 1030.5, lag_2d_evening_mean_demand_kwh: 1040.5, lag_2d_peak_time_code: 48, lag_2d_morning_ramp_demand_kwh: 2.0, lag_2d_evening_ramp_demand_kwh: 2.0, ewm_5d_daily_max_demand_kwh: 1048.0, ewm_weekly_lags_daily_max_demand_kwh: null, ewm_5d_minus_ewm_weekly_lags_daily_max_demand_kwh: null, ewm_5d_daily_mean_demand_kwh: 1024.5, ewm_weekly_lags_daily_mean_demand_kwh: null, ewm_5d_minus_ewm_weekly_lags_daily_mean_demand_kwh: null, ewm_5d_daily_min_demand_kwh: 1001.0, ewm_weekly_lags_daily_min_demand_kwh: null, ewm_5d_minus_ewm_weekly_lags_daily_min_demand_kwh: null}
        - {area_code: tokyo, trade_date: 2025-03-04, lag_2d_mean_demand_kwh: null, lag_2d_max_demand_kwh: null, lag_2d_min_demand_kwh: null, lag_2d_range_demand_kwh: null, available_at: "2025-03-02 00:10:00", lag_2d_load_factor_demand: null, lag_2d_morning_mean_demand_kwh: null, lag_2d_afternoon_mean_demand_kwh: null, lag_2d_evening_mean_demand_kwh: null, lag_2d_peak_time_code: null, lag_2d_morning_ramp_demand_kwh: null, lag_2d_evening_ramp_demand_kwh: null, ewm_5d_daily_max_demand_kwh: 1048.0, ewm_weekly_lags_daily_max_demand_kwh: null, ewm_5d_minus_ewm_weekly_lags_daily_max_demand_kwh: null, ewm_5d_daily_mean_demand_kwh: 1024.5, ewm_weekly_lags_daily_mean_demand_kwh: null, ewm_5d_minus_ewm_weekly_lags_daily_mean_demand_kwh: null, ewm_5d_daily_min_demand_kwh: 1001.0, ewm_weekly_lags_daily_min_demand_kwh: null, ewm_5d_minus_ewm_weekly_lags_daily_min_demand_kwh: null}
