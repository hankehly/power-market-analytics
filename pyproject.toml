[project]
name = "power-market-analytics"
version = "0.1.0"
description = "Power market analytics"
readme = "docs/README.md"
requires-python = ">=3.13"
dependencies = [
    "dbt-core>=1.11.10",
    "plotly>=6.0",
    "dbt-spark[pyhive]>=1.10.1",
    "lightgbm>=4.6",
    # Pinned to match the mlflow server image in docker-compose.yaml; move both together.
    "mlflow==3.14.0",
    "pandas>=2.3.3",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "pyspark[ml,pandas-on-spark]==4.1.1",
    "pyyaml>=6.0",
    "requests>=2.32.0",
    "shap>=0.52.0",
    "loguru>=0.7.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["power_market_analytics"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.2",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Correctness (pycodestyle errors, pyflakes) + import sorting. Ruff's wider
# default set (naming, datetime, mutability opinions) is intentionally off.
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Coverage is switched on by `just test` (`--cov --cov-report=term-missing`); a bare
# `uv run pytest` stays uninstrumented. `scripts/` is measured too because the CLI
# entry points are exercised directly (see tests/test_kansai_scripts.py).
[tool.coverage.run]
source = ["power_market_analytics", "scripts"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
