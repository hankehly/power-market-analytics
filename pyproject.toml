[project]
name = "power-market-analytics"
version = "0.1.0"
description = "Power market analytics"
readme = "docs/README.md"
requires-python = ">=3.13"
dependencies = [
    "dbt-core>=1.11.10",
    "plotly>=6.0",
    "dbt-spark[pyhive]>=1.10.1",
    "eccodes>=2.47",
    # ecCodes' native library: the `eccodes` wheel is pure Python everywhere but
    # Windows and loads libeccodes at import time, so the binary must be declared
    # explicitly (uv locks `eccodes` without its own conditional `eccodeslib`
    # requirement, and eccodeslib publishes no Windows wheel).
    "eccodeslib>=2.48 ; sys_platform != 'win32'",
    "lightgbm>=4.6",
    # Pinned to match the mlflow server image in docker-compose.yaml; move both together.
    "mlflow==3.14.0",
    "pandas>=2.3.3",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "pyspark[ml,pandas-on-spark]==4.1.1",
    "pyyaml>=6.0",
    "requests>=2.32.0",
    "scipy>=1.18",
    "shap>=0.52.0",
    "loguru>=0.7.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["power_market_analytics"]

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "pandas-stubs>=3.0.5.260730",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.2",
    "types-pyyaml>=6.0.12.20260815",
]

[tool.mypy]
files = ["power_market_analytics", "scripts", "tests"]
# Bodies of untyped functions (mostly test helpers) are not checked — mypy's
# default; silence the per-function reminder notes so real findings stand out.
disable_error_code = ["annotation-unchecked"]

# Libraries that ship no type stubs or py.typed marker.
[[tool.mypy.overrides]]
module = ["eccodes.*", "gribapi.*", "plotly.*", "scipy.*", "shap.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Correctness (pycodestyle errors, pyflakes) + import sorting. Ruff's wider
# default set (naming, datetime, mutability opinions) is intentionally off.
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Coverage is switched on by `just test` (`--cov --cov-report=term-missing`); a bare
# `uv run pytest` stays uninstrumented. `scripts/` is measured too because the CLI
# entry points are exercised directly (see tests/test_kansai_scripts.py).
[tool.coverage.run]
source = ["power_market_analytics", "scripts"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
# The suite is gated at full coverage — locally (`just test`) and in CI
# (.github/workflows/ci.yml) alike; pytest-cov reads this as its
# --cov-fail-under default.
fail_under = 100
# The `if __name__ == "__main__": main()` guard is the one line a test cannot
# reach by importing a script; every main() is exercised directly instead.
exclude_also = ['if __name__ == "__main__":']
