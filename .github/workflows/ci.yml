name: ci

# On every push (and on demand): the unit tests with their coverage gate, a
# ruff lint pass, a mypy type-check, a checkov scan of the IaC, an audit of the
# locked dependencies, and a parse of the dbt project. All the gates live in the
# repo config — coverage in pyproject.toml ([tool.coverage.report] fail_under),
# ruff in [tool.ruff], mypy in [tool.mypy], checkov in .checkov.yaml, the
# pip-audit ignore list and zizmor's persona in the justfile recipes, the dbt
# project under dbt/ — so `just test` / `just lint` / `just mypy` /
# `just checkov` / `just pip-audit` / `just zizmor` / `just dbt parse` locally
# and these jobs fail on exactly the same conditions.
#
# Every `uses:` is pinned to a commit SHA with the version as a trailing
# comment: a tag can be repointed by the action owner, and Dependabot
# (.github/dependabot.yml) rewrites the SHA and the comment together so the pin
# stays current rather than merely frozen. The zizmor job enforces both that
# and `persist-credentials: false`, which stops checkout leaving the job token
# in .git/config where a later step could read it.
on:
  push:
  workflow_dispatch:

# A newer push to the same branch supersedes a run still in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: pytest + coverage (100%)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # The suite starts a local SparkSession (PySpark 4 → JDK 17+); pin the
      # bind address so the JVM never has to resolve the runner's hostname.
      SPARK_LOCAL_IP: 127.0.0.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Install dependencies (locked)
        run: uv sync --locked

      # Same command as `just test`; coverage config (sources, branch mode,
      # fail_under = 100) comes from pyproject.toml.
      - name: Run tests with coverage
        run: uv run pytest --cov --cov-report=term-missing

  lint:
    name: ruff check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          python-version: "3.13"

      # Ruff comes from the dev dependency group; the project's runtime deps
      # (PySpark etc.) aren't needed to lint.
      - name: Install dev dependencies (locked)
        run: uv sync --locked --only-group dev

      # Same check as `just lint`; rule selection and line length come from
      # pyproject.toml [tool.ruff].
      - name: Run ruff
        run: uv run --no-sync ruff check .

  mypy:
    name: mypy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          python-version: "3.13"

      # Full dependency set: unlike ruff, mypy resolves types against the
      # runtime libraries (PySpark, MLflow, pandas stubs).
      - name: Install dependencies (locked)
        run: uv sync --locked

      # Same check as `just mypy`; the checked packages and per-module
      # overrides come from pyproject.toml [tool.mypy].
      - name: Run mypy
        run: uv run --no-sync mypy

  checkov:
    name: checkov (IaC + secrets)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      # Same command as `just checkov`; frameworks, skip paths and output
      # options come from .checkov.yaml. Version pinned here and in the
      # justfile — bump both together.
      - name: Run checkov
        run: uvx checkov@3.3.11

  pip-audit:
    name: pip-audit (dependency advisories)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      # Unlike the other jobs this one runs the just recipe rather than
      # repeating its command. The recipe carries the --ignore-vuln list, and
      # that list — one entry per advisory a dbt pin puts out of reach, each
      # with its reason — must have exactly one definition to stay honest.
      # No dependency install: the audit reads uv.lock, not the environment.
      - name: Run pip-audit
        run: uvx --from rust-just@1.58.0 just pip-audit

  zizmor:
    name: zizmor (workflow hardening)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      # Same command as `just zizmor`; the persona and the scanned path live in
      # the recipe, the version is pinned in both — bump together. GH_TOKEN
      # switches on zizmor's online audits (stale-action-refs and friends); the
      # workflow's read-only token is all they need, and a bare local run is
      # the weaker one, so local can only miss what this job then catches.
      - name: Run zizmor
        run: uvx zizmor@1.30.1 --persona=regular .github/workflows/
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dbt-parse:
    name: dbt parse
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # No telemetry ping from a CI runner.
      DBT_SEND_ANONYMOUS_USAGE_STATS: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          python-version: "3.13"

      # dbt-core and the dbt-spark adapter are runtime dependencies of the
      # project (the profile's `type: spark` needs the adapter registered
      # even to parse), so this is the full locked install, like mypy's.
      - name: Install dependencies (locked)
        run: uv sync --locked

      # dbt_packages/ is gitignored; dbt deps installs the versions pinned in
      # dbt/package-lock.yml (dbt_utils, whose macros the generic tests use).
      - name: Install dbt packages (locked)
        run: uv run --no-sync dbt deps
        working-directory: dbt

      # Same as `just dbt parse`: a full parse of the project — model and
      # source YAML, enforced contracts, ref/source resolution, Jinja, test
      # arguments — which never opens a connection, so the profile's
      # thriftserver host (dbt/profiles.yml) is never resolved. The data
      # tests still need the warehouse: `just dbt build`.
      - name: Run dbt parse
        run: uv run --no-sync dbt parse
        working-directory: dbt

      # power_market_analytics/features/views.py is generated from the manifest
      # dbt parse just wrote; a stale checked-in copy fails here (`just feature-views`).
      - name: Check the generated feature views are current
        run: uv run --no-sync python scripts/generate_feature_views.py --check
