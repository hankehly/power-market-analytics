<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>power-market-analytics</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@5/dist/themes/core.min.css">
</head>
<body class="sidebar-chevron-right sidebar-group-box">
  <div id="app"></div>
  <script src="//cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
  <script>
    mermaid.initialize({ startOnLoad: false });
    window.$docsify = {
      name: 'power-market-analytics',
      loadSidebar: true,
      subMaxLevel: 3,
      // Full-text search over the pages reachable from _sidebar.md
      // ('auto' discovers them from the sidebar). depth: 3 matches
      // subMaxLevel, so a hit lands on the nearest ### heading.
      search: {
        paths: 'auto',
        depth: 3,
        placeholder: 'Search the docs',
        noData: 'No matches.',
      },
      markdown: {
        renderer: {
          // docsify 5 renderers take a marked token, not (code, lang).
          code: function (token) {
            if (token.lang === 'mermaid') {
              return '<pre class="mermaid">' + token.text + '</pre>';
            }
            return this.origin.code.apply(this, arguments);
          },
        },
      },
      plugins: [
        function (hook) {
          hook.doneEach(function () {
            mermaid.run({ querySelector: '.mermaid' });
          });
        },
      ],
    };
  </script>
  <script src="//cdn.jsdelivr.net/npm/docsify@5/dist/docsify.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify@5/dist/plugins/search.min.js"></script>
</body>
</html>
